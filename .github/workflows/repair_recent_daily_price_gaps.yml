name: Repair Recent Daily Price Gaps
run-name: Repair Recent Daily Price Gaps | correlation=${{ inputs.dispatch_correlation_id }}

on:
  workflow_dispatch:
    inputs:
      dispatch_correlation_id:
        description: "Optional identifier for a single dispatch correlation id"
        required: false
        default: "manual"
        type: string
      as_of_date:
        description: "Optional recovery date in YYYYMMDD. Empty means today in Asia/Taipei; a trading date is included."
        required: false
        default: ""
        type: string
      lookback_days:
        description: "Recent trading-date window to inspect, including as_of_date when it is a trading day"
        required: false
        default: "7"
        type: string
      max_repair_dates:
        description: "Safety limit for automatic recent missing-date repairs"
        required: false
        default: "5"
        type: string
      max_structured_replay_dates:
        description: "Independent safety limit for bounded structured objective-source catch-up"
        required: false
        default: "10"
        type: string
      check_code:
        description: "Optional stock code to check during underlying date repair"
        required: false
        default: "5291"
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: daily-full-pipeline-${{ github.ref }}
  cancel-in-progress: false

jobs:
  repair-recent-daily-price-gaps:
    runs-on: ubuntu-latest
    outputs:
      caller_repair_workflow_blob_sha: ${{ steps.caller_workflows.outputs.repair_blob_sha }}
      caller_replay_workflow_blob_sha: ${{ steps.caller_workflows.outputs.replay_blob_sha }}
      repair_target_date: ${{ steps.repair_result.outputs.target_end_date }}
      repair_action_count: ${{ steps.repair_result.outputs.action_count }}
      source_bundle_manifest_path: ${{ steps.source_bundle.outputs.manifest_path }}
      source_bundle_manifest_sha256: ${{ steps.source_bundle.outputs.manifest_sha256 }}
      source_bundle_sha: ${{ steps.source_bundle.outputs.source_bundle_sha }}
      source_bundle_release_id: ${{ steps.source_bundle.outputs.release_id }}
      source_bundle_commit_sha: ${{ steps.persist_bundle.outputs.source_bundle_commit_sha }}
      published_head_sha: ${{ steps.persist_bundle.outputs.published_head_sha }}

    steps:
      - name: Reject non-main production dispatch
        if: github.ref_name != 'main'
        run: |
          echo "::error::Repair Recent Daily Price Gaps is production-only on main."
          exit 1

      - name: Require production artifact write deploy key
        shell: bash
        env:
          PRODUCTION_ARTIFACT_WRITE_DEPLOY_KEY: ${{ secrets.PRODUCTION_ARTIFACT_WRITE_DEPLOY_KEY }}
        run: |
          if [ -z "${PRODUCTION_ARTIFACT_WRITE_DEPLOY_KEY}" ]; then
            echo "::error::PRODUCTION_ARTIFACT_WRITE_DEPLOY_KEY is required for artifact publishing."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ssh-key: ${{ secrets.PRODUCTION_ARTIFACT_WRITE_DEPLOY_KEY }}
          persist-credentials: true
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify and capture caller-pinned workflow definitions
        id: caller_workflows
        shell: bash
        env:
          CALLER_SHA: ${{ github.sha }}
        run: |
          checkout_sha="$(git rev-parse HEAD)"
          git fetch origin main
          remote_main_sha="$(git rev-parse origin/main)"
          if [[ ! "$CALLER_SHA" =~ ^[0-9a-f]{40}$ ]] || \
             [ "$checkout_sha" != "$CALLER_SHA" ] || \
             ! git merge-base --is-ancestor "$checkout_sha" "$remote_main_sha"; then
            echo "::error::Recent repair checkout must equal the pinned event SHA and remain an ancestor of current main."
            exit 1
          fi
          echo "REPAIR_BASE_SHA=$checkout_sha" >> "$GITHUB_ENV"
          repair_blob_sha="$(git rev-parse "${CALLER_SHA}:.github/workflows/repair_recent_daily_price_gaps.yml")"
          replay_blob_sha="$(git rev-parse "${CALLER_SHA}:.github/workflows/historical_structured_source_replay.yml")"
          checkout_repair_blob_sha="$(git rev-parse HEAD:.github/workflows/repair_recent_daily_price_gaps.yml)"
          checkout_replay_blob_sha="$(git rev-parse HEAD:.github/workflows/historical_structured_source_replay.yml)"
          if [[ ! "$repair_blob_sha" =~ ^[0-9a-f]{40}$ ]] || \
             [[ ! "$replay_blob_sha" =~ ^[0-9a-f]{40}$ ]] || \
             [ "$checkout_repair_blob_sha" != "$repair_blob_sha" ] || \
             [ "$checkout_replay_blob_sha" != "$replay_blob_sha" ]; then
            echo "::error::Executing workflow definitions differ from the checked-out main definitions."
            exit 1
          fi
          echo "repair_blob_sha=$repair_blob_sha" >> "$GITHUB_OUTPUT"
          echo "replay_blob_sha=$replay_blob_sha" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests lxml html5lib tabulate

      - name: Repair recent daily price gaps
        env:
          AS_OF_DATE: ${{ inputs.as_of_date }}
          LOOKBACK_DAYS: ${{ inputs.lookback_days }}
          MAX_REPAIR_DATES: ${{ inputs.max_repair_dates }}
          CHECK_CODE: ${{ inputs.check_code }}
        run: |
          args=(
            --lookback-days "$LOOKBACK_DAYS"
            --max-repair-dates "$MAX_REPAIR_DATES"
            --retries 2
            --sleep-seconds 5
            --rebuild-history-if-repaired
          )
          if [ -n "$AS_OF_DATE" ]; then
            args+=(--as-of-date "$AS_OF_DATE")
          else
            taipei_hour="$(TZ=Asia/Taipei date +%H)"
            if [[ ! "$taipei_hour" =~ ^([01][0-9]|2[0-3])$ ]]; then
              echo "::error::Unable to resolve a valid Asia/Taipei hour for the live repair window."
              exit 1
            fi
            if [ "$((10#$taipei_hour))" -lt 18 ]; then
              args+=(--exclude-as-of-date)
            fi
          fi
          if [ -n "$CHECK_CODE" ]; then
            args+=(--check-code "$CHECK_CODE")
          fi
          python scripts/repair_recent_daily_price_gaps.py "${args[@]}"

      - name: Summarize recent repair result
        id: repair_result
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report = Path("output/latest/recent_daily_price_gap_repair_latest.json")
          payload = json.loads(report.read_text(encoding="utf-8-sig")) if report.exists() else {}
          actions = payload.get("actions") or []
          values = {
              "REPAIR_STATUS": payload.get("status", ""),
              "REPAIR_ACTION_COUNT": len(actions),
              "REPAIR_TARGET_DATE": payload.get("target_end_date", ""),
          }
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as handle:
              for key, value in values.items():
                  handle.write(f"{key}={value}\n")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"target_end_date={values['REPAIR_TARGET_DATE']}\n")
              handle.write(f"action_count={values['REPAIR_ACTION_COUNT']}\n")
          PY

      - name: Validate repaired target-date identity
        env:
          REPAIR_TARGET_DATE: ${{ steps.repair_result.outputs.target_end_date }}
        run: |
          if [[ ! "$REPAIR_TARGET_DATE" =~ ^20[0-9]{6}$ ]]; then
            echo "::error::Recent repair target date is invalid or missing: $REPAIR_TARGET_DATE"
            exit 1
          fi

      - name: Validate exact repaired target-date continuity
        env:
          REPAIR_TARGET_DATE: ${{ steps.repair_result.outputs.target_end_date }}
        run: |
          python scripts/validate_daily_price_history_continuity.py --main-price-date "$REPAIR_TARGET_DATE"

      - name: Build immutable current-day source recovery bundle
        id: source_bundle
        env:
          SOURCE_RECOVERY_RELEASE_ID: daily-source-${{ steps.repair_result.outputs.target_end_date }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          python -B scripts/daily_source_recovery_bundle.py build \
            --repo-root . \
            --trading-date "$REPAIR_TARGET_DATE" \
            --release-id "$SOURCE_RECOVERY_RELEASE_ID" \
            --source-base-sha "$REPAIR_BASE_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --github-output "$GITHUB_OUTPUT"
          echo "release_id=$SOURCE_RECOVERY_RELEASE_ID" >> "$GITHUB_OUTPUT"

      - name: Upload recent daily price gap repair evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: recent-daily-price-gap-repair
          path: |
            output/latest/recent_daily_price_gap_repair_latest.json
            output/latest/recent_daily_price_gap_repair_latest.md
            output/latest/repair_daily_price_range_latest.*
            output/latest/repair_daily_price_range_check_code_latest.csv
            output/latest/official_daily_price_latest.csv
            output/latest/official_price_fetch_latest.json
            output/latest/official_price_fetch_latest.md
            output/latest/stock_price_history_manifest.*
            output/latest/daily_price_history_continuity_latest.*
            output/history/daily_source_bundles/${{ steps.repair_result.outputs.target_end_date }}/${{ steps.source_bundle.outputs.release_id }}/
          if-no-files-found: ignore
          retention-days: 30

      - name: Stage exact current-day source recovery bundle
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add data/daily_price/ || true
          git add data/stock_price_history/
          git add output/latest/recent_daily_price_gap_repair_latest.* || true
          git add output/latest/repair_daily_price_range_latest.* || true
          git add output/latest/repair_daily_price_range_check_code_latest.csv || true
          git add output/latest/stock_price_history_manifest.* || true
          git add output/latest/daily_price_history_continuity_latest.* || true
          git add output/latest/official_daily_price_latest.csv
          git add output/latest/official_price_fetch_latest.json
          git add output/latest/official_price_fetch_latest.md
          git add docs/latest/stock_price_history_manifest.* || true
          git add output/history/daily_source_bundles/"$REPAIR_TARGET_DATE"/"${{ steps.source_bundle.outputs.release_id }}"/
          git status --short
          if git diff --cached --quiet; then
            echo "::error::Immutable source bundle produced no staged commit."
            exit 1
          fi

      - name: Validate exact staged current-day source recovery bundle
        run: |
          python scripts/validate_recent_daily_price_repair_staged_paths.py \
            --target-date "$REPAIR_TARGET_DATE" \
            --source-base-sha "$REPAIR_BASE_SHA" \
            --manifest-path "${{ steps.source_bundle.outputs.manifest_path }}" \
            --manifest-sha256 "${{ steps.source_bundle.outputs.manifest_sha256 }}" \
            --source-bundle-sha "${{ steps.source_bundle.outputs.source_bundle_sha }}"

      - name: Commit repaired recent daily price gaps
        id: persist_bundle
        shell: bash
        run: |
          set -euo pipefail
          staged_paths_file="$RUNNER_TEMP/repair-source-bundle-staged-paths.z"
          git diff --cached --name-only --no-renames -z > "$staged_paths_file"
          head_before_commit="$(git rev-parse HEAD)"
          if [ "$head_before_commit" != "$REPAIR_BASE_SHA" ]; then
            echo "::error::Repair HEAD changed before the unique source-bundle domain commit."
            exit 1
          fi
          commit_count_before="$(git rev-list --count HEAD)"
          git commit -m "Persist ${REPAIR_TARGET_DATE} daily source recovery bundle"
          commit_count_after="$(git rev-list --count HEAD)"
          source_bundle_commit_sha="$(git rev-parse HEAD)"
          source_bundle_commit_count="$(git rev-list --count "$REPAIR_BASE_SHA..$source_bundle_commit_sha")"
          if [ "$((commit_count_after - commit_count_before))" -ne 1 ] || \
             [ "$source_bundle_commit_count" -ne 1 ] || \
             [[ ! "$source_bundle_commit_sha" =~ ^[0-9a-f]{40}$ ]] || \
             ! git merge-base --is-ancestor "$REPAIR_BASE_SHA" "$source_bundle_commit_sha"; then
            echo "::error::Repair must create exactly one source-bundle domain commit above REPAIR_BASE_SHA."
            exit 1
          fi
          published=false
          published_head_sha=""
          candidate_published_head_sha=""
          fetch_main_bounded() {
            for fetch_attempt in 1 2 3; do
              if git fetch origin main && \
                 remote_main_sha="$(git rev-parse origin/main)" && \
                 [[ "$remote_main_sha" =~ ^[0-9a-f]{40}$ ]]; then
                return 0
              fi
              sleep 5
            done
            return 1
          }
          for push_attempt in 1 2 3; do
            if ! fetch_main_bounded; then
              continue
            fi
            if [[ "$candidate_published_head_sha" =~ ^[0-9a-f]{40}$ ]] && \
               git merge-base --is-ancestor "$source_bundle_commit_sha" "$candidate_published_head_sha" && \
               git merge-base --is-ancestor "$candidate_published_head_sha" "$remote_main_sha"; then
              published=true
              published_head_sha="$candidate_published_head_sha"
              break
            fi
            if ! git merge-base --is-ancestor "$REPAIR_BASE_SHA" "$remote_main_sha"; then
              echo "::error::Current main is not a descendant of the pinned repair base."
              exit 1
            fi
            comparison_base="$REPAIR_BASE_SHA"
            if git merge-base --is-ancestor "$source_bundle_commit_sha" "$remote_main_sha"; then
              comparison_base="$source_bundle_commit_sha"
            fi
            python - "$comparison_base" "$remote_main_sha" "$staged_paths_file" <<'PY'
          import subprocess
          import sys
          from pathlib import Path

          changed = {
              item.decode("utf-8", errors="strict")
              for item in subprocess.check_output(
                  ["git", "diff", "--name-only", "--no-renames", "-z", sys.argv[1], sys.argv[2], "--"]
              ).split(b"\0")
              if item
          }
          staged = {
              item.decode("utf-8", errors="strict")
              for item in Path(sys.argv[3]).read_bytes().split(b"\0")
              if item
          }
          overlap = sorted(changed & staged)
          if overlap:
              raise SystemExit(
                  "moving main overlaps staged repair source-bundle paths: "
                  + ",".join(overlap)
              )
          PY
            if ! git merge-base --is-ancestor "$remote_main_sha" HEAD; then
              git merge --no-edit "$remote_main_sha"
            fi
            candidate_published_head_sha="$(git rev-parse HEAD)"
            if [[ ! "$candidate_published_head_sha" =~ ^[0-9a-f]{40}$ ]] || \
               ! git merge-base --is-ancestor "$source_bundle_commit_sha" "$candidate_published_head_sha"; then
              echo "::error::Repair source-bundle publish candidate is invalid."
              exit 1
            fi
            if git push origin HEAD:main; then
              published=true
              published_head_sha="$candidate_published_head_sha"
              break
            fi
            sleep 5
          done
          if [ "$published" != true ] && \
             [[ "$candidate_published_head_sha" =~ ^[0-9a-f]{40}$ ]] && \
             fetch_main_bounded && \
             git merge-base --is-ancestor "$source_bundle_commit_sha" "$candidate_published_head_sha" && \
             git merge-base --is-ancestor "$candidate_published_head_sha" "$remote_main_sha"; then
            published=true
            published_head_sha="$candidate_published_head_sha"
          fi
          if [ "$published" != true ]; then
            echo "::error::Unable to publish repair source bundle after three normal non-force attempts."
            exit 1
          fi
          echo "source_bundle_commit_sha=$source_bundle_commit_sha" >> "$GITHUB_OUTPUT"
          echo "published_head_sha=$published_head_sha" >> "$GITHUB_OUTPUT"

  plan-structured-objective-source-catch-up:
    needs: repair-recent-daily-price-gaps
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      should_replay: ${{ steps.structured_replay_plan.outputs.should_replay }}
      start_date: ${{ steps.structured_replay_plan.outputs.start_date }}
      end_date: ${{ steps.structured_replay_plan.outputs.end_date }}
      price_history_high_water_date: ${{ steps.structured_replay_plan.outputs.price_history_high_water_date }}
      repair_taifex_base_date: ${{ steps.structured_replay_plan.outputs.repair_taifex_base_date }}
      expected_main_sha: ${{ steps.structured_replay_plan.outputs.expected_main_sha }}

    steps:
      - name: Checkout published source-bundle commit for structured catch-up planning
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.repair-recent-daily-price-gaps.outputs.source_bundle_commit_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install planner dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests lxml html5lib tabulate

      - name: Plan bounded structured objective-source catch-up
        id: structured_replay_plan
        env:
          MAX_REPLAY_DATES: ${{ inputs.max_structured_replay_dates }}
          CALLER_REPAIR_WORKFLOW_BLOB_SHA: ${{ needs.repair-recent-daily-price-gaps.outputs.caller_repair_workflow_blob_sha }}
          CALLER_REPLAY_WORKFLOW_BLOB_SHA: ${{ needs.repair-recent-daily-price-gaps.outputs.caller_replay_workflow_blob_sha }}
        shell: bash
        run: |
          git fetch origin main
          local_sha="$(git rev-parse HEAD)"
          remote_main_sha="$(git rev-parse origin/main)"
          if [ -z "$local_sha" ] || \
             [ "$local_sha" != "${{ needs.repair-recent-daily-price-gaps.outputs.source_bundle_commit_sha }}" ] || \
             ! git merge-base --is-ancestor "$local_sha" "$remote_main_sha"; then
            echo "::error::Structured replay planner must use the published source-bundle commit and it must remain a current-main ancestor."
            exit 1
          fi
          local_repair_workflow_blob_sha="$(git rev-parse HEAD:.github/workflows/repair_recent_daily_price_gaps.yml)"
          local_replay_workflow_blob_sha="$(git rev-parse HEAD:.github/workflows/historical_structured_source_replay.yml)"
          if [[ ! "$CALLER_REPAIR_WORKFLOW_BLOB_SHA" =~ ^[0-9a-f]{40}$ ]] || \
             [[ ! "$CALLER_REPLAY_WORKFLOW_BLOB_SHA" =~ ^[0-9a-f]{40}$ ]] || \
             [ "$local_repair_workflow_blob_sha" != "$CALLER_REPAIR_WORKFLOW_BLOB_SHA" ] || \
             [ "$local_replay_workflow_blob_sha" != "$CALLER_REPLAY_WORKFLOW_BLOB_SHA" ]; then
            echo "::error::Caller workflow definitions differ from the pinned source-bundle commit."
            exit 1
          fi

          plan_path="$RUNNER_TEMP/historical_structured_source_replay_plan.json"
          python scripts/plan_historical_structured_source_replay.py \
            --max-replay-dates "$MAX_REPLAY_DATES" \
            --output "$plan_path"

          git fetch origin main
          remote_main_sha_after_plan="$(git rev-parse origin/main)"
          if ! git merge-base --is-ancestor "$local_sha" "$remote_main_sha_after_plan"; then
            echo "::error::Published source-bundle commit stopped being a current-main ancestor during planning."
            exit 1
          fi

          python - "$plan_path" "$local_sha" <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          import sys

          payload = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          print(f"should_replay={str(bool(payload['should_replay'])).lower()}")
          print(f"start_date={payload.get('start_date', '')}")
          print(f"end_date={payload.get('end_date', '')}")
          print(
              "price_history_high_water_date="
              f"{payload.get('price_history_high_water_date', '')}"
          )
          print(
              "repair_taifex_base_date="
              f"{payload.get('repair_taifex_base_date', '')}"
          )
          print(f"expected_main_sha={sys.argv[2]}")
          PY

      - name: Upload structured objective-source catch-up plan
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: historical-structured-source-replay-plan
          path: ${{ runner.temp }}/historical_structured_source_replay_plan.json
          if-no-files-found: ignore
          retention-days: 30

  replay-structured-objective-sources:
    needs: plan-structured-objective-source-catch-up
    if: needs.plan-structured-objective-source-catch-up.outputs.should_replay == 'true'
    uses: ./.github/workflows/historical_structured_source_replay.yml
    with:
      start_date: ${{ needs.plan-structured-objective-source-catch-up.outputs.start_date }}
      end_date: ${{ needs.plan-structured-objective-source-catch-up.outputs.end_date }}
      price_history_high_water_date: ${{ needs.plan-structured-objective-source-catch-up.outputs.price_history_high_water_date }}
      repair_market_index_base_date: ""
      repair_taifex_base_date: ${{ needs.plan-structured-objective-source-catch-up.outputs.repair_taifex_base_date }}
      expected_main_sha: ${{ needs.plan-structured-objective-source-catch-up.outputs.expected_main_sha }}
    secrets:
      PRODUCTION_ARTIFACT_WRITE_DEPLOY_KEY: ${{ secrets.PRODUCTION_ARTIFACT_WRITE_DEPLOY_KEY }}

  resume-daily-full-from-source-bundle:
    needs:
      - repair-recent-daily-price-gaps
      - plan-structured-objective-source-catch-up
      - replay-structured-objective-sources
    if: >-
      ${{ always() &&
          needs.repair-recent-daily-price-gaps.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_TRADING_DATE: ${{ needs.repair-recent-daily-price-gaps.outputs.repair_target_date }}
      SOURCE_BUNDLE_COMMIT_SHA: ${{ needs.repair-recent-daily-price-gaps.outputs.source_bundle_commit_sha }}
      SOURCE_BUNDLE_MANIFEST_PATH: ${{ needs.repair-recent-daily-price-gaps.outputs.source_bundle_manifest_path }}
      SOURCE_BUNDLE_MANIFEST_SHA256: ${{ needs.repair-recent-daily-price-gaps.outputs.source_bundle_manifest_sha256 }}
      SOURCE_BUNDLE_SHA: ${{ needs.repair-recent-daily-price-gaps.outputs.source_bundle_sha }}
      SOURCE_BUNDLE_RELEASE_ID: ${{ needs.repair-recent-daily-price-gaps.outputs.source_bundle_release_id }}
      REPAIR_ACTION_COUNT: ${{ needs.repair-recent-daily-price-gaps.outputs.repair_action_count }}
      STRUCTURED_PLAN_RESULT: ${{ needs.plan-structured-objective-source-catch-up.result }}
      STRUCTURED_REPLAY_REQUIRED: ${{ needs.plan-structured-objective-source-catch-up.outputs.should_replay }}
      STRUCTURED_REPLAY_RESULT: ${{ needs.replay-structured-objective-sources.result }}
      REPAIR_PUBLISHED_HEAD_SHA: ${{ needs.repair-recent-daily-price-gaps.outputs.published_head_sha }}
      REPLAY_DOMAIN_OUTPUT_COMMIT_SHA: ${{ needs.replay-structured-objective-sources.outputs.domain_output_commit_sha }}
      REPLAY_PUBLISHED_HEAD_SHA: ${{ needs.replay-structured-objective-sources.outputs.published_head_sha }}

    steps:
      - name: Resolve exact published resume head
        id: resolve_resume_head
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$REPAIR_PUBLISHED_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Repair published head SHA is missing or invalid."
            exit 1
          fi
          resume_published_base_sha="$REPAIR_PUBLISHED_HEAD_SHA"
          if [ "$STRUCTURED_REPLAY_REQUIRED" = true ] && \
             [ "$STRUCTURED_REPLAY_RESULT" = success ]; then
            if [[ ! "$REPLAY_DOMAIN_OUTPUT_COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]] || \
               [[ ! "$REPLAY_PUBLISHED_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::Successful structured replay must expose exact domain and published SHAs."
              exit 1
            fi
            resume_published_base_sha="$REPLAY_PUBLISHED_HEAD_SHA"
          fi
          echo "resume_published_base_sha=$resume_published_base_sha" >> "$GITHUB_OUTPUT"
          echo "RESUME_PUBLISHED_BASE_SHA=$resume_published_base_sha" >> "$GITHUB_ENV"

      - name: Require production artifact write deploy key
        shell: bash
        env:
          PRODUCTION_ARTIFACT_WRITE_DEPLOY_KEY: ${{ secrets.PRODUCTION_ARTIFACT_WRITE_DEPLOY_KEY }}
        run: |
          if [ -z "${PRODUCTION_ARTIFACT_WRITE_DEPLOY_KEY}" ]; then
            echo "::error::PRODUCTION_ARTIFACT_WRITE_DEPLOY_KEY is required for durable recovery reservation."
            exit 1
          fi

      - name: Checkout pinned published head for immutable resume
        uses: actions/checkout@v6
        with:
          ssh-key: ${{ secrets.PRODUCTION_ARTIFACT_WRITE_DEPLOY_KEY }}
          persist-credentials: true
          ref: ${{ steps.resolve_resume_head.outputs.resume_published_base_sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Verify bundle and dispatch exactly one Daily Full resume
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          resume_base_sha="$(git rev-parse HEAD)"
          remote_main_sha="$(git rev-parse origin/main)"
          if [ "$resume_base_sha" != "$RESUME_PUBLISHED_BASE_SHA" ] || \
             ! git merge-base --is-ancestor "$resume_base_sha" "$remote_main_sha"; then
            echo "::error::Resume checkout must equal the pinned published head and remain a current-main ancestor."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$SOURCE_BUNDLE_COMMIT_SHA" "$resume_base_sha"; then
            echo "::error::Source bundle commit is not an ancestor of current main."
            exit 1
          fi
          if [ "$STRUCTURED_REPLAY_REQUIRED" = true ] && \
             [ "$STRUCTURED_REPLAY_RESULT" = success ]; then
            if [[ ! "$REPLAY_DOMAIN_OUTPUT_COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]] || \
               [[ ! "$REPLAY_PUBLISHED_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || \
               [ "$resume_base_sha" != "$REPLAY_PUBLISHED_HEAD_SHA" ] || \
               ! git merge-base --is-ancestor "$SOURCE_BUNDLE_COMMIT_SHA" "$REPLAY_DOMAIN_OUTPUT_COMMIT_SHA" || \
               ! git merge-base --is-ancestor "$REPLAY_DOMAIN_OUTPUT_COMMIT_SHA" "$resume_base_sha" || \
               ! git merge-base --is-ancestor "$REPAIR_PUBLISHED_HEAD_SHA" "$resume_base_sha"; then
              echo "::error::Successful structured replay outputs do not form the required published ancestry."
              exit 1
            fi
          fi

          state_path="$RUNNER_TEMP/daily-source-recovery-state.json"
          fail_recovery() {
            message="$1"
            echo "::error::$message"
            if [ -f "$state_path" ]; then
              if python -B scripts/daily_source_recovery_bundle.py transition \
                --state "$state_path" --to failed --output "$state_path.next" \
                --error "$message"; then
                mv "$state_path.next" "$state_path"
              else
                echo "::error::Unable to persist terminal source-recovery failure state."
              fi
            fi
            exit 1
          }
          python -B scripts/daily_source_recovery_bundle.py verify \
            --repo-root . \
            --source-commit-sha "$SOURCE_BUNDLE_COMMIT_SHA" \
            --manifest-path "$SOURCE_BUNDLE_MANIFEST_PATH" \
            --manifest-sha256 "$SOURCE_BUNDLE_MANIFEST_SHA256" \
            --source-bundle-sha "$SOURCE_BUNDLE_SHA" \
            --trading-date "$SOURCE_TRADING_DATE" \
            --state-output "$state_path"
          python -B scripts/daily_source_recovery_bundle.py transition \
            --state "$state_path" --to bundle_committed --output "$state_path.next" \
            --source-bundle-commit-sha "$SOURCE_BUNDLE_COMMIT_SHA"
          mv "$state_path.next" "$state_path"
          if [ "$STRUCTURED_PLAN_RESULT" != success ]; then
            fail_recovery "Structured objective-source plan completed with result=$STRUCTURED_PLAN_RESULT"
          fi
          case "$STRUCTURED_REPLAY_REQUIRED" in
            true)
              if [ "$STRUCTURED_REPLAY_RESULT" != success ]; then
                fail_recovery "Required structured objective-source replay completed with result=$STRUCTURED_REPLAY_RESULT"
              fi
              ;;
            false)
              if [ "$STRUCTURED_REPLAY_RESULT" != skipped ]; then
                fail_recovery "No-op structured objective-source replay completed with result=$STRUCTURED_REPLAY_RESULT"
              fi
              ;;
            *)
              fail_recovery "Structured objective-source replay requirement is invalid: $STRUCTURED_REPLAY_REQUIRED"
              ;;
          esac

          authority_path="$RUNNER_TEMP/existing-authority.json"
          if [ "$REPAIR_ACTION_COUNT" = 0 ] && [ "$STRUCTURED_REPLAY_REQUIRED" != true ]; then
            python -B scripts/daily_source_recovery_bundle.py authority-status \
              --repo-root . \
              --trading-date "$SOURCE_TRADING_DATE" \
              --source-commit-sha "$SOURCE_BUNDLE_COMMIT_SHA" \
              --manifest-path "$SOURCE_BUNDLE_MANIFEST_PATH" \
              --manifest-sha256 "$SOURCE_BUNDLE_MANIFEST_SHA256" \
              --source-bundle-sha "$SOURCE_BUNDLE_SHA" \
              --output "$authority_path"
          else
            printf '%s\n' '{"resume_required":true,"existing_authority":{}}' > "$authority_path"
          fi
          if [ "$(python -c 'import json,sys; print(str(json.load(open(sys.argv[1], encoding="utf-8"))["resume_required"]).lower())' "$authority_path")" = false ]; then
            authority_fields="$(python - "$authority_path" <<'PY'
          import json
          import sys

          identity = json.load(open(sys.argv[1], encoding="utf-8"))["existing_authority"]
          print(identity["release_id"], identity["generation_id"], identity["commit_sha"])
          PY
            )"
            read -r authority_release_id authority_generation_id authority_commit_sha <<< "$authority_fields"
            python -B scripts/daily_source_recovery_bundle.py transition \
              --state "$state_path" --to resume_not_required --output "$state_path.next" \
              --existing-authority-release-id "$authority_release_id" \
              --existing-authority-generation-id "$authority_generation_id" \
              --existing-authority-commit-sha "$authority_commit_sha"
            mv "$state_path.next" "$state_path"
            python -B scripts/daily_source_recovery_bundle.py transition \
              --state "$state_path" --to confirm_source_gate --output "$state_path.next"
            mv "$state_path.next" "$state_path"
            exit 0
          fi

          correlation_id="daily-source-${SOURCE_TRADING_DATE}"
          expected_title="Daily Full Pipeline | recovery=${correlation_id}"
          existing_runs="$RUNNER_TEMP/daily-full-existing-runs.json"
          api_ok=false
          for api_attempt in 1 2 3; do
            if gh run list --workflow daily_full_pipeline.yml --branch main --event workflow_dispatch --limit 100 \
              --json databaseId,attempt,createdAt,event,workflowName,headSha,displayTitle,status,conclusion,url \
              > "$existing_runs"; then
              api_ok=true
              break
            fi
            sleep 5
          done
          if [ "$api_ok" != true ]; then
            fail_recovery "Unable to list existing Daily Full recovery runs after bounded API retries"
          fi
          if ! python - "$existing_runs" "$expected_title" <<'PY'
          import json
          import sys
          from pathlib import Path
          from scripts.daily_source_recovery_bundle import reject_existing_recovery_run

          reject_existing_recovery_run(
              json.loads(Path(sys.argv[1]).read_text(encoding="utf-8")),
              expected_display_title=sys.argv[2],
          )
          PY
          then
            fail_recovery "Daily Full recovery run already exists for this trading date"
          fi
          baseline_run_id="$(python - "$existing_runs" <<'PY'
          import json
          import sys
          from pathlib import Path

          runs = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          print(max((int(item.get("databaseId") or 0) for item in runs), default=0))
          PY
          )"
          dispatch_started_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          reservation_path="output/history/daily_source_recovery_reservations/${SOURCE_TRADING_DATE}.json"
          if [ -e "$reservation_path" ]; then
            fail_recovery "Daily Full recovery dispatch reservation already exists for this trading date"
          fi
          python -B scripts/daily_source_recovery_bundle.py reserve \
            --repo-root . \
            --trading-date "$SOURCE_TRADING_DATE" \
            --source-commit-sha "$SOURCE_BUNDLE_COMMIT_SHA" \
            --manifest-path "$SOURCE_BUNDLE_MANIFEST_PATH" \
            --manifest-sha256 "$SOURCE_BUNDLE_MANIFEST_SHA256" \
            --source-bundle-sha "$SOURCE_BUNDLE_SHA" \
            --baseline-run-id "$baseline_run_id" \
            --dispatch-started-at "$dispatch_started_at" \
            --expected-display-title "$expected_title"
          reservation_sha256="$(python -c 'import hashlib,sys; print(hashlib.sha256(open(sys.argv[1], "rb").read()).hexdigest())' "$reservation_path")"
          git add -- output/history/daily_source_recovery_reservations/"${SOURCE_TRADING_DATE}.json"
          staged_paths="$(git diff --cached --name-only)"
          if [ "$staged_paths" != "$reservation_path" ]; then
            fail_recovery "Durable recovery reservation staged path set is not exact: $staged_paths"
          fi
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          reservation_base_sha="$(git rev-parse HEAD)"
          reservation_paths_file="$RUNNER_TEMP/recovery-reservation-staged-paths.z"
          git diff --cached --name-only --no-renames -z > "$reservation_paths_file"
          git commit -m "Reserve Daily Full recovery for ${SOURCE_TRADING_DATE}"
          reservation_commit_sha="$(git rev-parse HEAD)"
          reservation_published=false
          reservation_published_head_sha=""
          reservation_candidate_head_sha=""
          fetch_reservation_main_bounded() {
            for fetch_attempt in 1 2 3; do
              if git fetch origin main && \
                 remote_main_sha="$(git rev-parse origin/main)" && \
                 [[ "$remote_main_sha" =~ ^[0-9a-f]{40}$ ]]; then
                return 0
              fi
              sleep 5
            done
            return 1
          }
          for push_attempt in 1 2 3; do
            if ! fetch_reservation_main_bounded; then
              continue
            fi
            if [[ "$reservation_candidate_head_sha" =~ ^[0-9a-f]{40}$ ]] && \
               git merge-base --is-ancestor "$reservation_commit_sha" "$reservation_candidate_head_sha" && \
               git merge-base --is-ancestor "$reservation_candidate_head_sha" "$remote_main_sha"; then
              reservation_published=true
              reservation_published_head_sha="$reservation_candidate_head_sha"
              break
            fi
            if ! git merge-base --is-ancestor "$reservation_base_sha" "$remote_main_sha"; then
              fail_recovery "Current main is not a descendant of the pinned reservation base"
            fi
            comparison_base="$reservation_base_sha"
            if git merge-base --is-ancestor "$reservation_commit_sha" "$remote_main_sha"; then
              comparison_base="$reservation_commit_sha"
            fi
            if ! python - "$comparison_base" "$remote_main_sha" "$reservation_paths_file" <<'PY'
          import subprocess
          import sys
          from pathlib import Path

          changed = {
              item.decode("utf-8", errors="strict")
              for item in subprocess.check_output(
                  ["git", "diff", "--name-only", "--no-renames", "-z", sys.argv[1], sys.argv[2], "--"]
              ).split(b"\0")
              if item
          }
          staged = {
              item.decode("utf-8", errors="strict")
              for item in Path(sys.argv[3]).read_bytes().split(b"\0")
              if item
          }
          overlap = sorted(changed & staged)
          if overlap:
              raise SystemExit(
                  "moving main overlaps the date-scoped recovery reservation: "
                  + ",".join(overlap)
              )
          PY
            then
              fail_recovery "Current main overlaps the date-scoped recovery reservation"
            fi
            if ! git merge-base --is-ancestor "$remote_main_sha" HEAD; then
              git merge --no-edit "$remote_main_sha"
            fi
            reservation_candidate_head_sha="$(git rev-parse HEAD)"
            if [[ ! "$reservation_candidate_head_sha" =~ ^[0-9a-f]{40}$ ]] || \
               ! git merge-base --is-ancestor "$reservation_commit_sha" "$reservation_candidate_head_sha"; then
              fail_recovery "Recovery reservation publish candidate is invalid"
            fi
            if git push origin HEAD:main; then
              reservation_published=true
              reservation_published_head_sha="$reservation_candidate_head_sha"
              break
            fi
            sleep 5
          done
          if [ "$reservation_published" != true ] && \
             [[ "$reservation_candidate_head_sha" =~ ^[0-9a-f]{40}$ ]] && \
             fetch_reservation_main_bounded && \
             git merge-base --is-ancestor "$reservation_commit_sha" "$reservation_candidate_head_sha" && \
             git merge-base --is-ancestor "$reservation_candidate_head_sha" "$remote_main_sha"; then
            reservation_published=true
            reservation_published_head_sha="$reservation_candidate_head_sha"
          fi
          if [ "$reservation_published" != true ]; then
            fail_recovery "Durable recovery reservation was not published after three normal non-force attempts"
          fi

          dispatch_result=success
          if ! gh workflow run daily_full_pipeline.yml --ref main \
              -f run_raw_health_check=false \
              -f recovery_correlation_id="$correlation_id" \
              -f recovery_reservation_commit_sha="$reservation_commit_sha" \
              -f recovery_reservation_path="$reservation_path" \
              -f recovery_reservation_sha256="$reservation_sha256" \
              -f recovery_source_bundle_commit_sha="$SOURCE_BUNDLE_COMMIT_SHA" \
              -f recovery_source_bundle_manifest_path="$SOURCE_BUNDLE_MANIFEST_PATH" \
              -f recovery_source_bundle_manifest_sha256="$SOURCE_BUNDLE_MANIFEST_SHA256" \
              -f recovery_source_bundle_sha="$SOURCE_BUNDLE_SHA" \
              -f recovery_source_bundle_trading_date="$SOURCE_TRADING_DATE"; then
            dispatch_result=uncertain
          fi

          correlated_json=""
          for poll_attempt in $(seq 1 30); do
            runs_json="$RUNNER_TEMP/daily-full-runs.json"
            api_ok=false
            for api_attempt in 1 2 3; do
              if gh run list --workflow daily_full_pipeline.yml --branch main --event workflow_dispatch --limit 30 \
                --json databaseId,attempt,createdAt,event,workflowName,headSha,displayTitle,status,conclusion,url \
                > "$runs_json"; then
                api_ok=true
                break
              fi
              sleep 5
            done
            if [ "$api_ok" != true ]; then
              fail_recovery "Unable to list Daily Full runs after bounded API retries"
            fi
            if ! correlated_json="$(python - "$runs_json" "$baseline_run_id" "$dispatch_started_at" "$expected_title" <<'PY'
          import json
          import sys
          from pathlib import Path
          from scripts.daily_source_recovery_bundle import select_correlated_run

          runs = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          selected = select_correlated_run(
              runs,
              baseline_run_id=int(sys.argv[2]),
              dispatch_started_at=sys.argv[3],
              expected_head_sha="",
              expected_display_title=sys.argv[4],
          )
          print(json.dumps(selected or {}, separators=(",", ":")))
          PY
            )"; then
              fail_recovery "Daily Full run correlation is ambiguous or invalid"
            fi
            if [ "$correlated_json" != "{}" ]; then
              break
            fi
            sleep 10
          done
          if [ -z "$correlated_json" ] || [ "$correlated_json" = "{}" ]; then
            fail_recovery "No unique Daily Full run matched the bounded dispatch window; dispatch_result=$dispatch_result"
          fi
          if ! run_id="$(python -c 'import json,sys; print(json.loads(sys.argv[1])["databaseId"])' "$correlated_json")" || \
             ! run_url="$(python -c 'import json,sys; print(json.loads(sys.argv[1])["url"])' "$correlated_json")" || \
             ! run_head_sha="$(python -c 'import json,sys; print(json.loads(sys.argv[1])["headSha"])' "$correlated_json")"; then
            fail_recovery "Correlated Daily Full run identity is incomplete"
          fi
          if [[ ! "$run_head_sha" =~ ^[0-9a-f]{40}$ ]]; then
            fail_recovery "Correlated Daily Full event head SHA is invalid"
          fi
          python -B scripts/daily_source_recovery_bundle.py transition \
            --state "$state_path" --to resume_dispatched --output "$state_path.next" \
            --resume-workflow-path ".github/workflows/daily_full_pipeline.yml" \
            --resume-baseline-run-id "$baseline_run_id" \
            --resume-dispatch-started-at "$dispatch_started_at" \
            --resume-expected-head-sha "$run_head_sha" \
            --resume-expected-display-title "$expected_title" \
            --resume-reservation-path "$reservation_path" \
            --resume-reservation-sha256 "$reservation_sha256"
          mv "$state_path.next" "$state_path"
          python -B scripts/daily_source_recovery_bundle.py transition \
            --state "$state_path" --to resume_running --output "$state_path.next" \
            --resume-workflow-run-id "$run_id" \
            --resume-workflow-run-attempt 1 \
            --resume-workflow-run-url "$run_url"
          mv "$state_path.next" "$state_path"

          for completion_poll in $(seq 1 240); do
            view_json="$RUNNER_TEMP/daily-full-run-view.json"
            api_ok=false
            for api_attempt in 1 2 3; do
              if gh run view "$run_id" --json databaseId,attempt,event,workflowName,headSha,displayTitle,status,conclusion,url > "$view_json"; then
                api_ok=true
                break
              fi
              sleep 5
            done
            if [ "$api_ok" != true ]; then
              fail_recovery "Unable to poll Daily Full completion after bounded API retries"
            fi
            if ! status_line="$(python - "$view_json" "$run_id" "$run_head_sha" "$expected_title" <<'PY'
          import json
          import sys
          from pathlib import Path

          run = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          if int(run.get("databaseId") or 0) != int(sys.argv[2]):
              raise SystemExit("Daily Full run id changed during completion polling")
          if run.get("headSha") != sys.argv[3] or run.get("displayTitle") != sys.argv[4]:
              raise SystemExit("Daily Full run identity changed during completion polling")
          if run.get("event") != "workflow_dispatch" or int(run.get("attempt") or 0) != 1:
              raise SystemExit("Daily Full run event/attempt identity mismatch")
          print(run.get("status") or "", run.get("conclusion") or "")
          PY
            )"; then
              fail_recovery "Daily Full completion identity changed or is invalid"
            fi
            read -r status conclusion <<< "$status_line"
            if [ "$status" = completed ]; then
              if [ "$conclusion" != success ]; then
                python -B scripts/daily_source_recovery_bundle.py transition \
                  --state "$state_path" --to failed --output "$state_path.next" \
                  --error "Daily Full resume completed with conclusion=$conclusion"
                mv "$state_path.next" "$state_path"
                exit 1
              fi
              python -B scripts/daily_source_recovery_bundle.py transition \
                --state "$state_path" --to resume_succeeded --output "$state_path.next" \
                --resume-conclusion success
              mv "$state_path.next" "$state_path"
              python -B scripts/daily_source_recovery_bundle.py transition \
                --state "$state_path" --to confirm_source_gate --output "$state_path.next"
              mv "$state_path.next" "$state_path"
              exit 0
            fi
            sleep 30
          done
          python -B scripts/daily_source_recovery_bundle.py transition \
            --state "$state_path" --to failed --output "$state_path.next" \
            --error "Daily Full resume completion polling timed out"
          mv "$state_path.next" "$state_path"
          exit 1

      - name: Upload source recovery resume state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-source-recovery-state-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/daily-source-recovery-state.json
          if-no-files-found: error
          retention-days: 30
