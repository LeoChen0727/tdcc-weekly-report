name: Repair Recent Daily Price Gaps

on:
  workflow_dispatch:
    inputs:
      as_of_date:
        description: "Optional maintenance boundary date in YYYYMMDD. Empty means today in Asia/Taipei; the date itself is excluded."
        required: false
        default: ""
        type: string
      lookback_days:
        description: "Recent calendar-day window to inspect, excluding as_of_date"
        required: false
        default: "7"
        type: string
      max_repair_dates:
        description: "Safety limit for automatic recent missing-date repairs"
        required: false
        default: "5"
        type: string
      check_code:
        description: "Optional stock code to check during underlying date repair"
        required: false
        default: "5291"
        type: string

permissions:
  contents: write

concurrency:
  group: repair-recent-daily-price-gaps-${{ github.ref }}
  cancel-in-progress: false

jobs:
  repair-recent-daily-price-gaps:
    runs-on: ubuntu-latest

    steps:
      - name: Reject non-main production dispatch
        if: github.ref_name != 'main'
        run: |
          echo "::error::Repair Recent Daily Price Gaps is production-only on main."
          exit 1

      - name: Require production artifact write deploy key
        shell: bash
        env:
          PRODUCTION_ARTIFACT_WRITE_DEPLOY_KEY: ${{ secrets.PRODUCTION_ARTIFACT_WRITE_DEPLOY_KEY }}
        run: |
          if [ -z "${PRODUCTION_ARTIFACT_WRITE_DEPLOY_KEY}" ]; then
            echo "::error::PRODUCTION_ARTIFACT_WRITE_DEPLOY_KEY is required for artifact publishing."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ssh-key: ${{ secrets.PRODUCTION_ARTIFACT_WRITE_DEPLOY_KEY }}
          persist-credentials: true
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests lxml html5lib tabulate

      - name: Validate workflow automation boundaries
        run: |
          python scripts/validate_apps_script_workflow_triggers.py
          python scripts/validate_repo_production_inventory.py
          python scripts/validate_repo_file_lifecycle_inventory.py
          python scripts/validate_repo_semantic_integrity.py
          python scripts/validate_daily_production_boundaries.py

      - name: Repair recent daily price gaps
        env:
          AS_OF_DATE: ${{ inputs.as_of_date }}
          LOOKBACK_DAYS: ${{ inputs.lookback_days }}
          MAX_REPAIR_DATES: ${{ inputs.max_repair_dates }}
          CHECK_CODE: ${{ inputs.check_code }}
        run: |
          args=(
            --lookback-days "$LOOKBACK_DAYS"
            --max-repair-dates "$MAX_REPAIR_DATES"
            --retries 2
            --sleep-seconds 5
            --rebuild-history-if-repaired
          )
          if [ -n "$AS_OF_DATE" ]; then
            args+=(--as-of-date "$AS_OF_DATE")
          fi
          if [ -n "$CHECK_CODE" ]; then
            args+=(--check-code "$CHECK_CODE")
          fi
          python scripts/repair_recent_daily_price_gaps.py "${args[@]}"
          python scripts/validate_daily_price_history_continuity.py

      - name: Summarize recent repair result
        run: |
          python - <<'PY' >> "$GITHUB_ENV"
          import json
          from pathlib import Path

          report = Path("output/latest/recent_daily_price_gap_repair_latest.json")
          payload = json.loads(report.read_text(encoding="utf-8-sig")) if report.exists() else {}
          market_path = Path("output/latest/market_session_status_latest.json")
          market = json.loads(market_path.read_text(encoding="utf-8-sig")) if market_path.exists() else {}
          actions = payload.get("actions") or []
          print(f"REPAIR_STATUS={payload.get('status', '')}")
          print(f"REPAIR_ACTION_COUNT={len(actions)}")
          print(f"MARKET_STATUS={market.get('market_status', '')}")
          print(f"EXPECTED_MAIN_PRICE_DATE={market.get('expected_main_price_date', '')}")
          PY
          market_change_count="$(git status --porcelain -- data/market_calendar/exceptional_non_trading_days.csv output/latest/market_session_status_latest.json | wc -l | tr -d ' ')"
          echo "MARKET_SESSION_CHANGE_COUNT=$market_change_count" >> "$GITHUB_ENV"

      - name: Upload recent daily price gap repair evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: recent-daily-price-gap-repair
          path: |
            output/latest/recent_daily_price_gap_repair_latest.json
            output/latest/recent_daily_price_gap_repair_latest.md
            output/latest/repair_daily_price_range_latest.*
            output/latest/repair_daily_price_range_check_code_latest.csv
            output/latest/stock_price_history_manifest.*
            output/latest/daily_price_history_continuity_latest.*
            output/latest/market_session_status_latest.json
            data/market_calendar/exceptional_non_trading_days.csv
          if-no-files-found: ignore
          retention-days: 30

      - name: Commit repaired recent daily price gaps
        if: env.REPAIR_ACTION_COUNT != '0' || env.MARKET_SESSION_CHANGE_COUNT != '0'
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add data/daily_price/ || true
          git add data/stock_price_history/ || true
          git add data/market_calendar/exceptional_non_trading_days.csv || true
          git add output/latest/market_session_status_latest.json || true
          git add output/latest/recent_daily_price_gap_repair_latest.* || true
          git add output/latest/repair_daily_price_range_latest.* || true
          git add output/latest/repair_daily_price_range_check_code_latest.csv || true
          git add output/latest/stock_price_history_manifest.* || true
          git add output/latest/daily_price_history_continuity_latest.* || true
          git add docs/latest/stock_price_history_manifest.* || true
          git status --short
          git commit -m "Refresh recent price gaps and market session evidence" || echo "No changes to commit"
          bash scripts/ci_push_with_retry.sh main 5
