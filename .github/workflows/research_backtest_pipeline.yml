name: Research Backtest Pipeline

on:
  workflow_dispatch:
    inputs:
      run_market_timing:
        description: "Run market technical timing backtest"
        required: false
        default: "false"
      run_weekly_surge:
        description: "Run weekly surge parameter research"
        required: false
        default: "false"
      run_explosive_volume:
        description: "Run explosive volume up research"
        required: false
        default: "false"
      run_surge_model:
        description: "Run surge precondition model"
        required: false
        default: "false"
      run_signal_performance:
        description: "Run daily signal performance reports"
        required: false
        default: "false"
      run_volume_breakout:
        description: "Run volume breakout watch backtest"
        required: false
        default: "false"
      run_catalyst_performance:
        description: "Run catalyst performance tracking"
        required: false
        default: "false"
      run_msci_rebalance:
        description: "Run MSCI Taiwan rebalance event backtest"
        required: false
        default: "false"
      run_tdcc_signal_performance:
        description: "Run TDCC weekly ranking formula backtest"
        required: false
        default: "false"
      run_tdcc_short_term_edge:
        description: "Run TDCC overheated short-term edge research"
        required: false
        default: "false"
      run_short_term_specialty_packet:
        description: "Run short-term specialty ChatGPT packet rebuild"
        required: false
        default: "false"
      run_shared_model_research_data_refresh:
        description: "Refresh shared objective PIT data for selected model research"
        required: false
        default: "false"
      run_price_pullback_23ema_research:
        description: "Run model-owned 23EMA research only"
        required: false
        default: "false"
      run_revenue_unreacted_range_research:
        description: "Run model-owned revenue lag and strength research only"
        required: false
        default: "false"
      run_revenue_unreacted_range_source_snapshot_projection_chain_only:
        description: "When revenue research is selected, rebuild only its downstream chain from the pinned 20260713 source snapshot projection"
        required: false
        default: "false"
      run_revenue_unreacted_range_source_snapshot_projection_rebaseline_only:
        description: "Build only the branch-scoped immutable v1 archive and v2 source snapshot projection candidate"
        required: false
        default: false
        type: boolean
      run_revenue_unreacted_range_source_snapshot_projection_candidate_repair_only:
        description: "Repair only the branch-scoped projection v2 candidate audit CSV line endings"
        required: false
        default: false
        type: boolean
      run_volume_range_breakout_v2_research:
        description: "Run model-owned volume breakout v2 research only"
        required: false
        default: "false"
      run_revenue_unreacted_range_forward_holdout_only:
        description: "Declare the model-owned revenue forward holdout input; disabled by default"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: research-backtest-pipeline-${{ github.ref }}
  cancel-in-progress: false

jobs:
  research-backtest-pipeline:
    runs-on: ubuntu-latest

    env:
      TARGET_BRANCH: ${{ github.ref_name }}
      ANY_RESEARCH_SELECTED: ${{ github.event.inputs.run_market_timing == 'true' || github.event.inputs.run_weekly_surge == 'true' || github.event.inputs.run_explosive_volume == 'true' || github.event.inputs.run_surge_model == 'true' || github.event.inputs.run_signal_performance == 'true' || github.event.inputs.run_volume_breakout == 'true' || github.event.inputs.run_catalyst_performance == 'true' || github.event.inputs.run_msci_rebalance == 'true' || github.event.inputs.run_tdcc_signal_performance == 'true' || github.event.inputs.run_tdcc_short_term_edge == 'true' || github.event.inputs.run_short_term_specialty_packet == 'true' || github.event.inputs.run_shared_model_research_data_refresh == 'true' || github.event.inputs.run_price_pullback_23ema_research == 'true' || github.event.inputs.run_revenue_unreacted_range_research == 'true' || github.event.inputs.run_volume_range_breakout_v2_research == 'true' }}
      MODEL_RESEARCH_SELECTED: ${{ github.event.inputs.run_price_pullback_23ema_research == 'true' || github.event.inputs.run_revenue_unreacted_range_research == 'true' || github.event.inputs.run_volume_range_breakout_v2_research == 'true' }}
      TDCC_RESEARCH_SELECTED: ${{ github.event.inputs.run_weekly_surge == 'true' || github.event.inputs.run_surge_model == 'true' || github.event.inputs.run_volume_breakout == 'true' || github.event.inputs.run_tdcc_signal_performance == 'true' || github.event.inputs.run_tdcc_short_term_edge == 'true' || github.event.inputs.run_shared_model_research_data_refresh == 'true' }}

    steps:
      - name: Require production artifact write deploy key
        shell: bash
        env:
          PRODUCTION_ARTIFACT_WRITE_DEPLOY_KEY: ${{ secrets.PRODUCTION_ARTIFACT_WRITE_DEPLOY_KEY }}
        run: |
          if [ -z "${PRODUCTION_ARTIFACT_WRITE_DEPLOY_KEY}" ]; then
            echo "::error::PRODUCTION_ARTIFACT_WRITE_DEPLOY_KEY is required for artifact publishing."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ssh-key: ${{ secrets.PRODUCTION_ARTIFACT_WRITE_DEPLOY_KEY }}
          persist-credentials: true
          ref: ${{ github.ref_name }}
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Synchronize target branch before research
        run: |
          git pull --ff-only origin "$TARGET_BRANCH"

      - name: Install pinned workflow contract parser
        run: |
          python -m pip install --disable-pip-version-check --no-input PyYAML==6.0.2

      - name: Validate Apps Script workflow triggers
        env:
          REVENUE_FORWARD_HOLDOUT_ONLY: ${{ github.event.inputs.run_revenue_unreacted_range_forward_holdout_only }}
          REVENUE_RESEARCH_ENABLED: ${{ github.event.inputs.run_revenue_unreacted_range_research }}
          REVENUE_SOURCE_PROJECTION_CHAIN_ONLY: ${{ github.event.inputs.run_revenue_unreacted_range_source_snapshot_projection_chain_only }}
          REVENUE_SOURCE_PROJECTION_REBASELINE_ONLY: ${{ github.event.inputs.run_revenue_unreacted_range_source_snapshot_projection_rebaseline_only }}
          REVENUE_SOURCE_PROJECTION_CANDIDATE_REPAIR_ONLY: ${{ github.event.inputs.run_revenue_unreacted_range_source_snapshot_projection_candidate_repair_only }}
          REVENUE_REBASELINE_REF_TYPE: ${{ github.ref_type }}
          REVENUE_REBASELINE_OTHER_RESEARCH_SELECTED: ${{ github.event.inputs.run_market_timing == 'true' || github.event.inputs.run_weekly_surge == 'true' || github.event.inputs.run_explosive_volume == 'true' || github.event.inputs.run_surge_model == 'true' || github.event.inputs.run_signal_performance == 'true' || github.event.inputs.run_volume_breakout == 'true' || github.event.inputs.run_catalyst_performance == 'true' || github.event.inputs.run_msci_rebalance == 'true' || github.event.inputs.run_tdcc_signal_performance == 'true' || github.event.inputs.run_tdcc_short_term_edge == 'true' || github.event.inputs.run_short_term_specialty_packet == 'true' || github.event.inputs.run_shared_model_research_data_refresh == 'true' || github.event.inputs.run_price_pullback_23ema_research == 'true' || github.event.inputs.run_volume_range_breakout_v2_research == 'true' }}
        run: |
          if [[ "$REVENUE_FORWARD_HOLDOUT_ONLY" == "true" && "$REVENUE_RESEARCH_ENABLED" != "true" ]]; then
            echo "::error::Revenue forward holdout mode requires run_revenue_unreacted_range_research=true."
            exit 1
          fi
          if [[ "$REVENUE_FORWARD_HOLDOUT_ONLY" == "true" && "$REVENUE_SOURCE_PROJECTION_CHAIN_ONLY" == "true" ]]; then
            echo "::error::Revenue forward holdout mode and source snapshot projection chain mode are mutually exclusive."
            exit 1
          fi
          if [[ "$REVENUE_SOURCE_PROJECTION_REBASELINE_ONLY" == "true" && "$REVENUE_RESEARCH_ENABLED" != "true" ]]; then
            echo "::error::Revenue source snapshot projection rebaseline mode requires run_revenue_unreacted_range_research=true."
            exit 1
          fi
          if [[ "$REVENUE_SOURCE_PROJECTION_REBASELINE_ONLY" == "true" && ( "$REVENUE_FORWARD_HOLDOUT_ONLY" == "true" || "$REVENUE_SOURCE_PROJECTION_CHAIN_ONLY" == "true" || "$REVENUE_SOURCE_PROJECTION_CANDIDATE_REPAIR_ONLY" == "true" ) ]]; then
            echo "::error::Revenue source snapshot projection rebaseline mode is mutually exclusive with forward holdout, projection chain, and candidate repair modes."
            exit 1
          fi
          if [[ "$REVENUE_SOURCE_PROJECTION_REBASELINE_ONLY" == "true" && "$REVENUE_REBASELINE_OTHER_RESEARCH_SELECTED" == "true" ]]; then
            echo "::error::Revenue source snapshot projection rebaseline mode forbids every other research input."
            exit 1
          fi
          if [[ "$REVENUE_SOURCE_PROJECTION_REBASELINE_ONLY" == "true" && ( "$REVENUE_REBASELINE_REF_TYPE" != "branch" || "$TARGET_BRANCH" == "main" ) ]]; then
            echo "::error::Revenue source snapshot projection rebaseline mode requires a non-main branch ref."
            exit 1
          fi
          if [[ "$REVENUE_SOURCE_PROJECTION_CANDIDATE_REPAIR_ONLY" == "true" && "$REVENUE_RESEARCH_ENABLED" != "true" ]]; then
            echo "::error::Revenue source snapshot projection candidate repair mode requires run_revenue_unreacted_range_research=true."
            exit 1
          fi
          if [[ "$REVENUE_SOURCE_PROJECTION_CANDIDATE_REPAIR_ONLY" == "true" && ( "$REVENUE_FORWARD_HOLDOUT_ONLY" == "true" || "$REVENUE_SOURCE_PROJECTION_CHAIN_ONLY" == "true" || "$REVENUE_SOURCE_PROJECTION_REBASELINE_ONLY" == "true" ) ]]; then
            echo "::error::Revenue source snapshot projection candidate repair mode is mutually exclusive with forward holdout, projection chain, and rebaseline modes."
            exit 1
          fi
          if [[ "$REVENUE_SOURCE_PROJECTION_CANDIDATE_REPAIR_ONLY" == "true" && "$REVENUE_REBASELINE_OTHER_RESEARCH_SELECTED" == "true" ]]; then
            echo "::error::Revenue source snapshot projection candidate repair mode forbids every other research input."
            exit 1
          fi
          if [[ "$REVENUE_SOURCE_PROJECTION_CANDIDATE_REPAIR_ONLY" == "true" && ( "$REVENUE_REBASELINE_REF_TYPE" != "branch" || "$TARGET_BRANCH" == "main" ) ]]; then
            echo "::error::Revenue source snapshot projection candidate repair mode requires a non-main branch ref."
            exit 1
          fi
          if [[ "$REVENUE_SOURCE_PROJECTION_CANDIDATE_REPAIR_ONLY" == "true" && "$GITHUB_RUN_ATTEMPT" != "1" ]]; then
            echo "::error::Revenue source snapshot projection candidate repair mode forbids workflow retry attempts."
            exit 1
          fi
          if [[ "$REVENUE_SOURCE_PROJECTION_CANDIDATE_REPAIR_ONLY" == "true" && "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]]; then
            echo "::error::Revenue source snapshot projection candidate repair HEAD differs from the dispatch SHA after branch synchronization."
            exit 1
          fi
          if [[ "$REVENUE_SOURCE_PROJECTION_CANDIDATE_REPAIR_ONLY" == "true" && "$(git rev-parse HEAD^)" != "4bcaa07123ef4a000c187dc2f19caefbec4cf252" ]]; then
            echo "::error::Revenue source snapshot projection candidate repair must run from the single authorized code commit."
            exit 1
          fi
          python scripts/validate_apps_script_workflow_triggers.py
          python scripts/validate_repo_production_inventory.py
          python scripts/validate_daily_model_background_data_registry.py --structure-only
          python scripts/validate_research_production_boundaries.py
          python scripts/validate_model_research_artifact_ownership.py
          python scripts/validate_model_research_shared_utilities.py
          python scripts/validate_formal_model_evidence_pins.py
          python scripts/validate_model_research_workflow_isolation.py

      - name: Validate existing registered artifacts before non-model research
        if: ${{ env.MODEL_RESEARCH_SELECTED != 'true' }}
        run: |
          python scripts/validate_daily_model_background_data_registry.py

      - name: Install dependencies
        if: ${{ env.ANY_RESEARCH_SELECTED == 'true' }}
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests tabulate matplotlib pillow openpyxl lxml html5lib beautifulsoup4 reportlab pypdf

      - name: Validate canonical TDCC research consumer contract
        if: ${{ env.TDCC_RESEARCH_SELECTED == 'true' }}
        run: |
          python scripts/validate_tdcc_dataset_manifest.py
          python scripts/validate_research_tdcc_dataset_consumers.py

      - name: Build market timing technical backtest
        if: ${{ github.event.inputs.run_market_timing == 'true' }}
        run: |
          python scripts/update_market_index_history.py
          python scripts/build_market_timing_technical_backtest.py

      - name: Build TDCC overheated short-term edge
        if: ${{ github.event.inputs.run_tdcc_short_term_edge == 'true' }}
        run: |
          python scripts/build_tdcc_signal_structures.py --full-history --price-metrics-limit 0
          python scripts/update_tdcc_normalized_signal_performance.py
          python scripts/build_tdcc_overheated_short_term_edge.py
          python scripts/validate_research_tdcc_dataset_consumers.py \
            --csv output/history/tdcc_signals/tdcc_signal_snapshot.csv \
            --csv output/history/tdcc_signals/tdcc_normalized_signal_log.csv \
            --csv output/history/tdcc_signals/tdcc_signal_performance.csv \
            --csv output/latest/tdcc_overheated_short_term_edge_latest.csv \
            --csv output/latest/tdcc_overheated_short_term_edge_candidates_latest.csv \
            --markdown output/latest/tdcc_signal_structures_latest.md \
            --markdown output/latest/tdcc_overheated_short_term_edge_latest.md

      - name: Build TDCC weekly ranking formula backtest
        if: ${{ github.event.inputs.run_tdcc_signal_performance == 'true' }}
        run: |
          python scripts/build_tdcc_weekly_ranking_backtest.py
          python scripts/validate_tdcc_weekly_ranking_backtest.py

      - name: Build weekly surge parameter research
        if: ${{ github.event.inputs.run_weekly_surge == 'true' }}
        run: |
          python scripts/research_weekly_20pct_surge_volume.py
          python scripts/research_weekly_surge_theme_segments.py
          python scripts/research_weekly_surge_technical_grid.py
          python scripts/research_weekly_surge_multifactor_grid.py
          python scripts/build_weekly_surge_multifactor_candidates.py
          python scripts/research_weekly_surge_strict_parameter_search.py
          python scripts/build_weekly_surge_strict_parameter_candidates.py
          python scripts/validate_research_tdcc_dataset_consumers.py \
            --csv output/latest/weekly_surge_multifactor_filter_grid_latest.csv \
            --csv output/latest/weekly_surge_multifactor_candidates_latest.csv \
            --csv output/latest/weekly_surge_strict_parameter_search_latest.csv \
            --csv output/latest/weekly_surge_strict_parameter_candidates_latest.csv \
            --markdown output/latest/weekly_surge_multifactor_filter_grid_latest.md \
            --markdown output/latest/weekly_surge_multifactor_candidates_latest.md \
            --markdown output/latest/weekly_surge_strict_parameter_search_latest.md \
            --markdown output/latest/weekly_surge_strict_parameter_candidates_latest.md

      - name: Build explosive volume up research
        if: ${{ github.event.inputs.run_explosive_volume == 'true' }}
        run: |
          python scripts/research_explosive_volume_up.py

      - name: Build short-term specialty packet
        if: ${{ github.event.inputs.run_short_term_specialty_packet == 'true' }}
        run: |
          python scripts/build_daily_short_term_specialty_packet.py

      - name: Refresh shared objective model research data
        if: ${{ github.event.inputs.run_shared_model_research_data_refresh == 'true' }}
        run: |
          python scripts/build_monthly_revenue_point_in_time_panel.py
          python scripts/validate_monthly_revenue_point_in_time_panel.py
          python scripts/build_daily_model_signal_background_features.py
          python scripts/validate_daily_model_signal_background_features.py

      - name: Build model-owned 23EMA research
        if: ${{ github.event.inputs.run_price_pullback_23ema_research == 'true' }}
        run: |
          python scripts/build_price_pullback_23ema_research.py
          python scripts/validate_price_pullback_promotion_matrix.py
          python scripts/validate_price_pullback_daily_row_parity.py

      - name: Build model-owned revenue lag and strength research
        if: ${{ github.event.inputs.run_revenue_unreacted_range_research == 'true' && github.event.inputs.run_revenue_unreacted_range_source_snapshot_projection_rebaseline_only != 'true' && github.event.inputs.run_revenue_unreacted_range_source_snapshot_projection_candidate_repair_only != 'true' }}
        run: |
          python scripts/validate_revenue_unreacted_range_monthly_revenue_cross_market_resolution.py
          if [[ "${{ github.event.inputs.run_revenue_unreacted_range_forward_holdout_only }}" == "true" ]]; then
            python scripts/build_revenue_unreacted_range_research.py --stage forward_holdout
            exit 0
          fi
          if [[ "${{ github.event.inputs.run_revenue_unreacted_range_source_snapshot_projection_chain_only }}" == "true" ]]; then
            python scripts/build_revenue_unreacted_range_research.py --stage source_snapshot_projection_chain
            python scripts/validate_revenue_unreacted_range_source_first_condition_audit.py
            python scripts/validate_revenue_unreacted_range_source_snapshot_projection.py
            python scripts/validate_revenue_unreacted_range_lag_strength_matrix.py
            python scripts/validate_revenue_unreacted_range_launch_timing_feature_audit.py
            python scripts/validate_revenue_unreacted_range_forward_confirmation_feature_audit.py
            python scripts/validate_revenue_unreacted_range_rearmed_operation_grid.py
            python scripts/validate_revenue_unreacted_range_operation_lag_bucket_audit.py
            python scripts/validate_revenue_unreacted_range_position_shape_transition_matrix.py
            python scripts/validate_revenue_unreacted_range_low_mid_falling_candidate_audit.py
            python scripts/validate_revenue_unreacted_range_promotion_preparation.py --require-source-artifacts
          else
            python scripts/build_revenue_unreacted_range_research.py
            python scripts/validate_daily_model_revenue_condition_matrix.py
            python scripts/validate_revenue_unreacted_range_operation_candidate_matrix.py
            python scripts/validate_revenue_unreacted_range_feature_contrast_audit.py
            python scripts/validate_revenue_unreacted_range_close_confirmation_timing_audit.py
            python scripts/validate_revenue_unreacted_range_fixed_confirmation_feature_contrast.py
            python scripts/validate_revenue_unreacted_range_extreme_return_path_audit.py
            python scripts/validate_revenue_unreacted_range_lag_strength_matrix.py
            python scripts/validate_revenue_unreacted_range_launch_timing_feature_audit.py
            python scripts/validate_revenue_unreacted_range_source_first_condition_audit.py
            python scripts/validate_revenue_unreacted_range_source_snapshot_projection.py
            python scripts/validate_revenue_unreacted_range_forward_confirmation_feature_audit.py
            python scripts/validate_revenue_unreacted_range_rearmed_operation_grid.py
            python scripts/validate_revenue_unreacted_range_operation_lag_bucket_audit.py
            python scripts/validate_revenue_unreacted_range_position_shape_transition_matrix.py
            python scripts/validate_revenue_unreacted_range_low_mid_falling_candidate_audit.py
            python scripts/validate_revenue_unreacted_range_promotion_preparation.py --require-source-artifacts
          fi

      - name: Validate immutable revenue projection v1 before rebaseline
        if: ${{ github.event.inputs.run_revenue_unreacted_range_research == 'true' && github.event.inputs.run_revenue_unreacted_range_source_snapshot_projection_rebaseline_only == 'true' && github.ref_type == 'branch' && github.ref_name != 'main' }}
        run: |
          set -euo pipefail
          test "$(wc -c < output/latest/research_backtest/revenue_unreacted_range_source_snapshot_projection_manifest_latest.csv | tr -d ' ')" = "148157"
          test "$(sha256sum output/latest/research_backtest/revenue_unreacted_range_source_snapshot_projection_manifest_latest.csv | cut -d ' ' -f1)" = "d2dde5a1f05bc2f15baf4d77f326a7ea90b481492178fa6d2fd6262bf316c79e"
          test "$(wc -c < output/latest/research_backtest/revenue_unreacted_range_source_snapshot_projection_detail_latest.csv | tr -d ' ')" = "26633382"
          test "$(sha256sum output/latest/research_backtest/revenue_unreacted_range_source_snapshot_projection_detail_latest.csv | cut -d ' ' -f1)" = "b9784e4df2d2eba2c511b1c87f4255a6485a1fe1d7ac67490802e396614ee49a"
          test "$(wc -c < output/history/research/revenue_unreacted_range_source_snapshot_projection_manifest.csv | tr -d ' ')" = "148157"
          test "$(sha256sum output/history/research/revenue_unreacted_range_source_snapshot_projection_manifest.csv | cut -d ' ' -f1)" = "cee652015f334b9d3b464b4703a2199f2652845e0daa3dcffeef8ab2978700db"
          test "$(wc -c < docs/latest/revenue_unreacted_range_source_snapshot_projection_manifest_latest.csv | tr -d ' ')" = "148157"
          test "$(sha256sum docs/latest/revenue_unreacted_range_source_snapshot_projection_manifest_latest.csv | cut -d ' ' -f1)" = "d2dde5a1f05bc2f15baf4d77f326a7ea90b481492178fa6d2fd6262bf316c79e"

      - name: Build revenue source projection v2 rebaseline candidate
        if: ${{ github.event.inputs.run_revenue_unreacted_range_research == 'true' && github.event.inputs.run_revenue_unreacted_range_source_snapshot_projection_rebaseline_only == 'true' && github.ref_type == 'branch' && github.ref_name != 'main' }}
        run: |
          python scripts/build_revenue_unreacted_range_research.py --stage source_snapshot_projection_rebaseline

      - name: Validate rebaseline source-first audit against projection v2
        if: ${{ github.event.inputs.run_revenue_unreacted_range_research == 'true' && github.event.inputs.run_revenue_unreacted_range_source_snapshot_projection_rebaseline_only == 'true' && github.ref_type == 'branch' && github.ref_name != 'main' }}
        run: |
          python scripts/validate_revenue_unreacted_range_source_first_condition_audit.py --projection-manifest output/history/research/revenue_unreacted_range_source_snapshot_projection_manifest_v2_20260822.csv

      - name: Validate revenue source projection v2 rebaseline candidate
        if: ${{ github.event.inputs.run_revenue_unreacted_range_research == 'true' && github.event.inputs.run_revenue_unreacted_range_source_snapshot_projection_rebaseline_only == 'true' && github.ref_type == 'branch' && github.ref_name != 'main' }}
        run: |
          python scripts/validate_revenue_unreacted_range_source_snapshot_projection.py --manifest output/history/research/revenue_unreacted_range_source_snapshot_projection_manifest_v2_20260822.csv --projected-detail output/history/research/revenue_unreacted_range_source_snapshot_projection_detail_v2_20260822.csv

      - name: Validate revenue source projection v1 to v2 diff
        if: ${{ github.event.inputs.run_revenue_unreacted_range_research == 'true' && github.event.inputs.run_revenue_unreacted_range_source_snapshot_projection_rebaseline_only == 'true' && github.ref_type == 'branch' && github.ref_name != 'main' }}
        run: |
          python scripts/validate_revenue_unreacted_range_source_snapshot_projection_v1_v2_diff.py --v1-manifest output/history/research/revenue_unreacted_range_source_snapshot_projection_manifest_v1_20260731.csv --v1-detail output/history/research/revenue_unreacted_range_source_snapshot_projection_detail_v1_20260731.csv --v2-manifest output/history/research/revenue_unreacted_range_source_snapshot_projection_manifest_v2_20260822.csv --v2-detail output/history/research/revenue_unreacted_range_source_snapshot_projection_detail_v2_20260822.csv --diff-summary output/history/research/revenue_unreacted_range_source_snapshot_projection_v1_20260731_to_v2_20260822_diff_summary.csv --diff-detail output/history/research/revenue_unreacted_range_source_snapshot_projection_v1_20260731_to_v2_20260822_diff_detail.csv

      - name: Build rebaseline model data independence audit
        if: ${{ github.event.inputs.run_revenue_unreacted_range_research == 'true' && github.event.inputs.run_revenue_unreacted_range_source_snapshot_projection_rebaseline_only == 'true' && github.ref_type == 'branch' && github.ref_name != 'main' }}
        run: |
          python scripts/build_model_data_independence_audit.py

      - name: Validate rebaseline model data independence audit
        if: ${{ github.event.inputs.run_revenue_unreacted_range_research == 'true' && github.event.inputs.run_revenue_unreacted_range_source_snapshot_projection_rebaseline_only == 'true' && github.ref_type == 'branch' && github.ref_name != 'main' }}
        run: |
          python scripts/validate_model_data_independence.py

      - name: Build volume breakout watch backtest
        if: ${{ github.event.inputs.run_volume_breakout == 'true' }}
        run: |
          python scripts/build_volume_breakout_watch.py
