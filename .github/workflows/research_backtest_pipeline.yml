          git add output/latest/research_backtest/price_pullback_23ema_model_decision_audit_latest.csv output/latest/research_backtest/price_pullback_23ema_model_decision_audit_latest.md || true
          git add output/latest/research_backtest/price_pullback_23ema_high_return_feature_score_grid_latest.csv output/latest/research_backtest/price_pullback_23ema_high_return_feature_score_grid_latest.md || true
          git add output/latest/research_backtest/price_pullback_23ema_revenue_condition_matrix_latest.csv output/latest/research_backtest/price_pullback_23ema_revenue_condition_matrix_latest.md || true
          git add output/latest/research_backtest/price_pullback_23ema_promotion_matrix_latest.csv output/latest/research_backtest/price_pullback_23ema_promotion_matrix_latest.md || true
          git add output/latest/research_backtest/revenue_unreacted_range_revenue_condition_matrix_latest.csv output/latest/research_backtest/revenue_unreacted_range_revenue_condition_matrix_latest.md || true
          git add output/latest/research_backtest/price_pullback_23ema_lifecycle_replay_latest.csv output/latest/research_backtest/price_pullback_23ema_lifecycle_replay_latest.md || true
