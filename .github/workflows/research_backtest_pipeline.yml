            output/history/research/revenue_unreacted_range_source_snapshot_projection_archive_evidence_v1_20260731.csv
            output/history/research/revenue_unreacted_range_source_snapshot_projection_manifest_v2_20260822.csv
            output/history/research/revenue_unreacted_range_source_snapshot_projection_detail_v2_20260822.csv
            output/history/research/revenue_unreacted_range_source_snapshot_projection_v1_20260731_to_v2_20260822_diff_summary.csv
            output/history/research/revenue_unreacted_range_source_snapshot_projection_v1_20260731_to_v2_20260822_diff_detail.csv
            output/latest/research_backtest/revenue_unreacted_range_source_first_condition_audit_latest.csv
            output/latest/research_backtest/revenue_unreacted_range_source_first_condition_audit_detail_latest.csv
            output/latest/research_backtest/revenue_unreacted_range_source_first_condition_audit_latest.md
            output/history/research/revenue_unreacted_range_source_first_condition_audit.csv
            docs/latest/revenue_unreacted_range_source_first_condition_audit_latest.csv
            docs/latest/revenue_unreacted_range_source_first_condition_audit_latest.md
            output/latest/model_data_independence_audit_latest.csv
            output/latest/model_data_independence_audit_latest.md
            docs/latest/model_data_independence_audit_latest.csv
            docs/latest/model_data_independence_audit_latest.md
          )
          REVENUE_REBASELINE_IDENTITY_FILE="$RUNNER_TEMP/revenue-rebaseline-exact17-validated-identity.tsv"
          if [[ ! -f "$REVENUE_REBASELINE_IDENTITY_FILE" ]]; then
            echo "::error::Missing validated revenue rebaseline identity file before commit."
            exit 1
          fi
          mapfile -t REVENUE_REBASELINE_VALIDATED_IDENTITIES < "$REVENUE_REBASELINE_IDENTITY_FILE"
          if [[ "${#REVENUE_REBASELINE_VALIDATED_IDENTITIES[@]}" -ne "${#REVENUE_REBASELINE_ALLOWED_PATHS[@]}" ]]; then
            echo "::error::Revenue rebaseline commit identity row count mismatch."
            exit 1
          fi
          mapfile -t REVENUE_REBASELINE_STAGED_PATHS < <(git diff --cached --name-only)
          if [[ "${#REVENUE_REBASELINE_STAGED_PATHS[@]}" -ne "${#REVENUE_REBASELINE_ALLOWED_PATHS[@]}" ]] || ! diff -u \
            <(printf '%s\n' "${REVENUE_REBASELINE_ALLOWED_PATHS[@]}" | sort) \
            <(printf '%s\n' "${REVENUE_REBASELINE_STAGED_PATHS[@]}" | sort); then
            echo "::error::Revenue rebaseline pre-commit staged-path allowlist mismatch."
            printf 'allowed=%s\n' "${REVENUE_REBASELINE_ALLOWED_PATHS[*]}"
            printf 'staged=%s\n' "${REVENUE_REBASELINE_STAGED_PATHS[*]}"
            exit 1
          fi
          if ! git diff --quiet; then
            echo "::error::Revenue rebaseline worktree differs from the validated index before commit."
            exit 1
          fi
          mapfile -t REVENUE_REBASELINE_UNTRACKED_PATHS < <(git ls-files --others --exclude-standard)
          if [[ "${#REVENUE_REBASELINE_UNTRACKED_PATHS[@]}" -ne 0 ]]; then
            echo "::error::Revenue rebaseline has untracked paths before commit."
            printf 'untracked=%s\n' "${REVENUE_REBASELINE_UNTRACKED_PATHS[*]}"
            exit 1
          fi
          REVENUE_REBASELINE_PRE_COMMIT_HEAD="$(git rev-parse HEAD)"
          for index in "${!REVENUE_REBASELINE_ALLOWED_PATHS[@]}"; do
            path="${REVENUE_REBASELINE_ALLOWED_PATHS[$index]}"
            IFS=$'\t' read -r validated_path validated_bytes validated_sha256 <<< "${REVENUE_REBASELINE_VALIDATED_IDENTITIES[$index]}"
            staged_bytes="$(git cat-file -s ":$path")"
            staged_sha256="$(git show ":$path" | sha256sum | cut -d ' ' -f1)"
            if [[ "$validated_path" != "$path" || "$staged_bytes" != "$validated_bytes" || "$staged_sha256" != "$validated_sha256" ]]; then
              echo "::error::Revenue rebaseline pre-commit staged artifact identity mismatch: $path"
              exit 1
            fi
          done
          git commit -m "Update revenue projection v2 rebaseline candidate artifacts"
          REVENUE_REBASELINE_POST_COMMIT_HEAD="$(git rev-parse HEAD)"
          if [[ "$(git rev-parse "$REVENUE_REBASELINE_POST_COMMIT_HEAD^")" != "$REVENUE_REBASELINE_PRE_COMMIT_HEAD" ]]; then
            echo "::error::Revenue rebaseline commit parent mismatch."
            exit 1
          fi
          mapfile -t REVENUE_REBASELINE_COMMITTED_PATHS < <(
            git diff --name-only --no-renames "$REVENUE_REBASELINE_PRE_COMMIT_HEAD" "$REVENUE_REBASELINE_POST_COMMIT_HEAD"
          )
          if [[ "${#REVENUE_REBASELINE_COMMITTED_PATHS[@]}" -ne "${#REVENUE_REBASELINE_ALLOWED_PATHS[@]}" ]] || ! diff -u \
            <(printf '%s\n' "${REVENUE_REBASELINE_ALLOWED_PATHS[@]}" | sort) \
            <(printf '%s\n' "${REVENUE_REBASELINE_COMMITTED_PATHS[@]}" | sort); then
            echo "::error::Revenue rebaseline committed-path allowlist mismatch."
            printf 'allowed=%s\n' "${REVENUE_REBASELINE_ALLOWED_PATHS[*]}"
            printf 'committed=%s\n' "${REVENUE_REBASELINE_COMMITTED_PATHS[*]}"
            exit 1
          fi
          for index in "${!REVENUE_REBASELINE_ALLOWED_PATHS[@]}"; do
            path="${REVENUE_REBASELINE_ALLOWED_PATHS[$index]}"
            IFS=$'\t' read -r validated_path validated_bytes validated_sha256 <<< "${REVENUE_REBASELINE_VALIDATED_IDENTITIES[$index]}"
            committed_bytes="$(git cat-file -s "$REVENUE_REBASELINE_POST_COMMIT_HEAD:$path")"
            committed_sha256="$(git show "$REVENUE_REBASELINE_POST_COMMIT_HEAD:$path" | sha256sum | cut -d ' ' -f1)"
            if [[ "$validated_path" != "$path" || "$committed_bytes" != "$validated_bytes" || "$committed_sha256" != "$validated_sha256" ]]; then
              echo "::error::Revenue rebaseline committed artifact identity mismatch: $path"
              exit 1
            fi
          done
          if [[ -n "$(git status --porcelain=v1 --untracked-files=all)" ]]; then
            echo "::error::Revenue rebaseline worktree or index is not clean after commit."
            git status --porcelain=v1 --untracked-files=all
            exit 1
          fi
          git push origin "HEAD:$TARGET_BRANCH"

      - name: Commit research and backtest outputs
        if: ${{ env.ANY_RESEARCH_SELECTED == 'true' && github.event.inputs.run_revenue_unreacted_range_source_snapshot_projection_rebaseline_only != 'true' && github.event.inputs.run_revenue_unreacted_range_source_snapshot_projection_candidate_repair_only != 'true' && github.event.inputs.run_revenue_unreacted_range_source_snapshot_projection_supersede_only != 'true' }}
        env:
          REVENUE_FORWARD_HOLDOUT_ONLY: ${{ github.event.inputs.run_revenue_unreacted_range_forward_holdout_only }}
          REVENUE_SOURCE_PROJECTION_REBASELINE_ONLY: ${{ github.event.inputs.run_revenue_unreacted_range_source_snapshot_projection_rebaseline_only }}
        run: |
          set -euo pipefail
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          if [[ "${{ github.event.inputs.run_price_pullback_23ema_research }}" == "true" ]]; then
            git add output/latest/research_backtest/price_pullback_23ema_* || true
            git add output/history/research/price_pullback_23ema_* || true
            git add docs/latest/price_pullback_23ema_* || true
          fi

          if [[ "${{ github.event.inputs.run_shared_model_research_data_refresh }}" == "true" ]]; then
            git add output/latest/research_backtest/monthly_revenue_point_in_time_panel_latest.* || true
            git add output/history/research/monthly_revenue_point_in_time_panel.csv || true
            git add docs/latest/monthly_revenue_point_in_time_panel_latest.* || true
            git add output/latest/research_backtest/daily_model_signal_background_feature_panel_latest.* || true
            git add output/latest/research_backtest/daily_model_background_feature_catalog_latest.* || true
            git add docs/latest/daily_model_signal_background_feature_panel_latest.* || true
            git add docs/latest/daily_model_background_feature_catalog_latest.* || true
          fi

          if [[ "${{ github.event.inputs.run_revenue_unreacted_range_research }}" == "true" ]]; then
            if [[ "$REVENUE_FORWARD_HOLDOUT_ONLY" == "true" ]]; then
              git add output/latest/research_backtest/revenue_unreacted_range_forward_holdout_* || true
              git add output/history/research/revenue_unreacted_range_forward_holdout_* || true
              git add docs/latest/revenue_unreacted_range_forward_holdout_* || true
            elif [[ "$REVENUE_SOURCE_PROJECTION_REBASELINE_ONLY" != "true" ]]; then
              git add output/latest/research_backtest/revenue_unreacted_range_* || true
              git add output/history/research/revenue_unreacted_range_* || true
              git add docs/latest/revenue_unreacted_range_* || true
            fi
          fi

          if [[ "${{ github.event.inputs.run_volume_range_breakout_v2_research }}" == "true" ]]; then
            git add output/latest/research_backtest/volume_range_breakout_v2_* || true
            git add output/history/research/volume_range_breakout_v2_* || true
            git add docs/latest/volume_range_breakout_v2_* || true
          fi

          if [[ "${{ github.event.inputs.run_market_timing }}" == "true" ]]; then
            git add output/history/market_timing/ || true
            git add output/latest/market_timing_* || true
            git add docs/latest/market_timing_* || true
          fi

          if [[ "${{ github.event.inputs.run_weekly_surge }}" == "true" ]]; then
            git add output/history/research/weekly_* || true
            git add output/latest/weekly_* || true
            git add docs/latest/weekly_* || true
          fi

          if [[ "${{ github.event.inputs.run_explosive_volume }}" == "true" ]]; then
            git add output/history/research/explosive_volume_up_* || true
            git add output/latest/explosive_volume_up_* || true
            git add docs/latest/explosive_volume_up_* || true
          fi

          if [[ "${{ github.event.inputs.run_surge_model }}" == "true" ]]; then
            git add output/history/surge_model/ || true
            git add output/latest/surge_model_* output/latest/surge_precondition_candidates_latest.* || true
            git add docs/latest/surge_model_* docs/latest/surge_precondition_candidates_latest.* || true
          fi

          if [[ "${{ github.event.inputs.run_signal_performance }}" == "true" ]]; then
            git add output/history/daily_signals/ || true
            git add output/history/research/daily_published_snapshot_ranking_* || true
            git add output/latest/daily_signal_performance_* || true
            git add output/latest/research_backtest/daily_published_snapshot_ranking_backtest_latest.* || true
            git add docs/latest/daily_signal_performance_* || true
            git add docs/latest/daily_published_snapshot_ranking_backtest_latest.* || true
          fi

          if [[ "${{ github.event.inputs.run_volume_breakout }}" == "true" ]]; then
            git add output/history/volume_breakout/ || true
            git add output/history/research/volume_breakout_* || true
            git add output/latest/volume_breakout_* output/latest/historical_pattern_operation_* || true
            git add docs/latest/volume_breakout_* docs/latest/historical_pattern_operation_* || true
          fi

          if [[ "${{ github.event.inputs.run_catalyst_performance }}" == "true" ]]; then
            git add output/history/catalyst_performance/ || true
          fi

          if [[ "${{ github.event.inputs.run_msci_rebalance }}" == "true" ]]; then
            git add output/history/msci_index_reviews/ data/msci_index_reviews/ || true
            git add output/latest/msci_taiwan_rebalance_* || true
            git add docs/latest/msci_taiwan_rebalance_* || true
          fi

          if [[ "${{ github.event.inputs.run_tdcc_signal_performance }}" == "true" ]]; then
            git add output/history/research/tdcc_weekly_* || true
            git add output/latest/tdcc_weekly_ranking_backtest_latest.* || true
            git add docs/latest/tdcc_weekly_ranking_backtest_latest.* || true
          fi

          if [[ "${{ github.event.inputs.run_tdcc_short_term_edge }}" == "true" ]]; then
            git add output/history/tdcc_signals/ || true
            git add output/latest/tdcc_overheated_short_term_edge* || true
            git add docs/latest/tdcc_overheated_short_term_edge* || true
          fi

          if [[ "${{ github.event.inputs.run_short_term_specialty_packet }}" == "true" ]]; then
            git add output/latest/daily_short_term_specialty_packet_latest.md || true
            git add docs/latest/daily_short_term_specialty_packet_latest.md || true
          fi
          git status --short
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Update research backtest outputs"
          git push origin "HEAD:$TARGET_BRANCH"
