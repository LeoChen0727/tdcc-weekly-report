            committed_bytes="$(git cat-file -s "$REVENUE_REBASELINE_POST_COMMIT_HEAD:$path")"
            committed_sha256="$(git show "$REVENUE_REBASELINE_POST_COMMIT_HEAD:$path" | sha256sum | cut -d ' ' -f1)"
            if [[ "$validated_path" != "$path" || "$committed_bytes" != "$validated_bytes" || "$committed_sha256" != "$validated_sha256" ]]; then
              echo "::error::Revenue rebaseline committed artifact identity mismatch: $path"
              exit 1
            fi
          done
          if [[ -n "$(git status --porcelain=v1 --untracked-files=all)" ]]; then
            echo "::error::Revenue rebaseline worktree or index is not clean after commit."
            git status --porcelain=v1 --untracked-files=all
            exit 1
          fi
          git push origin "HEAD:$TARGET_BRANCH"

