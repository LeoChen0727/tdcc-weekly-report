name: Research Backtest Pipeline

on:
  workflow_dispatch:
    inputs:
      run_market_timing:
        description: "Run market technical timing backtest"
        required: false
        default: "false"
      run_weekly_surge:
        description: "Run weekly surge parameter research"
        required: false
        default: "false"
      run_explosive_volume:
        description: "Run explosive volume up research"
        required: false
        default: "false"
      run_surge_model:
        description: "Run surge precondition model"
        required: false
        default: "false"
      run_signal_performance:
        description: "Run daily signal performance reports"
        required: false
        default: "false"
      run_volume_breakout:
        description: "Run volume breakout watch backtest"
        required: false
        default: "false"
      run_catalyst_performance:
        description: "Run catalyst performance tracking"
        required: false
        default: "false"
      run_msci_rebalance:
        description: "Run MSCI Taiwan rebalance event backtest"
        required: false
        default: "false"
      run_tdcc_signal_performance:
        description: "Run TDCC weekly ranking formula backtest"
        required: false
        default: "false"
      run_tdcc_short_term_edge:
        description: "Run TDCC overheated short-term edge research"
        required: false
        default: "false"
      run_short_term_specialty_packet:
        description: "Run short-term specialty ChatGPT packet rebuild"
        required: false
        default: "false"
      run_shared_model_research_data_refresh:
        description: "Refresh shared objective PIT data for selected model research"
        required: false
        default: "false"
      run_price_pullback_23ema_research:
        description: "Run model-owned 23EMA research only"
        required: false
        default: "false"
      run_revenue_unreacted_range_research:
        description: "Run model-owned revenue lag and strength research only"
        required: false
        default: "false"
      run_volume_range_breakout_v2_research:
        description: "Run model-owned volume breakout v2 research only"
        required: false
        default: "false"

permissions:
  contents: write

concurrency:
  group: research-backtest-pipeline-${{ github.ref }}
  cancel-in-progress: false

jobs:
  research-backtest-pipeline:
    runs-on: ubuntu-latest

    env:
      TARGET_BRANCH: ${{ github.ref_name }}
      ANY_RESEARCH_SELECTED: ${{ github.event.inputs.run_market_timing == 'true' || github.event.inputs.run_weekly_surge == 'true' || github.event.inputs.run_explosive_volume == 'true' || github.event.inputs.run_surge_model == 'true' || github.event.inputs.run_signal_performance == 'true' || github.event.inputs.run_volume_breakout == 'true' || github.event.inputs.run_catalyst_performance == 'true' || github.event.inputs.run_msci_rebalance == 'true' || github.event.inputs.run_tdcc_signal_performance == 'true' || github.event.inputs.run_tdcc_short_term_edge == 'true' || github.event.inputs.run_short_term_specialty_packet == 'true' || github.event.inputs.run_shared_model_research_data_refresh == 'true' || github.event.inputs.run_price_pullback_23ema_research == 'true' || github.event.inputs.run_revenue_unreacted_range_research == 'true' || github.event.inputs.run_volume_range_breakout_v2_research == 'true' }}
      MODEL_RESEARCH_SELECTED: ${{ github.event.inputs.run_price_pullback_23ema_research == 'true' || github.event.inputs.run_revenue_unreacted_range_research == 'true' || github.event.inputs.run_volume_range_breakout_v2_research == 'true' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Synchronize target branch before research
        run: |
          git pull --ff-only origin "$TARGET_BRANCH"

      - name: Validate Apps Script workflow triggers
        run: |
          python scripts/validate_apps_script_workflow_triggers.py
          python scripts/validate_repo_production_inventory.py
          python scripts/validate_daily_model_background_data_registry.py
          python scripts/validate_research_production_boundaries.py
          python scripts/validate_model_research_artifact_ownership.py
          python scripts/validate_model_research_shared_utilities.py
          python scripts/validate_formal_model_evidence_pins.py
          python scripts/validate_model_research_workflow_isolation.py

      - name: Install dependencies
        if: ${{ env.ANY_RESEARCH_SELECTED == 'true' }}
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests tabulate matplotlib pillow openpyxl lxml html5lib beautifulsoup4 reportlab pypdf

      - name: Build market timing technical backtest
        if: ${{ github.event.inputs.run_market_timing == 'true' }}
        run: |
          python scripts/update_market_index_history.py
          python scripts/build_market_timing_technical_backtest.py

      - name: Build TDCC overheated short-term edge
        if: ${{ github.event.inputs.run_tdcc_short_term_edge == 'true' }}
        run: |
          python scripts/build_tdcc_signal_structures.py --full-history --price-metrics-limit 0
          python scripts/update_tdcc_normalized_signal_performance.py
          python scripts/build_tdcc_overheated_short_term_edge.py

      - name: Build TDCC weekly ranking formula backtest
        if: ${{ github.event.inputs.run_tdcc_signal_performance == 'true' }}
        run: |
          python scripts/build_tdcc_weekly_ranking_backtest.py
          python scripts/validate_tdcc_weekly_ranking_backtest.py

      - name: Build weekly surge parameter research
        if: ${{ github.event.inputs.run_weekly_surge == 'true' }}
        run: |
          python scripts/research_weekly_20pct_surge_volume.py
          python scripts/research_weekly_surge_theme_segments.py
          python scripts/research_weekly_surge_technical_grid.py
          python scripts/research_weekly_surge_multifactor_grid.py
          python scripts/build_weekly_surge_multifactor_candidates.py
          python scripts/research_weekly_surge_strict_parameter_search.py
          python scripts/build_weekly_surge_strict_parameter_candidates.py

      - name: Build explosive volume up research
        if: ${{ github.event.inputs.run_explosive_volume == 'true' }}
        run: |
          python scripts/research_explosive_volume_up.py

      - name: Build short-term specialty packet
        if: ${{ github.event.inputs.run_short_term_specialty_packet == 'true' }}
        run: |
          python scripts/build_daily_short_term_specialty_packet.py

      - name: Refresh shared objective model research data
        if: ${{ github.event.inputs.run_shared_model_research_data_refresh == 'true' }}
        run: |
          python scripts/build_monthly_revenue_point_in_time_panel.py
          python scripts/validate_monthly_revenue_point_in_time_panel.py
          python scripts/build_daily_model_signal_background_features.py
          python scripts/validate_daily_model_signal_background_features.py

      - name: Build model-owned 23EMA research
        if: ${{ github.event.inputs.run_price_pullback_23ema_research == 'true' }}
        run: |
          python scripts/build_price_pullback_23ema_research.py
          python scripts/validate_price_pullback_promotion_matrix.py
          python scripts/validate_price_pullback_daily_row_parity.py

      - name: Build model-owned revenue lag and strength research
        if: ${{ github.event.inputs.run_revenue_unreacted_range_research == 'true' }}
        run: |
          python scripts/build_revenue_unreacted_range_research.py
          python scripts/validate_daily_model_revenue_condition_matrix.py
          python scripts/validate_revenue_unreacted_range_operation_candidate_matrix.py
          python scripts/validate_revenue_unreacted_range_feature_contrast_audit.py
          python scripts/validate_revenue_unreacted_range_close_confirmation_timing_audit.py
          python scripts/validate_revenue_unreacted_range_fixed_confirmation_feature_contrast.py
          python scripts/validate_revenue_unreacted_range_extreme_return_path_audit.py
          python scripts/validate_revenue_unreacted_range_lag_strength_matrix.py
          python scripts/validate_revenue_unreacted_range_launch_timing_feature_audit.py
          python scripts/validate_revenue_unreacted_range_source_first_condition_audit.py
          python scripts/validate_revenue_unreacted_range_forward_confirmation_feature_audit.py
          python scripts/validate_revenue_unreacted_range_rearmed_operation_grid.py
          python scripts/validate_revenue_unreacted_range_operation_lag_bucket_audit.py
          python scripts/validate_revenue_unreacted_range_position_shape_transition_matrix.py

      - name: Build volume breakout watch backtest
        if: ${{ github.event.inputs.run_volume_breakout == 'true' }}
        run: |
          python scripts/build_volume_breakout_watch.py
          python scripts/validate_volume_breakout_watch.py
          python scripts/build_historical_pattern_operation_registry.py
          python scripts/validate_historical_pattern_operation_registry.py
          python scripts/build_volume_breakout_buy_signal_grid.py
          python scripts/validate_volume_breakout_buy_signal_grid.py
          python scripts/build_volume_breakout_tdcc_buy_signal_grid.py
          python scripts/validate_volume_breakout_tdcc_buy_signal_grid.py
          python scripts/build_volume_breakout_pattern_classification.py
          python scripts/validate_volume_breakout_pattern_classification.py
          python scripts/build_volume_breakout_tdcc_confluence_backtest.py
          python scripts/validate_volume_breakout_tdcc_confluence_backtest.py
          python scripts/build_volume_breakout_confirmed_operation_backtest.py
          python scripts/validate_volume_breakout_confirmed_operation_backtest.py
          python scripts/build_volume_breakout_operation_pdf_preview.py
          python scripts/validate_volume_breakout_operation_pdf_preview.py

      - name: Build model-owned volume breakout v2 research
        if: ${{ github.event.inputs.run_volume_range_breakout_v2_research == 'true' }}
        run: |
          python scripts/build_volume_range_breakout_v2_research.py

      - name: Build surge precondition model
        if: ${{ github.event.inputs.run_surge_model == 'true' }}
        run: |
          python scripts/build_surge_precondition_model.py
          python scripts/validate_surge_precondition_model.py

      - name: Update daily candidate signal performance
        if: ${{ github.event.inputs.run_signal_performance == 'true' }}
        run: |
          python scripts/update_daily_candidate_signal_performance.py
          python scripts/generate_daily_signal_performance_report.py
          python scripts/validate_daily_signal_performance.py
          python scripts/build_daily_published_snapshot_ranking_backtest.py
          python scripts/validate_daily_published_snapshot_ranking_backtest.py

      - name: Update catalyst performance tracking
        if: ${{ github.event.inputs.run_catalyst_performance == 'true' }}
        run: |
          python scripts/update_catalyst_performance.py

      - name: Build MSCI Taiwan rebalance event backtest
        if: ${{ github.event.inputs.run_msci_rebalance == 'true' }}
        run: |
          python scripts/build_msci_taiwan_rebalance_backtest.py

      - name: Validate post-run model research contracts
        if: ${{ env.MODEL_RESEARCH_SELECTED == 'true' }}
        run: |
          python scripts/validate_model_research_artifact_ownership.py
          python scripts/validate_formal_model_evidence_pins.py
          python scripts/validate_daily_model_research_parity.py

      - name: Commit research and backtest outputs
        if: ${{ env.ANY_RESEARCH_SELECTED == 'true' }}
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          if [[ "${{ github.event.inputs.run_price_pullback_23ema_research }}" == "true" ]]; then
            git add output/latest/research_backtest/price_pullback_23ema_* || true
            git add output/history/research/price_pullback_23ema_* || true
            git add docs/latest/price_pullback_23ema_* || true
          fi

          if [[ "${{ github.event.inputs.run_shared_model_research_data_refresh }}" == "true" ]]; then
            git add output/latest/research_backtest/monthly_revenue_point_in_time_panel_latest.* || true
            git add output/history/research/monthly_revenue_point_in_time_panel.csv || true
            git add docs/latest/monthly_revenue_point_in_time_panel_latest.* || true
            git add output/latest/research_backtest/daily_model_signal_background_feature_panel_latest.* || true
            git add output/latest/research_backtest/daily_model_background_feature_catalog_latest.* || true
            git add docs/latest/daily_model_signal_background_feature_panel_latest.* || true
            git add docs/latest/daily_model_background_feature_catalog_latest.* || true
          fi

          if [[ "${{ github.event.inputs.run_revenue_unreacted_range_research }}" == "true" ]]; then
            git add output/latest/research_backtest/revenue_unreacted_range_* || true
            git add output/history/research/revenue_unreacted_range_* || true
            git add docs/latest/revenue_unreacted_range_* || true
          fi

          if [[ "${{ github.event.inputs.run_volume_range_breakout_v2_research }}" == "true" ]]; then
            git add output/latest/research_backtest/volume_range_breakout_v2_* || true
            git add output/history/research/volume_range_breakout_v2_* || true
            git add docs/latest/volume_range_breakout_v2_* || true
          fi

          if [[ "${{ github.event.inputs.run_market_timing }}" == "true" ]]; then
            git add output/history/market_timing/ || true
            git add output/latest/market_timing_* || true
            git add docs/latest/market_timing_* || true
          fi

          if [[ "${{ github.event.inputs.run_weekly_surge }}" == "true" ]]; then
            git add output/history/research/weekly_* || true
            git add output/latest/weekly_* || true
            git add docs/latest/weekly_* || true
          fi

          if [[ "${{ github.event.inputs.run_explosive_volume }}" == "true" ]]; then
            git add output/history/research/explosive_volume_up_* || true
            git add output/latest/explosive_volume_up_* || true
            git add docs/latest/explosive_volume_up_* || true
          fi

          if [[ "${{ github.event.inputs.run_surge_model }}" == "true" ]]; then
            git add output/history/surge_model/ || true
            git add output/latest/surge_model_* output/latest/surge_precondition_candidates_latest.* || true
            git add docs/latest/surge_model_* docs/latest/surge_precondition_candidates_latest.* || true
          fi

          if [[ "${{ github.event.inputs.run_signal_performance }}" == "true" ]]; then
            git add output/history/daily_signals/ || true
            git add output/history/research/daily_published_snapshot_ranking_* || true
            git add output/latest/daily_signal_performance_* || true
            git add output/latest/research_backtest/daily_published_snapshot_ranking_backtest_latest.* || true
            git add docs/latest/daily_signal_performance_* || true
            git add docs/latest/daily_published_snapshot_ranking_backtest_latest.* || true
          fi

          if [[ "${{ github.event.inputs.run_volume_breakout }}" == "true" ]]; then
            git add output/history/volume_breakout/ || true
            git add output/history/research/volume_breakout_* || true
            git add output/latest/volume_breakout_* output/latest/historical_pattern_operation_* || true
            git add docs/latest/volume_breakout_* docs/latest/historical_pattern_operation_* || true
          fi

          if [[ "${{ github.event.inputs.run_catalyst_performance }}" == "true" ]]; then
            git add output/history/catalyst_performance/ || true
          fi

          if [[ "${{ github.event.inputs.run_msci_rebalance }}" == "true" ]]; then
            git add output/history/msci_index_reviews/ data/msci_index_reviews/ || true
            git add output/latest/msci_taiwan_rebalance_* || true
            git add docs/latest/msci_taiwan_rebalance_* || true
          fi

          if [[ "${{ github.event.inputs.run_tdcc_signal_performance }}" == "true" ]]; then
            git add output/history/research/tdcc_weekly_* || true
            git add output/latest/tdcc_weekly_ranking_backtest_latest.* || true
            git add docs/latest/tdcc_weekly_ranking_backtest_latest.* || true
          fi

          if [[ "${{ github.event.inputs.run_tdcc_short_term_edge }}" == "true" ]]; then
            git add output/history/tdcc_signals/ || true
            git add output/latest/tdcc_overheated_short_term_edge* || true
            git add docs/latest/tdcc_overheated_short_term_edge* || true
          fi

          if [[ "${{ github.event.inputs.run_short_term_specialty_packet }}" == "true" ]]; then
            git add output/latest/daily_short_term_specialty_packet_latest.md || true
            git add docs/latest/daily_short_term_specialty_packet_latest.md || true
          fi
          git status --short
          git commit -m "Update research backtest outputs" || echo "No changes to commit"
          bash scripts/ci_push_with_retry.sh "$TARGET_BRANCH" 5
