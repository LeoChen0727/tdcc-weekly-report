            if [[ "$validated_path" != "$path" || "$staged_bytes" != "$validated_bytes" || "$staged_sha256" != "$validated_sha256" ]]; then
              echo "::error::Revenue rebaseline pre-commit staged artifact identity mismatch: $path"
              exit 1
            fi
          done
          git commit -m "Update revenue projection v2 rebaseline candidate artifacts"
          REVENUE_REBASELINE_POST_COMMIT_HEAD="$(git rev-parse HEAD)"
