name: Research Backtest Pipeline

on:
  workflow_dispatch:
    inputs:
      run_market_timing:
        description: "Run market technical timing backtest"
        required: false
        default: "true"
      run_weekly_surge:
        description: "Run weekly surge parameter research"
        required: false
        default: "true"
      run_explosive_volume:
        description: "Run explosive volume up research"
        required: false
        default: "true"
      run_surge_model:
        description: "Run surge precondition model"
        required: false
        default: "true"
      run_signal_performance:
        description: "Run daily signal performance reports"
        required: false
        default: "true"
      run_volume_breakout:
        description: "Run volume breakout watch backtest"
        required: false
        default: "true"
      run_catalyst_performance:
        description: "Run catalyst performance tracking"
        required: false
        default: "true"
      run_msci_rebalance:
        description: "Run MSCI Taiwan rebalance event backtest"
        required: false
        default: "true"
      run_tdcc_signal_performance:
        description: "Run TDCC weekly ranking formula backtest"
        required: false
        default: "true"
      run_tdcc_short_term_edge:
        description: "Run TDCC overheated short-term edge research"
        required: false
        default: "true"
      run_short_term_specialty_packet:
        description: "Run short-term specialty ChatGPT packet rebuild"
        required: false
        default: "true"
      run_model_parameter_research:
        description: "Run daily candidate model parameter research"
        required: false
        default: "true"

permissions:
  contents: write

concurrency:
  group: research-backtest-pipeline-${{ github.ref }}
  cancel-in-progress: false

jobs:
  research-backtest-pipeline:
    runs-on: ubuntu-latest

    env:
      TARGET_BRANCH: ${{ github.ref_name }}
      ANY_RESEARCH_SELECTED: ${{ github.event.inputs.run_market_timing == 'true' || github.event.inputs.run_weekly_surge == 'true' || github.event.inputs.run_explosive_volume == 'true' || github.event.inputs.run_surge_model == 'true' || github.event.inputs.run_signal_performance == 'true' || github.event.inputs.run_volume_breakout == 'true' || github.event.inputs.run_catalyst_performance == 'true' || github.event.inputs.run_msci_rebalance == 'true' || github.event.inputs.run_tdcc_signal_performance == 'true' || github.event.inputs.run_tdcc_short_term_edge == 'true' || github.event.inputs.run_short_term_specialty_packet == 'true' || github.event.inputs.run_model_parameter_research == 'true' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Validate Apps Script workflow triggers
        run: |
          python scripts/validate_apps_script_workflow_triggers.py
          python scripts/validate_repo_production_inventory.py
          python scripts/validate_daily_model_background_data_registry.py
          python scripts/validate_research_production_boundaries.py

      - name: Install dependencies
        if: ${{ env.ANY_RESEARCH_SELECTED == 'true' }}
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests tabulate matplotlib pillow openpyxl lxml html5lib beautifulsoup4 reportlab pypdf

      - name: Build market timing technical backtest
        if: ${{ github.event.inputs.run_market_timing == 'true' }}
        run: |
          python scripts/update_market_index_history.py
          python scripts/build_market_timing_technical_backtest.py

      - name: Build TDCC overheated short-term edge
        if: ${{ github.event.inputs.run_tdcc_short_term_edge == 'true' }}
        run: |
          python scripts/build_tdcc_signal_structures.py --full-history --price-metrics-limit 0
          python scripts/update_tdcc_normalized_signal_performance.py
          python scripts/build_tdcc_overheated_short_term_edge.py

      - name: Build TDCC weekly ranking formula backtest
        if: ${{ github.event.inputs.run_tdcc_signal_performance == 'true' }}
        run: |
          python scripts/build_tdcc_weekly_ranking_backtest.py
          python scripts/validate_tdcc_weekly_ranking_backtest.py

      - name: Build weekly surge parameter research
        if: ${{ github.event.inputs.run_weekly_surge == 'true' }}
        run: |
          python scripts/research_weekly_20pct_surge_volume.py
          python scripts/research_weekly_surge_theme_segments.py
          python scripts/research_weekly_surge_technical_grid.py
          python scripts/research_weekly_surge_multifactor_grid.py
          python scripts/build_weekly_surge_multifactor_candidates.py
          python scripts/research_weekly_surge_strict_parameter_search.py
          python scripts/build_weekly_surge_strict_parameter_candidates.py

      - name: Build explosive volume up research
        if: ${{ github.event.inputs.run_explosive_volume == 'true' }}
        run: |
          python scripts/research_explosive_volume_up.py

      - name: Build short-term specialty packet
        if: ${{ github.event.inputs.run_short_term_specialty_packet == 'true' }}
        run: |
          python scripts/build_daily_short_term_specialty_packet.py

      - name: Build daily model parameter research
        if: ${{ github.event.inputs.run_model_parameter_research == 'true' }}
        run: |
          python scripts/build_monthly_revenue_point_in_time_panel.py
          python scripts/validate_monthly_revenue_point_in_time_panel.py
          python scripts/build_daily_model_signal_background_features.py
          python scripts/validate_daily_model_signal_background_features.py
          python scripts/build_daily_model_parameter_research.py
          python scripts/validate_daily_model_revenue_condition_matrix.py
          python scripts/validate_price_pullback_promotion_matrix.py
          python scripts/build_daily_model_background_data_cleanup_audit.py
          python scripts/validate_daily_model_background_data_cleanup_audit.py
          python scripts/validate_daily_model_research_parity.py
          python scripts/validate_price_pullback_daily_row_parity.py
          python scripts/build_daily_model_parameter_recommendations.py
          python scripts/build_daily_w_bottom_operation_sections.py
          python scripts/validate_daily_w_bottom_operation_sections.py
          python scripts/build_daily_price_pullback_23ema_operation_section.py
          python scripts/validate_daily_price_pullback_23ema_operation_section.py
          python scripts/build_model_operation_readiness.py
          python scripts/validate_model_operation_readiness.py

      - name: Build volume breakout watch backtest
        if: ${{ github.event.inputs.run_volume_breakout == 'true' }}
        run: |
          python scripts/build_volume_breakout_watch.py
          python scripts/validate_volume_breakout_watch.py
          python scripts/build_historical_pattern_operation_registry.py
          python scripts/validate_historical_pattern_operation_registry.py
          python scripts/build_volume_breakout_buy_signal_grid.py
          python scripts/validate_volume_breakout_buy_signal_grid.py
          python scripts/build_volume_breakout_tdcc_buy_signal_grid.py
          python scripts/validate_volume_breakout_tdcc_buy_signal_grid.py
          python scripts/build_volume_breakout_pattern_classification.py
          python scripts/validate_volume_breakout_pattern_classification.py
          python scripts/build_volume_breakout_tdcc_confluence_backtest.py
          python scripts/validate_volume_breakout_tdcc_confluence_backtest.py
          python scripts/build_volume_breakout_confirmed_operation_backtest.py
          python scripts/validate_volume_breakout_confirmed_operation_backtest.py
          python scripts/build_volume_range_breakout_v2_semantic_audit.py
          python scripts/validate_volume_range_breakout_v2_semantic_audit.py
          python scripts/build_volume_range_breakout_v2_next_day_continuation_timing_audit.py
          python scripts/validate_volume_range_breakout_v2_next_day_continuation_timing_audit.py
          python scripts/build_volume_range_breakout_v2_raw_market_rerun.py
          python scripts/validate_volume_range_breakout_v2_raw_market_rerun.py
          python scripts/build_volume_range_breakout_v2_feature_slice_analysis.py
          python scripts/validate_volume_range_breakout_v2_feature_slice_analysis.py
          python scripts/build_volume_range_breakout_v2_deep_low_base_matrix.py
          python scripts/validate_volume_range_breakout_v2_deep_low_base_matrix.py
          python scripts/build_volume_range_breakout_v2_condition_matrix.py
          python scripts/validate_volume_range_breakout_v2_condition_matrix.py
          python scripts/build_volume_range_breakout_v2_overlap_sensitivity.py
          python scripts/validate_volume_range_breakout_v2_overlap_sensitivity.py
          python scripts/build_approved_operation_patterns.py
          python scripts/validate_approved_operation_patterns.py
          python scripts/build_daily_w_bottom_operation_sections.py
          python scripts/validate_daily_w_bottom_operation_sections.py
          python scripts/build_daily_price_pullback_23ema_operation_section.py
          python scripts/validate_daily_price_pullback_23ema_operation_section.py
          python scripts/build_model_operation_readiness.py
          python scripts/validate_model_operation_readiness.py
          python scripts/build_volume_breakout_operation_pdf_preview.py
          python scripts/validate_volume_breakout_operation_pdf_preview.py

      - name: Build surge precondition model
        if: ${{ github.event.inputs.run_surge_model == 'true' }}
        run: |
          python scripts/build_surge_precondition_model.py
          python scripts/validate_surge_precondition_model.py

      - name: Update daily candidate signal performance
        if: ${{ github.event.inputs.run_signal_performance == 'true' }}
        run: |
          python scripts/update_daily_candidate_signal_performance.py
          python scripts/generate_daily_signal_performance_report.py
          python scripts/validate_daily_signal_performance.py
          python scripts/build_daily_published_snapshot_ranking_backtest.py
          python scripts/validate_daily_published_snapshot_ranking_backtest.py

      - name: Update catalyst performance tracking
        if: ${{ github.event.inputs.run_catalyst_performance == 'true' }}
        run: |
          python scripts/update_catalyst_performance.py

      - name: Build MSCI Taiwan rebalance event backtest
        if: ${{ github.event.inputs.run_msci_rebalance == 'true' }}
        run: |
          python scripts/build_msci_taiwan_rebalance_backtest.py

      - name: Commit research and backtest outputs
        if: ${{ env.ANY_RESEARCH_SELECTED == 'true' }}
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git pull --rebase --autostash origin "$TARGET_BRANCH" || true

          git add output/history/research/ || true
          git add output/history/surge_model/ || true
          git add output/history/market_timing/ || true
          git add output/history/daily_signals/ || true
          git add output/history/tdcc_signals/ || true
          git add output/history/catalyst_performance/ || true
          git add output/history/msci_index_reviews/ || true
          git add data/msci_index_reviews/ || true

          git add output/latest/weekly_surge_*.csv output/latest/weekly_surge_*.md || true
          git add output/latest/explosive_volume_up_*.csv output/latest/explosive_volume_up_*.md || true
          git add output/history/research/explosive_volume_up_*.csv || true
          git add output/latest/tdcc_overheated_short_term_edge_latest.csv || true
          git add output/latest/tdcc_overheated_short_term_edge_latest.md || true
          git add output/latest/tdcc_overheated_short_term_edge_candidates_latest.csv || true
          git add output/latest/tdcc_weekly_ranking_backtest_latest.csv output/latest/tdcc_weekly_ranking_backtest_latest.md || true
          git add output/latest/daily_short_term_specialty_packet_latest.md || true
          git add docs/latest/weekly_surge_*.csv docs/latest/weekly_surge_*.md || true
          git add docs/latest/explosive_volume_up_*.csv docs/latest/explosive_volume_up_*.md || true
          git add docs/latest/tdcc_overheated_short_term_edge_latest.csv docs/latest/tdcc_overheated_short_term_edge_latest.md || true
          git add docs/latest/tdcc_overheated_short_term_edge_candidates_latest.csv || true
          git add docs/latest/tdcc_weekly_ranking_backtest_latest.csv docs/latest/tdcc_weekly_ranking_backtest_latest.md || true
          git add docs/latest/daily_short_term_specialty_packet_latest.md || true
          git add output/latest/daily_model_parameter_research_*.csv output/latest/daily_model_parameter_research_*.md || true
          git add output/latest/research_backtest/daily_model_signal_background_feature_panel_latest.csv output/latest/research_backtest/daily_model_signal_background_feature_panel_latest.md || true
          git add output/latest/research_backtest/daily_model_background_feature_catalog_latest.csv output/latest/research_backtest/daily_model_background_feature_catalog_latest.md || true
          git add output/latest/research_backtest/monthly_revenue_point_in_time_panel_latest.csv output/latest/research_backtest/monthly_revenue_point_in_time_panel_latest.md || true
          git add output/latest/research_backtest/daily_model_background_data_cleanup_audit_latest.csv output/latest/research_backtest/daily_model_background_data_cleanup_audit_latest.md || true
