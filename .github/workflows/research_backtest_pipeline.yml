name: Research Backtest Pipeline

on:
  workflow_dispatch:
    inputs:
      run_market_timing:
        description: "Run market technical timing backtest"
        required: false
        default: "false"
      run_weekly_surge:
        description: "Run weekly surge parameter research"
        required: false
        default: "false"
      run_explosive_volume:
        description: "Run explosive volume up research"
        required: false
        default: "false"
      run_surge_model:
        description: "Run surge precondition model"
        required: false
        default: "false"
      run_signal_performance:
        description: "Run daily signal performance reports"
        required: false
        default: "false"
      run_volume_breakout:
        description: "Run volume breakout watch backtest"
        required: false
        default: "false"
      run_catalyst_performance:
        description: "Run catalyst performance tracking"
        required: false
        default: "false"
      run_msci_rebalance:
        description: "Run MSCI Taiwan rebalance event backtest"
        required: false
        default: "false"
      run_tdcc_signal_performance:
        description: "Run TDCC weekly ranking formula backtest"
        required: false
        default: "false"
      run_tdcc_short_term_edge:
        description: "Run TDCC overheated short-term edge research"
        required: false
        default: "false"
      run_short_term_specialty_packet:
        description: "Run short-term specialty ChatGPT packet rebuild"
        required: false
        default: "false"
      run_shared_model_research_data_refresh:
        description: "Refresh shared objective PIT data for selected model research"
        required: false
        default: "false"
      run_price_pullback_23ema_research:
        description: "Run model-owned 23EMA research only"
        required: false
        default: "false"
      run_revenue_unreacted_range_research:
        description: "Run model-owned revenue lag and strength research only"
        required: false
        default: "false"
      run_revenue_unreacted_range_source_snapshot_projection_chain_only:
        description: "When revenue research is selected, rebuild only its downstream chain from the pinned 20260713 source snapshot projection"
        required: false
        default: "false"
      run_revenue_unreacted_range_source_snapshot_projection_rebaseline_only:
        description: "Build only the branch-scoped immutable v1 archive and v2 source snapshot projection candidate"
        required: false
        default: false
        type: boolean
      run_revenue_unreacted_range_source_snapshot_projection_candidate_repair_only:
        description: "Repair only the branch-scoped projection v2 candidate audit CSV line endings"
        required: false
        default: false
        type: boolean
      run_revenue_unreacted_range_source_snapshot_projection_supersede_only:
        description: "Supersede the research canonical source projection with approved v2 and rebuild only its downstream research chain"
        required: false
        default: false
        type: boolean
      expected_base_sha:
        description: "Exact direct parent of the authorized revenue projection supersede code commit"
        required: false
        default: ""
        type: string
      expected_head_sha:
        description: "Exact authorized revenue projection supersede code commit at the dispatched branch head"
        required: false
        default: ""
        type: string
      confirmation:
        description: "Exact confirmation for the one-time revenue projection v2 research canonical supersede"
        required: false
        default: ""
        type: string
      run_volume_range_breakout_v2_research:
        description: "Run model-owned volume breakout v2 research only"
        required: false
        default: "false"
      run_revenue_unreacted_range_forward_holdout_only:
        description: "Declare the model-owned revenue forward holdout input; disabled by default"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: research-backtest-pipeline-${{ github.ref }}
  cancel-in-progress: false

jobs:
  research-backtest-pipeline:
    runs-on: ubuntu-latest

    env:
      TARGET_BRANCH: ${{ github.ref_name }}
      ANY_RESEARCH_SELECTED: ${{ github.event.inputs.run_market_timing == 'true' || github.event.inputs.run_weekly_surge == 'true' || github.event.inputs.run_explosive_volume == 'true' || github.event.inputs.run_surge_model == 'true' || github.event.inputs.run_signal_performance == 'true' || github.event.inputs.run_volume_breakout == 'true' || github.event.inputs.run_catalyst_performance == 'true' || github.event.inputs.run_msci_rebalance == 'true' || github.event.inputs.run_tdcc_signal_performance == 'true' || github.event.inputs.run_tdcc_short_term_edge == 'true' || github.event.inputs.run_short_term_specialty_packet == 'true' || github.event.inputs.run_shared_model_research_data_refresh == 'true' || github.event.inputs.run_price_pullback_23ema_research == 'true' || github.event.inputs.run_revenue_unreacted_range_research == 'true' || github.event.inputs.run_volume_range_breakout_v2_research == 'true' }}
      MODEL_RESEARCH_SELECTED: ${{ github.event.inputs.run_price_pullback_23ema_research == 'true' || github.event.inputs.run_revenue_unreacted_range_research == 'true' || github.event.inputs.run_volume_range_breakout_v2_research == 'true' }}
      TDCC_RESEARCH_SELECTED: ${{ github.event.inputs.run_weekly_surge == 'true' || github.event.inputs.run_surge_model == 'true' || github.event.inputs.run_volume_breakout == 'true' || github.event.inputs.run_tdcc_signal_performance == 'true' || github.event.inputs.run_tdcc_short_term_edge == 'true' || github.event.inputs.run_shared_model_research_data_refresh == 'true' }}

    steps:
      - name: Require production artifact write deploy key
        shell: bash
        env:
          PRODUCTION_ARTIFACT_WRITE_DEPLOY_KEY: ${{ secrets.PRODUCTION_ARTIFACT_WRITE_DEPLOY_KEY }}
        run: |
          if [ -z "${PRODUCTION_ARTIFACT_WRITE_DEPLOY_KEY}" ]; then
            echo "::error::PRODUCTION_ARTIFACT_WRITE_DEPLOY_KEY is required for artifact publishing."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ssh-key: ${{ secrets.PRODUCTION_ARTIFACT_WRITE_DEPLOY_KEY }}
          persist-credentials: true
          ref: ${{ github.ref_name }}
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Synchronize target branch before research
        run: |
          git pull --ff-only origin "$TARGET_BRANCH"

      - name: Install pinned workflow contract parser
        run: |
          python -m pip install --disable-pip-version-check --no-input PyYAML==6.0.2

      - name: Validate Apps Script workflow triggers
        env:
          REVENUE_FORWARD_HOLDOUT_ONLY: ${{ github.event.inputs.run_revenue_unreacted_range_forward_holdout_only }}
          REVENUE_RESEARCH_ENABLED: ${{ github.event.inputs.run_revenue_unreacted_range_research }}
          REVENUE_SOURCE_PROJECTION_CHAIN_ONLY: ${{ github.event.inputs.run_revenue_unreacted_range_source_snapshot_projection_chain_only }}
          REVENUE_SOURCE_PROJECTION_REBASELINE_ONLY: ${{ github.event.inputs.run_revenue_unreacted_range_source_snapshot_projection_rebaseline_only }}
          REVENUE_SOURCE_PROJECTION_CANDIDATE_REPAIR_ONLY: ${{ github.event.inputs.run_revenue_unreacted_range_source_snapshot_projection_candidate_repair_only }}
          REVENUE_SOURCE_PROJECTION_SUPERSEDE_ONLY: ${{ github.event.inputs.run_revenue_unreacted_range_source_snapshot_projection_supersede_only }}
          REVENUE_SUPERSEDE_EXPECTED_BASE_SHA: ${{ github.event.inputs.expected_base_sha }}
          REVENUE_SUPERSEDE_EXPECTED_HEAD_SHA: ${{ github.event.inputs.expected_head_sha }}
          REVENUE_SUPERSEDE_CONFIRMATION: ${{ github.event.inputs.confirmation }}
          REVENUE_REBASELINE_REF_TYPE: ${{ github.ref_type }}
          REVENUE_REBASELINE_OTHER_RESEARCH_SELECTED: ${{ github.event.inputs.run_market_timing == 'true' || github.event.inputs.run_weekly_surge == 'true' || github.event.inputs.run_explosive_volume == 'true' || github.event.inputs.run_surge_model == 'true' || github.event.inputs.run_signal_performance == 'true' || github.event.inputs.run_volume_breakout == 'true' || github.event.inputs.run_catalyst_performance == 'true' || github.event.inputs.run_msci_rebalance == 'true' || github.event.inputs.run_tdcc_signal_performance == 'true' || github.event.inputs.run_tdcc_short_term_edge == 'true' || github.event.inputs.run_short_term_specialty_packet == 'true' || github.event.inputs.run_shared_model_research_data_refresh == 'true' || github.event.inputs.run_price_pullback_23ema_research == 'true' || github.event.inputs.run_volume_range_breakout_v2_research == 'true' }}
        run: |
          set -euo pipefail
          if [[ "$REVENUE_FORWARD_HOLDOUT_ONLY" == "true" && "$REVENUE_RESEARCH_ENABLED" != "true" ]]; then
            echo "::error::Revenue forward holdout mode requires run_revenue_unreacted_range_research=true."
            exit 1
          fi
          if [[ "$REVENUE_FORWARD_HOLDOUT_ONLY" == "true" && "$REVENUE_SOURCE_PROJECTION_CHAIN_ONLY" == "true" ]]; then
            echo "::error::Revenue forward holdout mode and source snapshot projection chain mode are mutually exclusive."
            exit 1
          fi
          if [[ "$REVENUE_SOURCE_PROJECTION_REBASELINE_ONLY" == "true" && "$REVENUE_RESEARCH_ENABLED" != "true" ]]; then
            echo "::error::Revenue source snapshot projection rebaseline mode requires run_revenue_unreacted_range_research=true."
            exit 1
          fi
          if [[ "$REVENUE_SOURCE_PROJECTION_REBASELINE_ONLY" == "true" && ( "$REVENUE_FORWARD_HOLDOUT_ONLY" == "true" || "$REVENUE_SOURCE_PROJECTION_CHAIN_ONLY" == "true" || "$REVENUE_SOURCE_PROJECTION_CANDIDATE_REPAIR_ONLY" == "true" || "$REVENUE_SOURCE_PROJECTION_SUPERSEDE_ONLY" == "true" ) ]]; then
            echo "::error::Revenue source snapshot projection rebaseline mode is mutually exclusive with forward holdout, projection chain, candidate repair, and supersede modes."
            exit 1
          fi
          if [[ "$REVENUE_SOURCE_PROJECTION_REBASELINE_ONLY" == "true" && "$REVENUE_REBASELINE_OTHER_RESEARCH_SELECTED" == "true" ]]; then
            echo "::error::Revenue source snapshot projection rebaseline mode forbids every other research input."
            exit 1
          fi
          if [[ "$REVENUE_SOURCE_PROJECTION_REBASELINE_ONLY" == "true" && ( "$REVENUE_REBASELINE_REF_TYPE" != "branch" || "$TARGET_BRANCH" == "main" ) ]]; then
            echo "::error::Revenue source snapshot projection rebaseline mode requires a non-main branch ref."
            exit 1
          fi
          if [[ "$REVENUE_SOURCE_PROJECTION_CANDIDATE_REPAIR_ONLY" == "true" && "$REVENUE_RESEARCH_ENABLED" != "true" ]]; then
            echo "::error::Revenue source snapshot projection candidate repair mode requires run_revenue_unreacted_range_research=true."
            exit 1
          fi
          if [[ "$REVENUE_SOURCE_PROJECTION_CANDIDATE_REPAIR_ONLY" == "true" && ( "$REVENUE_FORWARD_HOLDOUT_ONLY" == "true" || "$REVENUE_SOURCE_PROJECTION_CHAIN_ONLY" == "true" || "$REVENUE_SOURCE_PROJECTION_REBASELINE_ONLY" == "true" || "$REVENUE_SOURCE_PROJECTION_SUPERSEDE_ONLY" == "true" ) ]]; then
            echo "::error::Revenue source snapshot projection candidate repair mode is mutually exclusive with forward holdout, projection chain, rebaseline, and supersede modes."
            exit 1
          fi
          if [[ "$REVENUE_SOURCE_PROJECTION_CANDIDATE_REPAIR_ONLY" == "true" && "$REVENUE_REBASELINE_OTHER_RESEARCH_SELECTED" == "true" ]]; then
            echo "::error::Revenue source snapshot projection candidate repair mode forbids every other research input."
            exit 1
          fi
          if [[ "$REVENUE_SOURCE_PROJECTION_CANDIDATE_REPAIR_ONLY" == "true" && ( "$REVENUE_REBASELINE_REF_TYPE" != "branch" || "$TARGET_BRANCH" == "main" ) ]]; then
            echo "::error::Revenue source snapshot projection candidate repair mode requires a non-main branch ref."
            exit 1
          fi
          if [[ "$REVENUE_SOURCE_PROJECTION_CANDIDATE_REPAIR_ONLY" == "true" && "$GITHUB_RUN_ATTEMPT" != "1" ]]; then
            echo "::error::Revenue source snapshot projection candidate repair mode forbids workflow retry attempts."
            exit 1
          fi
          if [[ "$REVENUE_SOURCE_PROJECTION_CANDIDATE_REPAIR_ONLY" == "true" && "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]]; then
            echo "::error::Revenue source snapshot projection candidate repair HEAD differs from the dispatch SHA after branch synchronization."
            exit 1
          fi
          if [[ "$REVENUE_SOURCE_PROJECTION_CANDIDATE_REPAIR_ONLY" == "true" && "$(git rev-parse HEAD^)" != "4bcaa07123ef4a000c187dc2f19caefbec4cf252" ]]; then
            echo "::error::Revenue source snapshot projection candidate repair must run from the single authorized code commit."
            exit 1
          fi
          if [[ "$REVENUE_SOURCE_PROJECTION_SUPERSEDE_ONLY" != "true" && ( -n "$REVENUE_SUPERSEDE_EXPECTED_BASE_SHA" || -n "$REVENUE_SUPERSEDE_EXPECTED_HEAD_SHA" || -n "$REVENUE_SUPERSEDE_CONFIRMATION" ) ]]; then
            echo "::error::Revenue projection supersede identity inputs are forbidden unless supersede-only mode is selected."
            exit 1
          fi
          if [[ "$REVENUE_SOURCE_PROJECTION_SUPERSEDE_ONLY" == "true" && "$REVENUE_RESEARCH_ENABLED" != "true" ]]; then
            echo "::error::Revenue source snapshot projection supersede mode requires run_revenue_unreacted_range_research=true."
            exit 1
          fi
          if [[ "$REVENUE_SOURCE_PROJECTION_SUPERSEDE_ONLY" == "true" && ( "$REVENUE_FORWARD_HOLDOUT_ONLY" == "true" || "$REVENUE_SOURCE_PROJECTION_CHAIN_ONLY" == "true" || "$REVENUE_SOURCE_PROJECTION_REBASELINE_ONLY" == "true" || "$REVENUE_SOURCE_PROJECTION_CANDIDATE_REPAIR_ONLY" == "true" ) ]]; then
            echo "::error::Revenue source snapshot projection supersede mode is mutually exclusive with forward holdout, projection chain, rebaseline, and candidate repair modes."
            exit 1
          fi
          if [[ "$REVENUE_SOURCE_PROJECTION_SUPERSEDE_ONLY" == "true" && "$REVENUE_REBASELINE_OTHER_RESEARCH_SELECTED" == "true" ]]; then
            echo "::error::Revenue source snapshot projection supersede mode forbids every other research input."
            exit 1
          fi
          if [[ "$REVENUE_SOURCE_PROJECTION_SUPERSEDE_ONLY" == "true" && ( "$GITHUB_EVENT_NAME" != "workflow_dispatch" || "$REVENUE_REBASELINE_REF_TYPE" != "branch" || "$TARGET_BRANCH" == "main" ) ]]; then
            echo "::error::Revenue source snapshot projection supersede mode requires workflow_dispatch on a non-main branch ref."
            exit 1
          fi
          if [[ "$REVENUE_SOURCE_PROJECTION_SUPERSEDE_ONLY" == "true" && "$GITHUB_RUN_ATTEMPT" != "1" ]]; then
            echo "::error::Revenue source snapshot projection supersede mode forbids workflow retry attempts."
            exit 1
          fi
          if [[ "$REVENUE_SOURCE_PROJECTION_SUPERSEDE_ONLY" == "true" && "$REVENUE_SUPERSEDE_CONFIRMATION" != "supersede_revenue_source_snapshot_projection_v2" ]]; then
            echo "::error::Revenue source snapshot projection supersede mode requires the exact confirmation token."
            exit 1
          fi
          if [[ "$REVENUE_SOURCE_PROJECTION_SUPERSEDE_ONLY" == "true" && ( ! "$REVENUE_SUPERSEDE_EXPECTED_BASE_SHA" =~ ^[0-9a-f]{40}$ || ! "$REVENUE_SUPERSEDE_EXPECTED_HEAD_SHA" =~ ^[0-9a-f]{40}$ ) ]]; then
            echo "::error::Revenue source snapshot projection supersede expected_base_sha and expected_head_sha must be exact lowercase commit SHAs."
            exit 1
          fi
          if [[ "$REVENUE_SOURCE_PROJECTION_SUPERSEDE_ONLY" == "true" ]]; then
            REVENUE_SUPERSEDE_CODE_ROOT_SHA="2315df2367b6b475ed4f4aa2fe8b260617854991"
            REVENUE_SUPERSEDE_SHALLOW_STATE="$(git --no-replace-objects rev-parse --is-shallow-repository)"
            if [[ "$REVENUE_SUPERSEDE_SHALLOW_STATE" == "true" ]]; then
              git --no-replace-objects fetch --no-tags --unshallow origin "$TARGET_BRANCH"
            elif [[ "$REVENUE_SUPERSEDE_SHALLOW_STATE" != "false" ]]; then
              echo "::error::Revenue source snapshot projection supersede could not establish repository shallow state."
              exit 1
            fi
            if [[ "$(git --no-replace-objects rev-parse "$REVENUE_SUPERSEDE_EXPECTED_BASE_SHA^{commit}")" != "$REVENUE_SUPERSEDE_EXPECTED_BASE_SHA" ]]; then
              echo "::error::Revenue source snapshot projection supersede expected_base_sha is not a readable commit."
              exit 1
            fi
            if [[ "$(git --no-replace-objects rev-parse "$REVENUE_SUPERSEDE_EXPECTED_HEAD_SHA^{commit}")" != "$REVENUE_SUPERSEDE_EXPECTED_HEAD_SHA" ]]; then
              echo "::error::Revenue source snapshot projection supersede expected_head_sha is not a readable commit."
              exit 1
            fi
            if [[ "$GITHUB_SHA" != "$REVENUE_SUPERSEDE_EXPECTED_HEAD_SHA" || "$(git --no-replace-objects rev-parse HEAD)" != "$REVENUE_SUPERSEDE_EXPECTED_HEAD_SHA" ]]; then
              echo "::error::Revenue source snapshot projection supersede dispatch and checked-out HEAD must equal expected_head_sha."
              exit 1
            fi
            mapfile -t REVENUE_SUPERSEDE_REMOTE_HEADS < <(git ls-remote --exit-code origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')
            if [[ "${#REVENUE_SUPERSEDE_REMOTE_HEADS[@]}" -ne 1 || "${REVENUE_SUPERSEDE_REMOTE_HEADS[0]}" != "$REVENUE_SUPERSEDE_EXPECTED_HEAD_SHA" ]]; then
              echo "::error::Revenue source snapshot projection supersede remote branch must equal expected_head_sha."
              exit 1
            fi
            read -r -a REVENUE_SUPERSEDE_PARENT_FIELDS <<< "$(git --no-replace-objects rev-list --parents -n 1 "$REVENUE_SUPERSEDE_EXPECTED_HEAD_SHA")"
            if [[ "${#REVENUE_SUPERSEDE_PARENT_FIELDS[@]}" -ne 2 || "${REVENUE_SUPERSEDE_PARENT_FIELDS[0]}" != "$REVENUE_SUPERSEDE_EXPECTED_HEAD_SHA" || "${REVENUE_SUPERSEDE_PARENT_FIELDS[1]}" != "$REVENUE_SUPERSEDE_EXPECTED_BASE_SHA" ]]; then
              echo "::error::Revenue source snapshot projection supersede code head must have expected_base_sha as its exact sole direct parent."
              exit 1
            fi
            if [[ "$(git --no-replace-objects rev-parse "$REVENUE_SUPERSEDE_CODE_ROOT_SHA^{commit}")" != "$REVENUE_SUPERSEDE_CODE_ROOT_SHA" ]]; then
              echo "::error::Revenue source snapshot projection supersede code root is not a readable commit."
              exit 1
            fi
            if ! git --no-replace-objects merge-base --is-ancestor "$REVENUE_SUPERSEDE_CODE_ROOT_SHA" "$REVENUE_SUPERSEDE_EXPECTED_HEAD_SHA"; then
              echo "::error::Revenue source snapshot projection supersede code root must be an ancestor of expected_head_sha."
              exit 1
            fi
            REVENUE_SUPERSEDE_CODE_PATHS=(
              .github/workflows/research_backtest_pipeline.yml
              config/apps_script_research_dispatch_inputs.csv
              config/daily_model_background_data_registry.csv
              config/daily_model_data_sharing_migrations.csv
              config/daily_model_data_sharing_registry.csv
              config/repo_file_lifecycle_inventory.csv
              config/repo_production_inventory.csv
              config/report_artifact_lineage.csv
              scripts/build_revenue_unreacted_range_research.py
              scripts/revenue_unreacted_range_forward_confirmation_feature_audit.py
              scripts/revenue_unreacted_range_lag_strength_matrix.py
              scripts/revenue_unreacted_range_launch_timing_feature_audit.py
              scripts/revenue_unreacted_range_low_mid_falling_candidate_audit.py
              scripts/revenue_unreacted_range_operation_lag_bucket_audit.py
              scripts/revenue_unreacted_range_position_shape_transition_matrix.py
              scripts/revenue_unreacted_range_rearmed_operation_grid.py
              scripts/revenue_unreacted_range_source_snapshot_projection.py
              scripts/validate_apps_script_workflow_triggers.py
              scripts/validate_model_research_workflow_isolation.py
              scripts/validate_repo_file_lifecycle_inventory.py
              scripts/validate_repo_production_inventory.py
              scripts/validate_revenue_unreacted_range_forward_confirmation_feature_audit.py
              scripts/validate_revenue_unreacted_range_lag_strength_matrix.py
              scripts/validate_revenue_unreacted_range_launch_timing_feature_audit.py
              scripts/validate_revenue_unreacted_range_low_mid_falling_candidate_audit.py
              scripts/validate_revenue_unreacted_range_operation_lag_bucket_audit.py
              scripts/validate_revenue_unreacted_range_position_shape_transition_matrix.py
              scripts/validate_revenue_unreacted_range_promotion_preparation.py
              scripts/validate_revenue_unreacted_range_rearmed_operation_grid.py
              scripts/validate_revenue_unreacted_range_source_snapshot_projection.py
              tests/test_daily_production_boundaries.py
              tests/test_model_data_independence.py
              tests/test_model_research_workflow_isolation.py
              tests/test_repo_file_lifecycle_inventory.py
              tests/test_repo_production_inventory.py
              tests/test_revenue_unreacted_range_forward_confirmation_feature_audit.py
              tests/test_revenue_unreacted_range_lag_strength_matrix.py
              tests/test_revenue_unreacted_range_launch_timing_feature_audit.py
              tests/test_revenue_unreacted_range_operation_lag_bucket_audit.py
              tests/test_revenue_unreacted_range_position_shape_transition_matrix.py
              tests/test_revenue_unreacted_range_rearmed_operation_grid.py
              tests/test_revenue_unreacted_range_source_snapshot_projection.py
              tests/test_validate_revenue_unreacted_range_low_mid_falling_candidate_audit.py
              tests/test_validate_revenue_unreacted_range_promotion_preparation.py
            )
            mapfile -t REVENUE_SUPERSEDE_ACTUAL_CODE_PATHS < <(git --no-replace-objects diff --name-only --no-renames "$REVENUE_SUPERSEDE_CODE_ROOT_SHA" "$REVENUE_SUPERSEDE_EXPECTED_HEAD_SHA")
            if [[ "$(printf '%s\n' "${REVENUE_SUPERSEDE_ACTUAL_CODE_PATHS[@]}")" != "$(printf '%s\n' "${REVENUE_SUPERSEDE_CODE_PATHS[@]}")" ]]; then
              echo "::error::Revenue source snapshot projection supersede cumulative code changed-path exact44 allowlist mismatch."
              exit 1
            fi
            mapfile -t REVENUE_SUPERSEDE_ACTUAL_CODE_STATUSES < <(git --no-replace-objects diff --name-status --no-renames "$REVENUE_SUPERSEDE_CODE_ROOT_SHA" "$REVENUE_SUPERSEDE_EXPECTED_HEAD_SHA")
            if [[ "${#REVENUE_SUPERSEDE_ACTUAL_CODE_STATUSES[@]}" -ne "${#REVENUE_SUPERSEDE_CODE_PATHS[@]}" ]]; then
              echo "::error::Revenue source snapshot projection supersede code commit status count mismatch."
              exit 1
            fi
            for index in "${!REVENUE_SUPERSEDE_CODE_PATHS[@]}"; do
              if [[ "${REVENUE_SUPERSEDE_ACTUAL_CODE_STATUSES[$index]}" != $'M\t'"${REVENUE_SUPERSEDE_CODE_PATHS[$index]}" ]]; then
                echo "::error::Revenue source snapshot projection supersede code commit requires exact modified-only status: ${REVENUE_SUPERSEDE_CODE_PATHS[$index]}."
                exit 1
              fi
            done
            if [[ -n "$(git --no-replace-objects status --porcelain=v1 --untracked-files=all)" ]]; then
              echo "::error::Revenue source snapshot projection supersede must start from a clean code head."
              exit 1
            fi
          fi
          python scripts/validate_apps_script_workflow_triggers.py
          python scripts/validate_repo_production_inventory.py
          python scripts/validate_daily_model_background_data_registry.py --structure-only
          python scripts/validate_research_production_boundaries.py
          python scripts/validate_model_research_artifact_ownership.py
          python scripts/validate_model_research_shared_utilities.py
          python scripts/validate_formal_model_evidence_pins.py
          python scripts/validate_model_research_workflow_isolation.py

      - name: Validate existing registered artifacts before non-model research
        if: ${{ env.MODEL_RESEARCH_SELECTED != 'true' }}
        run: |
          python scripts/validate_daily_model_background_data_registry.py

      - name: Install dependencies
        if: ${{ env.ANY_RESEARCH_SELECTED == 'true' }}
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests tabulate matplotlib pillow openpyxl lxml html5lib beautifulsoup4 reportlab pypdf

      - name: Validate canonical TDCC research consumer contract
        if: ${{ env.TDCC_RESEARCH_SELECTED == 'true' }}
        run: |
          python scripts/validate_tdcc_dataset_manifest.py
          python scripts/validate_research_tdcc_dataset_consumers.py

      - name: Build market timing technical backtest
        if: ${{ github.event.inputs.run_market_timing == 'true' }}
        run: |
          python scripts/update_market_index_history.py
          python scripts/build_market_timing_technical_backtest.py

      - name: Build TDCC overheated short-term edge
        if: ${{ github.event.inputs.run_tdcc_short_term_edge == 'true' }}
        run: |
          python scripts/build_tdcc_signal_structures.py --full-history --price-metrics-limit 0
          python scripts/update_tdcc_normalized_signal_performance.py
          python scripts/build_tdcc_overheated_short_term_edge.py
