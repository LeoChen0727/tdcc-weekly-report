name: Repair TDCC Monthly History Gaps

on:
  workflow_dispatch:
    inputs:
      as_of_date:
        description: "YYYYMMDD boundary date; blank uses Asia/Taipei today"
        required: false
        default: ""
      universe:
        description: "TDCC stock universe: chatgpt-top, candidates, signals, all-known"
        required: false
        default: "chatgpt-top"
      max_stocks:
        description: "Maximum stocks to check and repair"
        required: false
        default: "80"
      max_requests:
        description: "Maximum TDCC HTTP requests for this repair run"
        required: false
        default: "500"
      rebuild_max_dates:
        description: "Latest TDCC weekly snapshots to rebuild after repair"
        required: false
        default: "4"

permissions:
  contents: write

jobs:
  repair-tdcc-monthly-history-gaps:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Validate workflow automation boundaries
        run: |
          python scripts/validate_apps_script_workflow_triggers.py
          python scripts/validate_repo_production_inventory.py
          python scripts/validate_repo_file_lifecycle_inventory.py
          python scripts/validate_repo_semantic_integrity.py

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests lxml html5lib tabulate matplotlib

      - name: Repair TDCC current-month history gaps
        run: |
          args=(
            --universe "${{ github.event.inputs.universe }}"
            --max-stocks "${{ github.event.inputs.max_stocks }}"
            --max-requests "${{ github.event.inputs.max_requests }}"
            --sleep 0.15
          )
          if [ -n "${{ github.event.inputs.as_of_date }}" ]; then
            args+=(--as-of-date "${{ github.event.inputs.as_of_date }}")
          fi
          python scripts/repair_tdcc_monthly_history_gaps.py "${args[@]}"

      - name: Summarize TDCC monthly repair result
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("output/latest/tdcc_monthly_history_gap_repair_latest.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          action_count = int(data.get("repair_action_count", 0))
          repaired_count = int(data.get("repaired_count", 0))
          failed_count = int(data.get("failed_count", 0))
          print(f"TDCC_REPAIR_ACTION_COUNT={action_count}")
          print(f"TDCC_REPAIRED_COUNT={repaired_count}")
          print(f"TDCC_FAILED_COUNT={failed_count}")
          with open(Path.cwd() / "github_env.tmp", "w", encoding="utf-8") as fh:
              fh.write(f"TDCC_REPAIR_ACTION_COUNT={action_count}\n")
              fh.write(f"TDCC_REPAIRED_COUNT={repaired_count}\n")
              fh.write(f"TDCC_FAILED_COUNT={failed_count}\n")
          PY
          cat github_env.tmp >> "$GITHUB_ENV"

      - name: Rebuild TDCC derived outputs after repair
        if: env.TDCC_REPAIRED_COUNT != '0'
        run: |
          python scripts/build_tdcc_stock_history.py
          python scripts/build_tdcc_signal_structures.py --max-dates "${{ github.event.inputs.rebuild_max_dates }}"
          python scripts/build_tdcc_pre_move_accumulation.py
          python scripts/update_tdcc_normalized_signal_performance.py
          python scripts/build_tdcc_signal_effectiveness_report.py
          python scripts/build_tdcc_chatgpt_tracking_outputs.py
          python scripts/validate_tdcc_chatgpt_tracking_outputs.py

      - name: Upload TDCC monthly repair evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tdcc-monthly-history-gap-repair
          path: |
            output/latest/tdcc_monthly_history_gap_repair_latest.json
            output/latest/tdcc_monthly_history_gap_repair_latest.md
            output/latest/tdcc_history_backfill_manifest_latest.csv
            output/latest/tdcc_history_backfill_manifest_latest.md
          if-no-files-found: ignore

      - name: Commit repaired TDCC history gaps
        if: env.TDCC_REPAIRED_COUNT != '0'
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add data/tdcc_stock_history/ data/tdcc_stock_history_raw/ || true
          git add output/latest/tdcc_monthly_history_gap_repair_latest.* || true
          git add output/latest/tdcc_* output/history/tdcc_signals/ output/history/tdcc/ || true
          git status --short
          git commit -m "Repair TDCC monthly history gaps" || echo "No changes to commit"
          git push
