      - "config/daily_pdf_shared_path_inventory.csv"
      - "config/repo_hidden_coupling_audit.csv"
      - "config/model_surface_registry.csv"
      - "config/report_artifact_lineage.csv"
      - "config/runtime_file_lineage_contract.csv"
      - "config/stock_model_contract_registry.csv"
      - "AGENTS.md"
      - "rules/master_priority_rules.md"
      - "docs/rules/master_priority_rules.md"
      - "docs/latest/model_data_independence_audit_latest.*"
      - "docs/latest/financial_statement_pit_coverage_latest.*"
      - "docs/latest/financial_statement_historical_pit_source_audit_latest.*"
      - "docs/latest/volume_v2_warrant_lineage_history_audit_latest.*"
      - "output/latest/model_data_independence_audit_latest.*"
      - "output/latest/research_backtest/financial_statement_pit_coverage_latest.*"
      - "output/latest/research_backtest/financial_statement_historical_pit_source_audit_latest.*"
      - "output/latest/volume_v2_warrant_lineage_history_audit_latest.*"
      - "docs/specs/*operation*.md"
      - "docs/specs/daily_mature_model_row_level_metric_contract.md"
      - "docs/repo_hidden_coupling_audit.md"
      - "docs/rules/git_worktree_materialization_safety.md"
      - "scripts/build_daily_*model*.py"
      - "scripts/build_daily_*operation*.py"
      - "scripts/build_daily_published_snapshot_ranking_backtest.py"
      - "scripts/daily_snapshot_revision_utils.py"
      - "scripts/stage_daily_published_snapshot_revisions.py"
      - "scripts/backfill_historical_all_candidates_snapshots_from_git_history.py"
      - "scripts/build_monthly_revenue_coverage_backfill_audit.py"
      - "scripts/build_monthly_revenue_point_in_time_panel.py"
      - "scripts/build_daily_report_model_summary.py"
      - "scripts/build_model_operation_readiness.py"
      - "scripts/build_model_data_independence_audit.py"
      - "scripts/build_financial_statement_pit.py"
      - "scripts/build_financial_statement_historical_pit_source_audit.py"
      - "scripts/build_volume_breakout_watch.py"
      - "scripts/build_volume_attack_theme_layer.py"
      - "scripts/build_volume_v2_warrant_lineage_history_audit.py"
      - "scripts/model_data_independence.py"
      - "scripts/build_*_research.py"
      - "scripts/price_pullback_23ema_*.py"
      - "scripts/revenue_unreacted_range_*.py"
      - "scripts/validate_revenue_unreacted_range_*.py"
      - "scripts/volume_range_breakout_v2_*.py"
      - "scripts/build_mature_model_row_level_metric_contract_audit.py"
      - "scripts/generate_chatgpt_side_daily_reports.py"
      - "scripts/git_worktree_safety.py"
      - "scripts/resolve_daily_report_source_state.py"
      - "scripts/run_chatgpt_daily_report_entrypoint.py"
      - "scripts/stage_daily_latest_mirrors.py"
      - "scripts/validate_chatgpt_side_pdf_contract.py"
      - "scripts/update_daily_published_model_snapshots.py"
      - "scripts/validate_chatgpt_daily_report_new_conversation_replay.py"
      - "scripts/validate_daily_*.py"
      - "scripts/validate_model_operation_readiness.py"
      - "scripts/validate_model_data_independence.py"
      - "scripts/validate_financial_statement_pit.py"
      - "scripts/validate_financial_statement_historical_pit_source_audit.py"
      - "scripts/validate_volume_breakout_watch.py"
      - "scripts/validate_volume_attack_theme_layer.py"
      - "scripts/validate_volume_v2_warrant_lineage_history_audit.py"
      - "scripts/validate_model_surface_registry.py"
      - "scripts/validate_model_research_*.py"
      - "scripts/validate_mature_model_row_level_metric_contract_audit.py"
      - "scripts/validate_daily_legacy_volume_range_breakout_removed.py"
      - "scripts/validate_research_against_stock_model_contract.py"
      - "scripts/validate_repo_hidden_coupling_audit.py"
      - "scripts/validate_git_worktree_safety.py"
      - "scripts/validate_repo_code_isolation_policy.py"
      - "scripts/validate_repo_advanced_integrity.py"
      - "scripts/validate_stock_model_contract_registry.py"
      - "scripts/validate_warrant_source_status.py"
      - "tests/test_chatgpt_daily_report_new_conversation_replay.py"
      - "tests/test_chatgpt_daily_report_entrypoint.py"
      - "tests/test_chatgpt_side_pdf_contract.py"
      - "tests/test_catalyst_pages_sync.py"
      - "tests/test_daily_*.py"
      - "tests/test_daily_snapshot_revision_utils.py"
      - "tests/test_stage_daily_published_snapshot_revisions.py"
      - "tests/test_backfill_historical_all_candidates_snapshots.py"
      - "tests/test_warrant_source_status.py"
      - "tests/test_repo_hidden_coupling_audit.py"
      - "tests/test_git_worktree_safety.py"
      - "tests/test_model_operation_readiness.py"
      - "tests/test_model_data_independence.py"
      - "tests/test_financial_statement_pit.py"
      - "tests/test_financial_statement_historical_pit_source_audit.py"
      - "tests/test_volume_breakout_watch.py"
      - "tests/test_daily_canonical_field_lineage.py"
      - "tests/test_daily_model_maintenance_pr_validation_workflow.py"
      - "tests/test_volume_v2_warrant_lineage_history_audit.py"
      - "tests/test_model_surface_registry.py"
      - "tests/test_repo_code_isolation_policy.py"
      - "tests/test_model_research_*.py"
      - "tests/test_price_pullback_23ema_*.py"
      - "tests/test_price_pullback_daily_row_parity.py"
      - "tests/test_monthly_revenue_point_in_time_panel.py"
      - "tests/test_repo_advanced_integrity.py"
      - "tests/test_revenue_unreacted_range_*.py"
      - "tests/test_volume_range_breakout_v2_*.py"
      - "tests/test_mature_model_row_level_metric_contract_audit.py"
      - "tests/test_stock_model_contract_registry.py"
  workflow_dispatch:
    inputs:
      refresh_model_data_independence_audit:
        description: "Temporarily refresh only the four model/data independence governance audit mirrors"
        required: false
        default: false
        type: boolean
      expected_head_sha:
        description: "Exact 40-character branch head SHA authorized for the temporary refresh"
        required: true
        type: string
      expected_base_sha:
        description: "Exact 40-character main SHA authorized as the refresh and restoration base"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: daily-model-maintenance-pr-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  daily-model-maintenance-pr-validation:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.refresh_model_data_independence_audit != true }}
    runs-on: ubuntu-latest
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha || 'origin/main' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Ensure append-only validation base is available
        shell: bash
        run: |
          if [ "$BASE_SHA" = "origin/main" ]; then
            git fetch --no-tags origin main:refs/remotes/origin/main
          fi
          git cat-file -e "${BASE_SHA}^{commit}"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests tabulate matplotlib pillow openpyxl lxml html5lib beautifulsoup4 reportlab pypdf pytest fonttools pyyaml

      - name: Validate production lineage parity ordering contract
        run: |
          python -m pytest -q tests/test_daily_model_maintenance_pr_validation_workflow.py \
            -k production_snapshot_updates_are_followed_by_dynamic_lineage_parity

      - name: Validate daily model and PDF contracts
        run: |
          python scripts/validate_repo_file_lifecycle_inventory.py
          python scripts/validate_repo_production_inventory.py
          python scripts/validate_stock_model_contract_registry.py
          python scripts/validate_daily_pdf_contract_consumers.py
          python scripts/validate_daily_pdf_role_manifest_contract.py
          python scripts/validate_daily_pdf_shared_path_isolation.py
          python scripts/validate_daily_pdf_completion_hard_gate.py
          python scripts/validate_daily_legacy_volume_range_breakout_removed.py
          python scripts/validate_daily_legacy_mature_model_paths_removed.py
          python scripts/validate_daily_production_boundaries.py
          python scripts/validate_daily_published_model_snapshots.py
          python scripts/validate_daily_model_background_data_registry.py
          python scripts/validate_model_data_independence.py --base-ref "$BASE_SHA"
          python scripts/validate_model_research_shared_utilities.py --base-ref "$BASE_SHA"
          python scripts/validate_volume_breakout_watch.py --latest-only
          python scripts/validate_volume_attack_theme_layer.py
          python scripts/validate_daily_canonical_field_lineage.py --base-ref "$BASE_SHA"
          python scripts/build_volume_v2_warrant_lineage_history_audit.py
          python scripts/validate_volume_v2_warrant_lineage_history_audit.py
          git diff --exit-code -- \
            docs/latest/volume_v2_warrant_lineage_history_audit_latest.csv \
            docs/latest/volume_v2_warrant_lineage_history_audit_latest.md \
            output/latest/volume_v2_warrant_lineage_history_audit_latest.csv \
            output/latest/volume_v2_warrant_lineage_history_audit_latest.md
          python scripts/validate_financial_statement_pit.py
          python scripts/build_financial_statement_historical_pit_source_audit.py
          python scripts/validate_financial_statement_historical_pit_source_audit.py
          git diff --exit-code -- \
            docs/latest/financial_statement_historical_pit_source_audit_latest.csv \
            docs/latest/financial_statement_historical_pit_source_audit_latest.md \
            output/latest/research_backtest/financial_statement_historical_pit_source_audit_latest.csv \
            output/latest/research_backtest/financial_statement_historical_pit_source_audit_latest.md
          python scripts/validate_revenue_unreacted_range_source_first_condition_audit.py
          python scripts/validate_revenue_unreacted_range_forward_confirmation_feature_audit.py
          python scripts/validate_revenue_unreacted_range_rearmed_operation_grid.py
          python scripts/validate_revenue_unreacted_range_operation_lag_bucket_audit.py
          python scripts/validate_revenue_unreacted_range_position_shape_transition_matrix.py
          python scripts/validate_revenue_unreacted_range_financial_statement_fail_closed.py
          python scripts/build_mature_model_row_level_metric_contract_audit.py
          python scripts/validate_mature_model_row_level_metric_contract_audit.py
          python scripts/validate_research_against_stock_model_contract.py
          python scripts/validate_daily_model_research_parity.py
          python scripts/validate_repo_hidden_coupling_audit.py
          python scripts/validate_git_worktree_safety.py
          python scripts/validate_chatgpt_side_pdf_contract.py
          python scripts/validate_repo_code_isolation_policy.py
          python scripts/validate_model_research_workflow_isolation.py
          python scripts/validate_chatgpt_side_pdf_layout_independence.py

      - name: Run focused regression tests
        run: |
          python -m pytest \
            tests/test_chatgpt_daily_report_new_conversation_replay.py \
            tests/test_chatgpt_daily_report_entrypoint.py \
            tests/test_daily_report_source_resolver.py \
            tests/test_chatgpt_side_pdf_contract.py \
            tests/test_catalyst_pages_sync.py \
            tests/test_daily_event_catalyst_formal_sync_scope.py \
            tests/test_daily_warrant_formal_sync_scope.py \
            tests/test_warrant_source_status.py \
            tests/test_daily_candidate_model_layer.py \
            tests/test_volume_breakout_watch.py \
            tests/test_daily_canonical_field_lineage.py \
            tests/test_daily_model_maintenance_pr_validation_workflow.py \
            tests/test_volume_v2_warrant_lineage_history_audit.py \
            tests/test_daily_pdf_contract_consumers.py \
            tests/test_daily_pdf_completion_hard_gate.py \
            tests/test_daily_pdf_shared_path_isolation.py \
            tests/test_daily_published_model_snapshots.py \
            tests/test_backfill_historical_all_candidates_snapshots.py \
            tests/test_daily_published_snapshot_ranking_backtest.py \
            tests/test_daily_snapshot_revision_utils.py \
            tests/test_stage_daily_published_snapshot_revisions.py \
            tests/test_daily_legacy_mature_model_paths_removed.py \
            tests/test_daily_operation_adapter_protected_fields.py \
            tests/test_daily_volume_breakout_operation_section.py \
            tests/test_daily_w_bottom_operation_sections.py \
            tests/test_daily_price_pullback_23ema_operation_section.py \
            tests/test_price_pullback_daily_row_parity.py \
            tests/test_monthly_revenue_point_in_time_panel.py \
            tests/test_repo_advanced_integrity.py \
            tests/test_mature_model_row_level_metric_contract_audit.py \
            tests/test_daily_report_model_summary.py \
            tests/test_daily_production_boundaries.py \
            tests/test_model_data_independence.py \
            tests/test_financial_statement_pit.py \
            tests/test_financial_statement_historical_pit_source_audit.py \
            tests/test_revenue_unreacted_range_source_first_condition_audit.py \
            tests/test_revenue_unreacted_range_forward_confirmation_feature_audit.py \
            tests/test_revenue_unreacted_range_rearmed_operation_grid.py \
            tests/test_revenue_unreacted_range_operation_lag_bucket_audit.py \
            tests/test_revenue_unreacted_range_position_shape_transition_matrix.py \
            tests/test_revenue_unreacted_range_financial_statement_fail_closed.py \
            tests/test_repo_hidden_coupling_audit.py \
            tests/test_git_worktree_safety.py \
            tests/test_model_research_workflow_isolation.py \
            tests/test_stock_model_contract_registry.py

  build-model-data-independence-audit:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.refresh_model_data_independence_audit == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      output_csv_sha256: ${{ steps.hashes.outputs.output_csv_sha256 }}
      output_md_sha256: ${{ steps.hashes.outputs.output_md_sha256 }}
      docs_csv_sha256: ${{ steps.hashes.outputs.docs_csv_sha256 }}
      docs_md_sha256: ${{ steps.hashes.outputs.docs_md_sha256 }}
    env:
      EXPECTED_BRANCH: codex/volume-watch-asof-lineage-main-sync
      EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
      EXPECTED_BASE_SHA: ${{ inputs.expected_base_sha }}
      WORKFLOW_PATH: .github/workflows/daily_model_maintenance_pr_validation.yml

    steps:
      - name: Checkout exact authorized branch
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.expected_head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact branch, head, base, and transient commit
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != "refs/heads/$EXPECTED_BRANCH" ]; then
            echo "::error::Refresh is restricted to refs/heads/$EXPECTED_BRANCH; actual=$GITHUB_REF"
            exit 1
          fi
          if [[ ! "$EXPECTED_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || [[ ! "$EXPECTED_BASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::expected_head_sha and expected_base_sha must be exact lowercase 40-character SHAs"
            exit 1
          fi
          checkout_sha="$(git rev-parse HEAD)"
          if [ "$GITHUB_SHA" != "$EXPECTED_HEAD_SHA" ]; then
            echo "::error::workflow_dispatch github.sha is not the authorized branch head"
            exit 1
          fi
          remote_head_sha="$(git ls-remote origin "refs/heads/$EXPECTED_BRANCH" | awk '{print $1}')"
          remote_main_sha="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          if [ "$checkout_sha" != "$EXPECTED_HEAD_SHA" ] || [ "$remote_head_sha" != "$EXPECTED_HEAD_SHA" ]; then
            echo "::error::Authorized branch head mismatch"
            echo "expected=$EXPECTED_HEAD_SHA checkout=$checkout_sha remote=$remote_head_sha"
            exit 1
          fi
          if [ "$remote_main_sha" != "$EXPECTED_BASE_SHA" ]; then
            echo "::error::Authorized main base mismatch"
            echo "expected=$EXPECTED_BASE_SHA remote=$remote_main_sha"
            exit 1
          fi
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Checkout must be clean before governance audit refresh"
            git status --short
            exit 1
          fi
          git cat-file -e "${EXPECTED_BASE_SHA}^{commit}"
          parent_count="$(git rev-list --parents -n 1 HEAD | awk '{print NF - 1}')"
          if [ "$parent_count" != "1" ]; then
            echo "::error::The transient authorization commit must have exactly one parent"
            exit 1
          fi
          parent_sha="$(git rev-parse HEAD^)"
          mapfile -t transient_commit_paths < <(git diff-tree --no-commit-id --name-only -r HEAD | sort)
          if [ "${transient_commit_paths[*]}" != "$WORKFLOW_PATH" ]; then
            echo "::error::The transient authorization commit must change only $WORKFLOW_PATH"
            exit 1
          fi
          if ! git diff --quiet "$EXPECTED_BASE_SHA" "$parent_sha" -- "$WORKFLOW_PATH"; then
            echo "::error::The pre-authorization branch did not match the authorized main workflow"
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Build and validate only the four governance audit mirrors
        shell: bash
        run: |
          set -euo pipefail
          artifact_paths=(
            "output/latest/model_data_independence_audit_latest.csv"
            "output/latest/model_data_independence_audit_latest.md"
            "docs/latest/model_data_independence_audit_latest.csv"
            "docs/latest/model_data_independence_audit_latest.md"
          )
          python scripts/build_model_data_independence_audit.py
          python scripts/validate_model_data_independence.py --base-ref "$EXPECTED_BASE_SHA"
          cmp "${artifact_paths[0]}" "${artifact_paths[2]}"
          cmp "${artifact_paths[1]}" "${artifact_paths[3]}"
          mapfile -t actual_paths < <(git status --porcelain=v1 | sed -E 's/^...//' | sort)
          mapfile -t expected_paths < <(printf '%s\n' "${artifact_paths[@]}" | sort)
          if [ "${actual_paths[*]}" != "${expected_paths[*]}" ]; then
            echo "::error::Builder changed paths outside the exact four-artifact allowlist"
            printf 'expected=%s\n' "${expected_paths[*]}"
            printf 'actual=%s\n' "${actual_paths[*]}"
            exit 1
          fi

      - name: Record exact audit hashes
        id: hashes
        shell: bash
        run: |
          set -euo pipefail
          echo "output_csv_sha256=$(sha256sum output/latest/model_data_independence_audit_latest.csv | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "output_md_sha256=$(sha256sum output/latest/model_data_independence_audit_latest.md | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "docs_csv_sha256=$(sha256sum docs/latest/model_data_independence_audit_latest.csv | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "docs_md_sha256=$(sha256sum docs/latest/model_data_independence_audit_latest.md | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Stage exact read-only transfer payload
        shell: bash
        run: |
          set -euo pipefail
          artifact_paths=(
            "output/latest/model_data_independence_audit_latest.csv"
            "output/latest/model_data_independence_audit_latest.md"
            "docs/latest/model_data_independence_audit_latest.csv"
            "docs/latest/model_data_independence_audit_latest.md"
          )
          payload_dir="$RUNNER_TEMP/model-data-independence-audit"
          mkdir -p "$payload_dir"
          cp --parents "${artifact_paths[@]}" "$payload_dir"
          mapfile -t payload_paths < <(cd "$payload_dir" && find . -type f -printf '%P\n' | sort)
          mapfile -t expected_paths < <(printf '%s\n' "${artifact_paths[@]}" | sort)
          if [ "${payload_paths[*]}" != "${expected_paths[*]}" ]; then
            echo "::error::Transfer payload does not contain exactly the four authorized paths"
            exit 1
          fi

      - name: Upload exact governance audit mirrors
        uses: actions/upload-artifact@v4
        with:
          name: model-data-independence-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/model-data-independence-audit
          if-no-files-found: error
          retention-days: 1

  commit-model-data-independence-audit:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.refresh_model_data_independence_audit == true }}
    needs: build-model-data-independence-audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      EXPECTED_BRANCH: codex/volume-watch-asof-lineage-main-sync
      EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
      EXPECTED_BASE_SHA: ${{ inputs.expected_base_sha }}
      WORKFLOW_PATH: .github/workflows/daily_model_maintenance_pr_validation.yml
      OUTPUT_CSV_SHA256: ${{ needs.build-model-data-independence-audit.outputs.output_csv_sha256 }}
      OUTPUT_MD_SHA256: ${{ needs.build-model-data-independence-audit.outputs.output_md_sha256 }}
      DOCS_CSV_SHA256: ${{ needs.build-model-data-independence-audit.outputs.docs_csv_sha256 }}
      DOCS_MD_SHA256: ${{ needs.build-model-data-independence-audit.outputs.docs_md_sha256 }}

    steps:
      - name: Checkout exact authorized head for write-only commit
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.expected_head_sha }}
          fetch-depth: 0

      - name: Revalidate immutable refs without executing repository code
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != "refs/heads/$EXPECTED_BRANCH" ] || [ "$GITHUB_SHA" != "$EXPECTED_HEAD_SHA" ]; then
            echo "::error::Write job is not bound to the authorized branch and dispatch SHA"
            exit 1
          fi
          checkout_sha="$(git rev-parse HEAD)"
          remote_head_sha="$(git ls-remote origin "refs/heads/$EXPECTED_BRANCH" | awk '{print $1}')"
          remote_main_sha="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          if [ "$checkout_sha" != "$EXPECTED_HEAD_SHA" ] || [ "$remote_head_sha" != "$EXPECTED_HEAD_SHA" ]; then
            echo "::error::Authorized branch head changed before write-only commit"
            exit 1
          fi
          if [ "$remote_main_sha" != "$EXPECTED_BASE_SHA" ]; then
            echo "::error::Authorized main base changed before write-only commit"
            exit 1
          fi
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Write checkout must start clean"
            exit 1
          fi

      - name: Download exact governance audit mirrors
        uses: actions/download-artifact@v4
        with:
          name: model-data-independence-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/model-data-independence-audit

      - name: Verify downloaded paths and hashes
        env:
          AUDIT_DOWNLOAD_DIR: ${{ runner.temp }}/model-data-independence-audit
        shell: bash
        run: |
          set -euo pipefail
          artifact_paths=(
            "output/latest/model_data_independence_audit_latest.csv"
            "output/latest/model_data_independence_audit_latest.md"
            "docs/latest/model_data_independence_audit_latest.csv"
            "docs/latest/model_data_independence_audit_latest.md"
          )
          mapfile -t downloaded_paths < <(cd "$AUDIT_DOWNLOAD_DIR" && find . -type f -printf '%P\n' | sort)
          mapfile -t expected_paths < <(printf '%s\n' "${artifact_paths[@]}" | sort)
          if [ "${downloaded_paths[*]}" != "${expected_paths[*]}" ]; then
            echo "::error::Downloaded artifact does not contain exactly the four authorized paths"
            printf 'expected=%s\n' "${expected_paths[*]}"
            printf 'actual=%s\n' "${downloaded_paths[*]}"
            exit 1
          fi
          actual_output_csv_sha="$(sha256sum "$AUDIT_DOWNLOAD_DIR/${artifact_paths[0]}" | awk '{print $1}')"
          actual_output_md_sha="$(sha256sum "$AUDIT_DOWNLOAD_DIR/${artifact_paths[1]}" | awk '{print $1}')"
          actual_docs_csv_sha="$(sha256sum "$AUDIT_DOWNLOAD_DIR/${artifact_paths[2]}" | awk '{print $1}')"
          actual_docs_md_sha="$(sha256sum "$AUDIT_DOWNLOAD_DIR/${artifact_paths[3]}" | awk '{print $1}')"
          if [ "$actual_output_csv_sha" != "$OUTPUT_CSV_SHA256" ] || [ "$actual_output_md_sha" != "$OUTPUT_MD_SHA256" ] || \
             [ "$actual_docs_csv_sha" != "$DOCS_CSV_SHA256" ] || [ "$actual_docs_md_sha" != "$DOCS_MD_SHA256" ]; then
            echo "::error::Downloaded audit hash mismatch"
            exit 1
          fi
          if [ "$actual_output_csv_sha" != "$actual_docs_csv_sha" ] || [ "$actual_output_md_sha" != "$actual_docs_md_sha" ]; then
            echo "::error::Downloaded docs mirrors do not match output mirrors"
            exit 1
          fi

      - name: Restore workflow and create exact governance artifact commit
        env:
          AUDIT_DOWNLOAD_DIR: ${{ runner.temp }}/model-data-independence-audit
        shell: bash
        run: |
          set -euo pipefail
          artifact_paths=(
            "output/latest/model_data_independence_audit_latest.csv"
            "output/latest/model_data_independence_audit_latest.md"
            "docs/latest/model_data_independence_audit_latest.csv"
            "docs/latest/model_data_independence_audit_latest.md"
          )
          existing_pr_paths=(
            "config/daily_model_semantic_migrations.csv"
            "config/daily_model_semantic_ownership.csv"
            "config/daily_model_shared_semantic_registry.csv"
            "config/repo_file_lifecycle_inventory.csv"
            "scripts/build_daily_candidate_model_layer.py"
            "scripts/build_volume_breakout_watch.py"
            "scripts/validate_volume_breakout_watch.py"
            "tests/test_daily_candidate_model_layer.py"
            "tests/test_model_data_independence.py"
            "tests/test_volume_breakout_watch.py"
          )
          for path in "${artifact_paths[@]}"; do
            cp "$AUDIT_DOWNLOAD_DIR/$path" "$path"
          done
          git restore --source="$EXPECTED_BASE_SHA" --staged --worktree -- "$WORKFLOW_PATH"
          git add -- "$WORKFLOW_PATH" "${artifact_paths[@]}"

          mapfile -t staged_paths < <(git diff --cached --name-only | sort)
          mapfile -t expected_staged_paths < <(printf '%s\n' "$WORKFLOW_PATH" "${artifact_paths[@]}" | sort)
          if [ "${staged_paths[*]}" != "${expected_staged_paths[*]}" ]; then
            echo "::error::Staged commit is not the workflow restoration plus exactly four audit artifacts"
            printf 'expected=%s\n' "${expected_staged_paths[*]}"
            printf 'actual=%s\n' "${staged_paths[*]}"
            exit 1
          fi
          if [ -n "$(git diff --name-only)" ] || [ -n "$(git ls-files --others --exclude-standard)" ]; then
            echo "::error::Unstaged or untracked paths remain after exact staging"
            git status --short
            exit 1
          fi

          merge_base_sha="$(git merge-base HEAD "$EXPECTED_BASE_SHA")"
          mapfile -t actual_pr_paths < <(git diff --name-only "$merge_base_sha" | sort)
          mapfile -t expected_pr_paths < <(printf '%s\n' "${existing_pr_paths[@]}" "${artifact_paths[@]}" | sort)
          if [ "${actual_pr_paths[*]}" != "${expected_pr_paths[*]}" ]; then
            echo "::error::Final PR tree would differ from the exact 14-path allowlist"
            printf 'expected=%s\n' "${expected_pr_paths[*]}"
            printf 'actual=%s\n' "${actual_pr_paths[*]}"
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh model data independence audit"

      - name: Verify final tree and push without force
        id: push
        shell: bash
        run: |
          set -euo pipefail
          artifact_paths=(
            "output/latest/model_data_independence_audit_latest.csv"
            "output/latest/model_data_independence_audit_latest.md"
            "docs/latest/model_data_independence_audit_latest.csv"
            "docs/latest/model_data_independence_audit_latest.md"
          )
          existing_pr_paths=(
            "config/daily_model_semantic_migrations.csv"
            "config/daily_model_semantic_ownership.csv"
            "config/daily_model_shared_semantic_registry.csv"
            "config/repo_file_lifecycle_inventory.csv"
            "scripts/build_daily_candidate_model_layer.py"
            "scripts/build_volume_breakout_watch.py"
            "scripts/validate_volume_breakout_watch.py"
            "tests/test_daily_candidate_model_layer.py"
            "tests/test_model_data_independence.py"
            "tests/test_volume_breakout_watch.py"
          )
          if ! git diff --quiet "$EXPECTED_BASE_SHA" -- "$WORKFLOW_PATH"; then
            echo "::error::Final branch tree still differs from main workflow"
            exit 1
          fi
          merge_base_sha="$(git merge-base HEAD "$EXPECTED_BASE_SHA")"
          mapfile -t actual_pr_paths < <(git diff --name-only "$merge_base_sha" HEAD | sort)
          mapfile -t expected_pr_paths < <(printf '%s\n' "${existing_pr_paths[@]}" "${artifact_paths[@]}" | sort)
          if [ "${actual_pr_paths[*]}" != "${expected_pr_paths[*]}" ]; then
            echo "::error::Committed PR tree differs from the exact 14-path allowlist"
            exit 1
          fi
          current_main_sha="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          remote_head_sha="$(git ls-remote origin "refs/heads/$EXPECTED_BRANCH" | awk '{print $1}')"
          if [ "$current_main_sha" != "$EXPECTED_BASE_SHA" ]; then
            echo "::error::origin/main advanced during artifact build; refusing stale restoration"
            exit 1
          fi
          if [ "$remote_head_sha" != "$EXPECTED_HEAD_SHA" ]; then
            echo "::error::Remote branch advanced during artifact build; refusing overwrite"
            exit 1
          fi
          final_sha="$(git rev-parse HEAD)"
          git push origin "HEAD:refs/heads/$EXPECTED_BRANCH"
          pushed_sha="$(git ls-remote origin "refs/heads/$EXPECTED_BRANCH" | awk '{print $1}')"
          post_push_main_sha="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          if [ "$pushed_sha" != "$final_sha" ]; then
            echo "::error::Remote branch does not match final governance artifact commit"
            exit 1
          fi
          if [ "$post_push_main_sha" != "$EXPECTED_BASE_SHA" ]; then
            echo "::error::origin/main advanced across the final branch push; refresh requires revalidation"
            exit 1
          fi
          echo "final_sha=$final_sha" >> "$GITHUB_OUTPUT"
          echo "FINAL_ARTIFACT_COMMIT_SHA=$final_sha"

  restore-workflow-on-refresh-failure:
    if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.refresh_model_data_independence_audit == true }}
    needs:
      - build-model-data-independence-audit
      - commit-model-data-independence-audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      EXPECTED_BRANCH: codex/volume-watch-asof-lineage-main-sync
      EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
      WORKFLOW_PATH: .github/workflows/daily_model_maintenance_pr_validation.yml

    steps:
      - name: Checkout authorized transient head for fail-safe restoration
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.expected_head_sha }}
          fetch-depth: 0

      - name: Restore main workflow only when transient head is still remote
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != "refs/heads/$EXPECTED_BRANCH" ] || [ "$GITHUB_SHA" != "$EXPECTED_HEAD_SHA" ]; then
            echo "::error::Cleanup is not bound to the authorized branch and dispatch SHA"
            exit 1
          fi
          checkout_sha="$(git rev-parse HEAD)"
          remote_head_sha="$(git ls-remote origin "refs/heads/$EXPECTED_BRANCH" | awk '{print $1}')"
          if [ "$checkout_sha" != "$EXPECTED_HEAD_SHA" ]; then
            echo "::error::Cleanup checkout is not the authorized transient head"
            exit 1
          fi
          if [ "$remote_head_sha" != "$EXPECTED_HEAD_SHA" ]; then
            echo "Remote branch already moved away from the transient head; cleanup will not mutate it."
            exit 0
          fi
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Cleanup checkout must start clean"
            exit 1
          fi
          git fetch --no-tags origin main:refs/remotes/origin/main
          restore_base_sha="$(git rev-parse origin/main)"
          git restore --source="$restore_base_sha" --staged --worktree -- "$WORKFLOW_PATH"
          git add -- "$WORKFLOW_PATH"
          mapfile -t staged_paths < <(git diff --cached --name-only | sort)
          if [ "${staged_paths[*]}" != "$WORKFLOW_PATH" ]; then
            echo "::error::Fail-safe cleanup may stage only $WORKFLOW_PATH"
            exit 1
          fi
          if [ -n "$(git diff --name-only)" ] || [ -n "$(git ls-files --others --exclude-standard)" ]; then
            echo "::error::Unexpected cleanup worktree changes"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Restore daily model validation workflow after refresh failure"
          pre_push_remote_head="$(git ls-remote origin "refs/heads/$EXPECTED_BRANCH" | awk '{print $1}')"
          if [ "$pre_push_remote_head" != "$EXPECTED_HEAD_SHA" ]; then
            echo "::error::Remote branch advanced before fail-safe restoration push"
            exit 1
          fi
          restored_sha="$(git rev-parse HEAD)"
          git push origin "HEAD:refs/heads/$EXPECTED_BRANCH"
          pushed_sha="$(git ls-remote origin "refs/heads/$EXPECTED_BRANCH" | awk '{print $1}')"
          if [ "$pushed_sha" != "$restored_sha" ]; then
            echo "::error::Fail-safe workflow restoration did not reach the remote branch"
            exit 1
          fi
          echo "RESTORED_WORKFLOW_COMMIT_SHA=$restored_sha"
