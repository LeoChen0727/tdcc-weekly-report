name: Daily Model Maintenance PR Validation

on:
  pull_request:
    paths:
      - ".github/workflows/daily_full_pipeline.yml"
      - ".github/workflows/daily_model_maintenance_pr_validation.yml"
      - "config/daily_model_*.csv"
      - "config/daily_pdf_rendered_model_regression_contract.csv"
      - "config/daily_pdf_semantic_golden_cases.csv"
      - "config/daily_pdf_shared_path_inventory.csv"
      - "config/repo_hidden_coupling_audit.csv"
      - "config/model_surface_registry.csv"
      - "config/report_artifact_lineage.csv"
      - "config/stock_model_contract_registry.csv"
      - "docs/specs/*operation*.md"
      - "docs/repo_hidden_coupling_audit.md"
      - "scripts/build_daily_*model*.py"
      - "scripts/build_daily_*operation*.py"
      - "scripts/build_daily_report_model_summary.py"
      - "scripts/build_model_operation_readiness.py"
      - "scripts/generate_chatgpt_side_daily_reports.py"
      - "scripts/run_chatgpt_daily_report_entrypoint.py"
      - "scripts/update_daily_published_model_snapshots.py"
      - "scripts/validate_chatgpt_daily_report_new_conversation_replay.py"
      - "scripts/validate_daily_*.py"
      - "scripts/validate_model_operation_readiness.py"
      - "scripts/validate_daily_legacy_volume_range_breakout_removed.py"
      - "scripts/validate_research_against_stock_model_contract.py"
      - "scripts/validate_repo_hidden_coupling_audit.py"
      - "scripts/validate_stock_model_contract_registry.py"
      - "tests/test_chatgpt_daily_report_new_conversation_replay.py"
      - "tests/test_chatgpt_daily_report_entrypoint.py"
      - "tests/test_daily_*.py"
      - "tests/test_repo_hidden_coupling_audit.py"
      - "tests/test_model_operation_readiness.py"
      - "tests/test_stock_model_contract_registry.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-model-maintenance-pr-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  daily-model-maintenance-pr-validation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests tabulate matplotlib pillow openpyxl lxml html5lib beautifulsoup4 reportlab pypdf pytest

      - name: Validate daily model and PDF contracts
        run: |
          python scripts/validate_repo_production_inventory.py
          python scripts/validate_stock_model_contract_registry.py
          python scripts/validate_daily_pdf_contract_consumers.py
          python scripts/validate_daily_pdf_role_manifest_contract.py
          python scripts/validate_daily_pdf_shared_path_isolation.py
          python scripts/validate_daily_pdf_completion_hard_gate.py
          python scripts/validate_daily_legacy_volume_range_breakout_removed.py
          python scripts/validate_daily_production_boundaries.py
          python scripts/validate_daily_published_model_snapshots.py
          python scripts/build_mature_model_row_level_metric_contract_audit.py
          python scripts/validate_mature_model_row_level_metric_contract_audit.py
          python scripts/validate_research_against_stock_model_contract.py
          python scripts/validate_daily_model_research_parity.py
          python scripts/validate_repo_hidden_coupling_audit.py
          python scripts/validate_repo_code_isolation_policy.py
          python scripts/validate_chatgpt_side_pdf_layout_independence.py

      - name: Run focused regression tests
        run: |
          python -m pytest \
            tests/test_chatgpt_daily_report_new_conversation_replay.py \
            tests/test_chatgpt_daily_report_entrypoint.py \
            tests/test_daily_pdf_contract_consumers.py \
            tests/test_daily_pdf_completion_hard_gate.py \
            tests/test_daily_pdf_shared_path_isolation.py \
            tests/test_daily_published_model_snapshots.py \
            tests/test_daily_volume_breakout_operation_section.py \
            tests/test_daily_w_bottom_operation_sections.py \
            tests/test_daily_price_pullback_23ema_operation_section.py \
            tests/test_mature_model_row_level_metric_contract_audit.py \
            tests/test_daily_report_model_summary.py \
            tests/test_daily_production_boundaries.py \
            tests/test_repo_hidden_coupling_audit.py \
            tests/test_stock_model_contract_registry.py

      - name: Replay ChatGPT-side daily PDF new conversation
        timeout-minutes: 20
        run: |
          if [ -n "${GITHUB_HEAD_REF:-}" ]; then
            source_ref="origin/${GITHUB_HEAD_REF}"
          else
            source_ref="origin/${GITHUB_REF_NAME}"
          fi
          echo "PDF replay source_ref=$source_ref"
          echo "PDF replay output_dir=chatgpt_side_outputs_pr_validation"
          git fetch origin "${source_ref#origin/}"
          timeout 20m python scripts/validate_chatgpt_daily_report_new_conversation_replay.py \
            --source-ref "$source_ref" \
            --output-dir chatgpt_side_outputs_pr_validation
          python scripts/validate_daily_pdf_completion_hard_gate.py --require-output-dir chatgpt_side_outputs_pr_validation

      - name: Upload PR daily PDF replay evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-pdf-replay-pr-validation
          path: |
            chatgpt_side_outputs_pr_validation/*.pdf
            chatgpt_side_outputs_pr_validation/chatgpt_daily_report_runtime_manifest.json
            chatgpt_side_outputs_pr_validation/chatgpt_daily_pdf_semantic_manifest.csv
          if-no-files-found: error
