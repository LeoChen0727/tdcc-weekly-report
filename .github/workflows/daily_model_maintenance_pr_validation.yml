name: Daily Model Maintenance PR Validation

on:
  pull_request:
    paths:
      - ".github/workflows/daily_full_pipeline.yml"
      - ".github/workflows/daily_model_maintenance_pr_validation.yml"
      - ".github/workflows/research_backtest_pipeline.yml"
      - "config/formal_model_evidence_pins.csv"
      - "config/model_research_*.csv"
      - "config/daily_model_*.csv"
      - "config/daily_pdf_rendered_model_regression_contract.csv"
      - "config/daily_pdf_semantic_golden_cases.csv"
      - "config/daily_pdf_shared_path_inventory.csv"
      - "config/repo_hidden_coupling_audit.csv"
      - "config/model_surface_registry.csv"
      - "config/report_artifact_lineage.csv"
      - "config/runtime_file_lineage_contract.csv"
      - "config/stock_model_contract_registry.csv"
      - "AGENTS.md"
      - "rules/master_priority_rules.md"
      - "docs/rules/master_priority_rules.md"
      - "docs/latest/model_data_independence_audit_latest.*"
      - "output/latest/model_data_independence_audit_latest.*"
      - "docs/specs/*operation*.md"
      - "docs/specs/daily_mature_model_row_level_metric_contract.md"
      - "docs/repo_hidden_coupling_audit.md"
      - "scripts/build_daily_*model*.py"
      - "scripts/build_daily_*operation*.py"
      - "scripts/build_daily_report_model_summary.py"
      - "scripts/build_model_operation_readiness.py"
      - "scripts/build_model_data_independence_audit.py"
      - "scripts/model_data_independence.py"
      - "scripts/build_*_research.py"
      - "scripts/price_pullback_23ema_*.py"
      - "scripts/revenue_unreacted_range_*.py"
      - "scripts/volume_range_breakout_v2_*.py"
      - "scripts/build_mature_model_row_level_metric_contract_audit.py"
      - "scripts/generate_chatgpt_side_daily_reports.py"
      - "scripts/run_chatgpt_daily_report_entrypoint.py"
      - "scripts/update_daily_published_model_snapshots.py"
      - "scripts/validate_chatgpt_daily_report_new_conversation_replay.py"
      - "scripts/validate_daily_*.py"
      - "scripts/validate_model_operation_readiness.py"
      - "scripts/validate_model_data_independence.py"
      - "scripts/validate_model_surface_registry.py"
      - "scripts/validate_model_research_*.py"
      - "scripts/validate_mature_model_row_level_metric_contract_audit.py"
      - "scripts/validate_daily_legacy_volume_range_breakout_removed.py"
      - "scripts/validate_research_against_stock_model_contract.py"
      - "scripts/validate_repo_hidden_coupling_audit.py"
      - "scripts/validate_repo_code_isolation_policy.py"
      - "scripts/validate_stock_model_contract_registry.py"
      - "tests/test_chatgpt_daily_report_new_conversation_replay.py"
      - "tests/test_chatgpt_daily_report_entrypoint.py"
      - "tests/test_daily_*.py"
      - "tests/test_repo_hidden_coupling_audit.py"
      - "tests/test_model_operation_readiness.py"
      - "tests/test_model_data_independence.py"
      - "tests/test_model_surface_registry.py"
      - "tests/test_repo_code_isolation_policy.py"
      - "tests/test_model_research_*.py"
      - "tests/test_price_pullback_23ema_*.py"
      - "tests/test_revenue_unreacted_range_*.py"
      - "tests/test_volume_range_breakout_v2_*.py"
      - "tests/test_mature_model_row_level_metric_contract_audit.py"
      - "tests/test_stock_model_contract_registry.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-model-maintenance-pr-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  daily-model-maintenance-pr-validation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests tabulate matplotlib pillow openpyxl lxml html5lib beautifulsoup4 reportlab pypdf pytest fonttools

      - name: Validate daily model and PDF contracts
        run: |
          python scripts/validate_repo_production_inventory.py
          python scripts/validate_stock_model_contract_registry.py
          python scripts/validate_daily_pdf_contract_consumers.py
          python scripts/validate_daily_pdf_role_manifest_contract.py
          python scripts/validate_daily_pdf_shared_path_isolation.py
          python scripts/validate_daily_pdf_completion_hard_gate.py
          python scripts/validate_daily_legacy_volume_range_breakout_removed.py
          python scripts/validate_daily_legacy_mature_model_paths_removed.py
          python scripts/validate_daily_production_boundaries.py
          python scripts/validate_daily_published_model_snapshots.py
          python scripts/validate_daily_model_background_data_registry.py
          python scripts/validate_model_data_independence.py
          python scripts/validate_revenue_unreacted_range_source_first_condition_audit.py
          python scripts/validate_revenue_unreacted_range_forward_confirmation_feature_audit.py
          python scripts/validate_revenue_unreacted_range_rearmed_operation_grid.py
          python scripts/validate_revenue_unreacted_range_operation_lag_bucket_audit.py
          python scripts/build_mature_model_row_level_metric_contract_audit.py
          python scripts/validate_mature_model_row_level_metric_contract_audit.py
          python scripts/validate_research_against_stock_model_contract.py
          python scripts/validate_daily_model_research_parity.py
          python scripts/validate_repo_hidden_coupling_audit.py
          python scripts/validate_repo_code_isolation_policy.py
          python scripts/validate_model_research_workflow_isolation.py
          python scripts/validate_chatgpt_side_pdf_layout_independence.py

      - name: Run focused regression tests
        run: |
          python -m pytest \
            tests/test_chatgpt_daily_report_new_conversation_replay.py \
            tests/test_chatgpt_daily_report_entrypoint.py \
            tests/test_daily_pdf_contract_consumers.py \
            tests/test_daily_pdf_completion_hard_gate.py \
            tests/test_daily_pdf_shared_path_isolation.py \
            tests/test_daily_published_model_snapshots.py \
            tests/test_daily_legacy_mature_model_paths_removed.py \
            tests/test_daily_volume_breakout_operation_section.py \
            tests/test_daily_w_bottom_operation_sections.py \
            tests/test_daily_price_pullback_23ema_operation_section.py \
            tests/test_mature_model_row_level_metric_contract_audit.py \
            tests/test_daily_report_model_summary.py \
            tests/test_daily_production_boundaries.py \
            tests/test_model_data_independence.py \
            tests/test_revenue_unreacted_range_source_first_condition_audit.py \
            tests/test_revenue_unreacted_range_forward_confirmation_feature_audit.py \
            tests/test_revenue_unreacted_range_rearmed_operation_grid.py \
            tests/test_revenue_unreacted_range_operation_lag_bucket_audit.py \
            tests/test_repo_hidden_coupling_audit.py \
            tests/test_model_research_workflow_isolation.py \
            tests/test_stock_model_contract_registry.py

  daily-pdf-dfkai-replay:
    needs: daily-model-maintenance-pr-validation
    runs-on: windows-2025

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install PDF replay dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests tabulate matplotlib pillow openpyxl lxml html5lib beautifulsoup4 reportlab pypdf pytest fonttools

      - name: Install and validate DFKai-SB
        timeout-minutes: 20
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $fontCapability = "Language.Fonts.Hant~~~und-HANT~0.0.1.0"
          $fontPath = "C:\Windows\Fonts\kaiu.ttf"
          if (-not (Test-Path -LiteralPath $fontPath)) {
            $windowsUpdatePolicy = "HKLM:\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate"
            $windowsUpdateAuPolicy = "$windowsUpdatePolicy\AU"
            New-Item -Path $windowsUpdateAuPolicy -Force | Out-Null
            New-ItemProperty -Path $windowsUpdatePolicy -Name DoNotConnectToWindowsUpdateInternetLocations -PropertyType DWord -Value 0 -Force | Out-Null
            New-ItemProperty -Path $windowsUpdatePolicy -Name DisableWindowsUpdateAccess -PropertyType DWord -Value 0 -Force | Out-Null
            New-ItemProperty -Path $windowsUpdateAuPolicy -Name UseWUServer -PropertyType DWord -Value 0 -Force | Out-Null
            Set-Service -Name wuauserv -StartupType Manual
            Start-Service -Name wuauserv
            $capability = Get-WindowsCapability -Online -Name $fontCapability
            Write-Host "font_capability_state_before=$($capability.State)"
            if ($capability.State -ne "Installed") {
              & "$env:SystemRoot\System32\dism.exe" /Online /Add-Capability "/CapabilityName:$fontCapability" /NoRestart
              if ($LASTEXITCODE -ne 0) {
                throw "DFKai-SB capability installation failed with DISM exit code $LASTEXITCODE"
              }
            }
          }
          if (-not (Test-Path -LiteralPath $fontPath)) {
            throw "Required DFKai-SB font file is missing after capability install: $fontPath"
          }
          "CHATGPT_DAILY_DFKAI_FONT_PATH=$fontPath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          python -c 'from fontTools.ttLib import TTFont; p=r"C:\Windows\Fonts\kaiu.ttf"; f=TTFont(p); names={n.toUnicode() for n in f["name"].names}; accepted={"DFKai-SB","DFKaiShu-SB-Estd-BF"}; assert names & accepted, f"unexpected font names: {sorted(names)}"; cmap={cp for table in f["cmap"].tables for cp in table.cmap}; canary="\u6a19\u6977\u9ad4\u7e41\u9ad4\u4e2d\u6587\u6e2c\u8a66"; missing=[f"U+{ord(char):04X}" for char in canary if ord(char) not in cmap]; assert not missing, f"missing canary glyphs: {missing}"; print(f"validated_font={p} names={sorted(names & accepted)}")'

      - name: Prepare Windows long-path PDF replay runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          git config --global core.longpaths true
          $shortTemp = "C:\tdcc-pdf-temp"
          New-Item -ItemType Directory -Path $shortTemp -Force | Out-Null
          "TEMP=$shortTemp" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "TMP=$shortTemp" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "TMPDIR=$shortTemp" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Replay ChatGPT-side daily PDF new conversation
        timeout-minutes: 20
        shell: bash
        run: |
          if [ -n "${GITHUB_HEAD_REF:-}" ]; then
            source_ref="origin/${GITHUB_HEAD_REF}"
          else
            source_ref="origin/${GITHUB_REF_NAME}"
          fi
          echo "PDF replay source_ref=$source_ref"
          echo "PDF replay output_dir=chatgpt_side_outputs_pr_validation"
          git fetch origin "${source_ref#origin/}"
          timeout 20m python scripts/validate_chatgpt_daily_report_new_conversation_replay.py \
            --source-ref "$source_ref" \
            --output-dir chatgpt_side_outputs_pr_validation
          python scripts/validate_daily_pdf_completion_hard_gate.py --require-output-dir chatgpt_side_outputs_pr_validation

      - name: Upload PR daily PDF replay evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-pdf-replay-pr-validation
          path: |
            chatgpt_side_outputs_pr_validation/*.pdf
            chatgpt_side_outputs_pr_validation/chatgpt_daily_report_runtime_manifest.json
            chatgpt_side_outputs_pr_validation/chatgpt_daily_pdf_semantic_manifest.csv
          if-no-files-found: error
