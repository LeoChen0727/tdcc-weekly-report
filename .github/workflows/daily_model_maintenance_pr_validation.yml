name: Daily Model Maintenance PR Validation

on:
  pull_request:
  workflow_dispatch:
    inputs:
      run_volume_v2_runtime_markdown_normalization_candidate_only:
        description: "Normalize only the two Volume V2 runtime Markdown mirrors on a non-main PR branch"
        required: false
        default: false
        type: boolean
      expected_base_sha:
        description: "Exact direct parent of the authorized Volume V2 code commit"
        required: false
        default: ""
        type: string
      expected_head_sha:
        description: "Exact authorized code commit at the dispatched branch head"
        required: false
        default: ""
        type: string
      confirmation:
        description: "Exact confirmation for the one-time Volume V2 runtime Markdown candidate"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: daily-model-maintenance-pr-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    name: daily-model-validation-scope
    runs-on: ubuntu-latest
    outputs:
      effective_base_sha: ${{ steps.scope.outputs.effective_base_sha }}
      repo_current_contracts: ${{ steps.scope.outputs.repo_current_contracts }}
      shared_model_research: ${{ steps.scope.outputs.shared_model_research }}
      volume_v2_research: ${{ steps.scope.outputs.volume_v2_research }}
      revenue_research: ${{ steps.scope.outputs.revenue_research }}
      financial_statement_research: ${{ steps.scope.outputs.financial_statement_research }}

    steps:
      - name: Materialize only the scope detector from the public merge ref
        env:
          FETCH_REF: ${{ github.ref }}
          MERGE_SHA: ${{ github.sha }}
          REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}.git
        shell: bash
        run: |
          set -euo pipefail
          git --no-replace-objects init .
          git --no-replace-objects remote add origin "$REPOSITORY_URL"
          git --no-replace-objects config remote.origin.promisor true
          git --no-replace-objects config remote.origin.partialclonefilter blob:none
          fetch_depth=1
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            fetch_depth=2
          fi
          git --no-replace-objects -c protocol.version=2 fetch \
            --no-tags \
            --depth="$fetch_depth" \
            --filter=blob:none \
            origin \
            "+$FETCH_REF:refs/remotes/origin/pr-scope"
          fetched_sha="$(git --no-replace-objects rev-parse FETCH_HEAD)"
          if [ "$fetched_sha" != "$MERGE_SHA" ]; then
            echo "scope fetch SHA mismatch: actual=$fetched_sha expected=$MERGE_SHA" >&2
            exit 1
          fi
          mkdir -p scripts
          git --no-replace-objects show \
            "$MERGE_SHA:scripts/detect_daily_model_pr_validation_scope.py" \
            > scripts/detect_daily_model_pr_validation_scope.py

      - name: Detect changed-path validation scope
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MERGE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          effective_base_sha="origin/main"
          scope_args=(
            --event-name "$EVENT_NAME"
            --github-output "$GITHUB_OUTPUT"
          )
          if [ "$EVENT_NAME" = "pull_request" ]; then
            merge_identity="$(git --no-replace-objects rev-list --parents -n 1 "$MERGE_SHA")"
            read -r observed_merge observed_base observed_head unexpected_parent <<< "$merge_identity"
            if [ -z "$observed_merge" ] || [ -z "$observed_base" ] || [ -z "$observed_head" ] || [ -n "${unexpected_parent:-}" ]; then
              echo "scope merge ref must be an exact two-parent synthetic merge" >&2
              exit 1
            fi
            if [ "$observed_merge" != "$MERGE_SHA" ] || [ "$observed_head" != "$HEAD_SHA" ]; then
              echo "scope merge/head identity mismatch: merge=$observed_merge expected_merge=$MERGE_SHA head=$observed_head expected_head=$HEAD_SHA" >&2
              exit 1
            fi
            effective_base_sha="$observed_base"
            scope_args+=(
              --base-sha "$effective_base_sha"
              --head-sha "$HEAD_SHA"
              --merge-sha "$MERGE_SHA"
            )
          fi
          python scripts/detect_daily_model_pr_validation_scope.py "${scope_args[@]}"
          if [ -z "$effective_base_sha" ]; then
            echo "scope effective base output must be non-empty" >&2
            exit 1
          fi
          printf 'effective_base_sha=%s\n' "$effective_base_sha" >> "$GITHUB_OUTPUT"

  repo_current_contracts:
    name: repo-current-contracts
    needs: scope
    if: >-
      needs.scope.result == 'success' &&
      inputs.run_volume_v2_runtime_markdown_normalization_candidate_only != true &&
      needs.scope.outputs.repo_current_contracts == 'true'
    runs-on: ubuntu-latest
    env:
      BASE_SHA: ${{ needs.scope.outputs.effective_base_sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      SNAPSHOT_PR_SAFE_CONTROL_HELPER_SHA256: 4329b48823dc844fc565f09d6af4aa0495a16b3713cb842c55f63d28949e31c2

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests tabulate matplotlib pillow openpyxl lxml html5lib beautifulsoup4 reportlab pypdf pytest fonttools pyyaml

      - name: Check patch whitespace
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            git --no-replace-objects diff --check "$BASE_SHA...$HEAD_SHA" --
          else
            git --no-replace-objects diff --check HEAD --
          fi

      - name: Validate production lineage parity ordering contract
        run: |
          python -m pytest -q tests/test_daily_model_maintenance_pr_validation_workflow.py \
            -k production_snapshot_updates_are_followed_by_dynamic_lineage_parity

      - name: Validate current repository and PDF contracts
        run: |
          python scripts/validate_repo_file_lifecycle_inventory.py
          python scripts/validate_repo_production_inventory.py
          python scripts/validate_stock_model_contract_registry.py
          python scripts/validate_daily_pdf_contract_consumers.py
          python scripts/validate_daily_pdf_role_manifest_contract.py
          python scripts/validate_daily_pdf_shared_path_isolation.py
          python scripts/validate_daily_pdf_completion_hard_gate.py
          python scripts/validate_daily_legacy_volume_range_breakout_removed.py
          python scripts/validate_daily_legacy_mature_model_paths_removed.py
          python scripts/validate_daily_production_boundaries.py
          python scripts/validate_daily_published_model_snapshots_pr_safe.py --base-ref "$BASE_SHA"
          python scripts/validate_repo_advanced_integrity_pr_safe.py --base-ref "$BASE_SHA"
          python scripts/validate_repo_hidden_coupling_audit.py
          python scripts/validate_git_worktree_safety.py
          python scripts/validate_chatgpt_side_pdf_contract.py
          python scripts/validate_repo_code_isolation_policy.py
          python scripts/validate_model_research_workflow_isolation.py
          python scripts/validate_chatgpt_side_pdf_layout_independence.py

      - name: Run current repository and PDF regression tests
        run: |
          python -m pytest \
            tests/test_chatgpt_daily_report_new_conversation_replay.py \
            tests/test_chatgpt_daily_report_entrypoint.py \
            tests/test_daily_report_source_resolver.py \
            tests/test_chatgpt_side_pdf_contract.py \
            tests/test_catalyst_pages_sync.py \
            tests/test_daily_event_catalyst_formal_sync_scope.py \
            tests/test_daily_warrant_formal_sync_scope.py \
            tests/test_warrant_source_status.py \
            tests/test_daily_model_maintenance_pr_validation_workflow.py \
            tests/test_detect_daily_model_pr_validation_scope.py \
            tests/test_daily_pdf_contract_consumers.py \
            tests/test_daily_pdf_completion_hard_gate.py \
            tests/test_daily_pdf_shared_path_isolation.py \
            tests/test_daily_published_model_snapshots_pr_safe.py \
            tests/test_repo_advanced_integrity.py \
            tests/test_repo_advanced_integrity_pr_safe.py \
            tests/test_daily_report_model_summary.py \
            tests/test_daily_production_boundaries.py \
            tests/test_repo_hidden_coupling_audit.py \
            tests/test_git_worktree_safety.py \
            tests/test_model_research_workflow_isolation.py \
            tests/test_stock_model_contract_registry.py \
            --deselect tests/test_repo_advanced_integrity.py::test_repo_advanced_integrity_validator_passes

  shared_model_research:
    name: shared-model-research
    needs: scope
    if: >-
      needs.scope.result == 'success' &&
      inputs.run_volume_v2_runtime_markdown_normalization_candidate_only != true &&
      needs.scope.outputs.shared_model_research == 'true'
    runs-on: ubuntu-latest
    env:
      BASE_SHA: ${{ needs.scope.outputs.effective_base_sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests tabulate matplotlib pillow openpyxl lxml html5lib beautifulsoup4 reportlab pypdf pytest fonttools pyyaml

      - name: Validate shared model research contracts
        run: |
          python scripts/validate_daily_model_background_data_registry.py
          python scripts/validate_model_data_independence.py --base-ref "$BASE_SHA"
          python scripts/validate_model_research_shared_utilities.py --base-ref "$BASE_SHA"
          python scripts/build_mature_model_row_level_metric_contract_audit.py
          python scripts/validate_mature_model_row_level_metric_contract_audit.py
          python scripts/validate_research_against_stock_model_contract.py
          python scripts/validate_daily_model_research_parity.py

      - name: Run shared model research regression tests
        run: |
          python -m pytest \
            tests/test_daily_candidate_model_layer.py \
            tests/test_daily_published_model_snapshots.py \
            tests/test_backfill_historical_all_candidates_snapshots.py \
            tests/test_daily_published_snapshot_ranking_backtest.py \
            tests/test_daily_snapshot_revision_utils.py \
            tests/test_stage_daily_published_snapshot_revisions.py \
            tests/test_daily_legacy_mature_model_paths_removed.py \
            tests/test_daily_operation_adapter_protected_fields.py \
            tests/test_daily_w_bottom_operation_sections.py \
            tests/test_daily_price_pullback_23ema_operation_section.py \
            tests/test_price_pullback_daily_row_parity.py \
            tests/test_mature_model_row_level_metric_contract_audit.py \
            tests/test_model_data_independence.py

  volume_v2_research:
    name: volume-v2-research
    needs: scope
    if: >-
      needs.scope.result == 'success' &&
      (inputs.run_volume_v2_runtime_markdown_normalization_candidate_only == true ||
      needs.scope.outputs.volume_v2_research == 'true')
    runs-on: ubuntu-latest
    env:
      BASE_SHA: ${{ needs.scope.outputs.effective_base_sha }}
      LINEAGE_HISTORY_MODE: ${{ github.event_name == 'pull_request' && '--pr-safe-base-history' || '' }}
      REPAIR_MODE: ${{ inputs.run_volume_v2_runtime_markdown_normalization_candidate_only }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate authorized Volume V2 normalization identity
        if: ${{ inputs.run_volume_v2_runtime_markdown_normalization_candidate_only == true }}
        env:
          EXPECTED_BASE_SHA: ${{ inputs.expected_base_sha }}
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
          CONFIRMATION: ${{ inputs.confirmation }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ]; then
            echo "Volume V2 normalization must use workflow_dispatch" >&2
            exit 1
          fi
          if [ "$GITHUB_RUN_ATTEMPT" != "1" ]; then
            echo "Volume V2 normalization rejects rerun attempts" >&2
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" != "branch" ] || [ "$GITHUB_REF_NAME" = "main" ]; then
            echo "Volume V2 normalization requires a non-main branch ref" >&2
            exit 1
          fi
          if ! [[ "$EXPECTED_BASE_SHA" =~ ^[0-9a-f]{40}$ ]] || ! [[ "$EXPECTED_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Volume V2 normalization requires full lowercase base/head SHAs" >&2
            exit 1
          fi
          if [ "$CONFIRMATION" != "normalize_volume_v2_runtime_markdown_candidate" ]; then
            echo "Volume V2 normalization confirmation mismatch" >&2
            exit 1
          fi
          checkout_sha="$(git --no-replace-objects rev-parse HEAD)"
          parent_sha="$(git --no-replace-objects rev-parse HEAD^)"
          remote_branch_sha="$(git --no-replace-objects ls-remote origin "refs/heads/$GITHUB_REF_NAME" | awk '{print $1}')"
          if [ "$GITHUB_SHA" != "$EXPECTED_HEAD_SHA" ] || [ "$checkout_sha" != "$EXPECTED_HEAD_SHA" ] || [ "$remote_branch_sha" != "$EXPECTED_HEAD_SHA" ]; then
            echo "Volume V2 normalization head identity mismatch" >&2
            exit 1
          fi
          if [ "$parent_sha" != "$EXPECTED_BASE_SHA" ]; then
            echo "Volume V2 normalization base identity mismatch" >&2
            exit 1
          fi
          if [ "$(git --no-replace-objects rev-list --count "$EXPECTED_BASE_SHA..$EXPECTED_HEAD_SHA")" != "1" ]; then
            echo "Volume V2 normalization code head must be the unique direct child of its expected parent" >&2
            exit 1
          fi

      - name: Capture immutable Volume V2 CSV identities
        if: ${{ inputs.run_volume_v2_runtime_markdown_normalization_candidate_only == true }}
        id: volume_csv_preimage
        shell: bash
        run: |
          set -euo pipefail
          output_csv="output/latest/volume_v2_warrant_lineage_history_audit_latest.csv"
          docs_csv="docs/latest/volume_v2_warrant_lineage_history_audit_latest.csv"
          cmp --silent "$output_csv" "$docs_csv"
          git --no-replace-objects diff --exit-code HEAD -- "$output_csv" "$docs_csv"
          output_sha256="$(sha256sum "$output_csv" | awk '{print $1}')"
          docs_sha256="$(sha256sum "$docs_csv" | awk '{print $1}')"
          output_blob="$(git --no-replace-objects rev-parse "HEAD:$output_csv")"
          docs_blob="$(git --no-replace-objects rev-parse "HEAD:$docs_csv")"
          if [ "$output_sha256" != "$docs_sha256" ]; then
            echo "Volume V2 CSV mirror SHA-256 mismatch before normalization" >&2
            exit 1
          fi
          echo "output_sha256=$output_sha256" >> "$GITHUB_OUTPUT"
          echo "docs_sha256=$docs_sha256" >> "$GITHUB_OUTPUT"
          echo "output_blob=$output_blob" >> "$GITHUB_OUTPUT"
          echo "docs_blob=$docs_blob" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests tabulate matplotlib pillow openpyxl lxml html5lib beautifulsoup4 reportlab pypdf pytest fonttools pyyaml

      - name: Validate Volume V2 research contracts
        shell: bash
        run: |
          set -euo pipefail
          if [ "$REPAIR_MODE" != "true" ]; then
            python scripts/validate_volume_breakout_watch.py --latest-only
            python scripts/validate_volume_attack_theme_layer.py
            python scripts/validate_daily_canonical_field_lineage.py --base-ref "$BASE_SHA" $LINEAGE_HISTORY_MODE
          fi
          python scripts/build_volume_v2_warrant_lineage_history_audit.py --phase runtime
          python scripts/validate_volume_v2_warrant_lineage_history_audit.py --phase runtime
          if [ "$REPAIR_MODE" != "true" ]; then
            git --no-replace-objects diff --exit-code -- \
              docs/latest/volume_v2_warrant_lineage_history_audit_latest.csv \
              docs/latest/volume_v2_warrant_lineage_history_audit_latest.md \
              output/latest/volume_v2_warrant_lineage_history_audit_latest.csv \
              output/latest/volume_v2_warrant_lineage_history_audit_latest.md
          fi

      - name: Verify exact Volume V2 Markdown normalization candidate
        if: ${{ inputs.run_volume_v2_runtime_markdown_normalization_candidate_only == true }}
        env:
          OUTPUT_CSV_SHA256: ${{ steps.volume_csv_preimage.outputs.output_sha256 }}
          DOCS_CSV_SHA256: ${{ steps.volume_csv_preimage.outputs.docs_sha256 }}
          OUTPUT_CSV_BLOB: ${{ steps.volume_csv_preimage.outputs.output_blob }}
          DOCS_CSV_BLOB: ${{ steps.volume_csv_preimage.outputs.docs_blob }}
        shell: bash
        run: |
          set -euo pipefail
          output_csv="output/latest/volume_v2_warrant_lineage_history_audit_latest.csv"
          docs_csv="docs/latest/volume_v2_warrant_lineage_history_audit_latest.csv"
          output_md="output/latest/volume_v2_warrant_lineage_history_audit_latest.md"
          docs_md="docs/latest/volume_v2_warrant_lineage_history_audit_latest.md"
          test "$(sha256sum "$output_csv" | awk '{print $1}')" = "$OUTPUT_CSV_SHA256"
          test "$(sha256sum "$docs_csv" | awk '{print $1}')" = "$DOCS_CSV_SHA256"
          test "$(git --no-replace-objects rev-parse "HEAD:$output_csv")" = "$OUTPUT_CSV_BLOB"
          test "$(git --no-replace-objects rev-parse "HEAD:$docs_csv")" = "$DOCS_CSV_BLOB"
          git --no-replace-objects diff --exit-code HEAD -- "$output_csv" "$docs_csv"
          cmp --silent "$output_md" "$docs_md"
          grep -Fq "Runtime mode independently replays only the current manifest-max revision." "$output_md"
          if grep -Fq "The dynamic historical/current coverage replays" "$output_md"; then
            echo "Volume V2 runtime Markdown still claims full-history replay" >&2
            exit 1
          fi
          python - <<'PY'
          import subprocess

          expected = {
              "docs/latest/volume_v2_warrant_lineage_history_audit_latest.md",
              "output/latest/volume_v2_warrant_lineage_history_audit_latest.md",
          }
          observed = set(filter(None, subprocess.check_output(
              ["git", "--no-replace-objects", "diff", "--name-only", "HEAD", "--"],
              text=True,
          ).splitlines()))
          observed.update(filter(None, subprocess.check_output(
              ["git", "--no-replace-objects", "ls-files", "--others", "--exclude-standard"],
              text=True,
          ).splitlines()))
          if observed != expected:
              raise SystemExit(
                  f"Volume V2 normalization changed-path mismatch: observed={sorted(observed)} expected={sorted(expected)}"
              )
          PY

      - name: Upload exact Volume V2 Markdown normalization candidate
        if: ${{ inputs.run_volume_v2_runtime_markdown_normalization_candidate_only == true }}
        uses: actions/upload-artifact@v4
        with:
          name: volume-v2-runtime-markdown-normalization-candidate
          if-no-files-found: error
          retention-days: 1
          path: |
            output/latest/volume_v2_warrant_lineage_history_audit_latest.md
            docs/latest/volume_v2_warrant_lineage_history_audit_latest.md

      - name: Run Volume V2 research regression tests
        run: |
          python -m pytest \
            tests/test_volume_breakout_watch.py \
            tests/test_daily_canonical_field_lineage.py \
            tests/test_volume_v2_warrant_lineage_history_audit.py \
            tests/test_daily_volume_breakout_operation_section.py

  revenue_research:
    name: revenue-research
    needs: scope
    if: >-
      needs.scope.result == 'success' &&
      inputs.run_volume_v2_runtime_markdown_normalization_candidate_only != true &&
      needs.scope.outputs.revenue_research == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests tabulate matplotlib pillow openpyxl lxml html5lib beautifulsoup4 reportlab pypdf pytest fonttools pyyaml

      - name: Validate revenue research contracts
        run: |
          python scripts/validate_revenue_unreacted_range_monthly_revenue_cross_market_resolution.py
          python scripts/validate_revenue_unreacted_range_source_first_condition_audit.py
          python scripts/validate_revenue_unreacted_range_source_snapshot_projection.py
          python scripts/validate_revenue_unreacted_range_forward_confirmation_feature_audit.py
          python scripts/validate_revenue_unreacted_range_rearmed_operation_grid.py
          python scripts/validate_revenue_unreacted_range_operation_lag_bucket_audit.py
          python scripts/validate_revenue_unreacted_range_position_shape_transition_matrix.py
          python scripts/validate_revenue_unreacted_range_low_mid_falling_candidate_audit.py
          python scripts/validate_revenue_unreacted_range_promotion_preparation.py
          python scripts/validate_revenue_unreacted_range_financial_statement_fail_closed.py

      - name: Run revenue research regression tests
        run: |
          python -m pytest \
            tests/test_monthly_revenue_point_in_time_panel.py \
            tests/test_revenue_unreacted_range_source_first_condition_audit.py \
            tests/test_revenue_unreacted_range_source_snapshot_projection.py \
            tests/test_revenue_unreacted_range_monthly_revenue_cross_market_resolution.py \
            tests/test_validate_revenue_unreacted_range_monthly_revenue_cross_market_resolution.py \
            tests/test_revenue_unreacted_range_forward_confirmation_feature_audit.py \
            tests/test_revenue_unreacted_range_rearmed_operation_grid.py \
            tests/test_revenue_unreacted_range_operation_lag_bucket_audit.py \
            tests/test_revenue_unreacted_range_position_shape_transition_matrix.py \
            tests/test_revenue_unreacted_range_low_mid_falling_candidate_audit.py \
            tests/test_validate_revenue_unreacted_range_low_mid_falling_candidate_audit.py \
            tests/test_validate_revenue_unreacted_range_promotion_preparation.py \
            tests/test_revenue_unreacted_range_forward_holdout.py \
            tests/test_validate_revenue_unreacted_range_forward_holdout.py \
            tests/test_revenue_unreacted_range_financial_statement_fail_closed.py

  financial_statement_research:
    name: financial-statement-research
    needs: scope
    if: >-
      needs.scope.result == 'success' &&
      inputs.run_volume_v2_runtime_markdown_normalization_candidate_only != true &&
      needs.scope.outputs.financial_statement_research == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests tabulate matplotlib pillow openpyxl lxml html5lib beautifulsoup4 reportlab pypdf pytest fonttools pyyaml

      - name: Validate financial-statement research contracts
        run: |
          python scripts/validate_financial_statement_pit.py
          python scripts/build_financial_statement_historical_pit_source_audit.py
          python scripts/validate_financial_statement_historical_pit_source_audit.py
          git --no-replace-objects diff --exit-code -- \
            docs/latest/financial_statement_historical_pit_source_audit_latest.csv \
            docs/latest/financial_statement_historical_pit_source_audit_latest.md \
            output/latest/research_backtest/financial_statement_historical_pit_source_audit_latest.csv \
            output/latest/research_backtest/financial_statement_historical_pit_source_audit_latest.md

      - name: Run financial-statement research regression tests
        run: |
          python -m pytest \
            tests/test_financial_statement_pit.py \
            tests/test_financial_statement_historical_pit_source_audit.py

  volume_v2_runtime_markdown_normalization_candidate_commit:
    name: volume-v2-runtime-markdown-normalization-candidate-commit
    needs:
      - scope
      - volume_v2_research
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.run_attempt == 1 &&
      github.ref_type == 'branch' &&
      github.ref_name != 'main' &&
      inputs.run_volume_v2_runtime_markdown_normalization_candidate_only == true &&
      needs.scope.result == 'success' &&
      needs.volume_v2_research.result == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Require production artifact write deploy key
        shell: bash
        env:
          PRODUCTION_ARTIFACT_WRITE_DEPLOY_KEY: ${{ secrets.PRODUCTION_ARTIFACT_WRITE_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${PRODUCTION_ARTIFACT_WRITE_DEPLOY_KEY}" ]; then
            echo "::error::PRODUCTION_ARTIFACT_WRITE_DEPLOY_KEY is required for Volume V2 branch artifact publishing."
            exit 1
          fi

      - name: Checkout exact authorized Volume V2 code head
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ inputs.expected_head_sha }}
          ssh-key: ${{ secrets.PRODUCTION_ARTIFACT_WRITE_DEPLOY_KEY }}
          persist-credentials: true

      - name: Revalidate exact Volume V2 code commit scope
        env:
          EXPECTED_BASE_SHA: ${{ inputs.expected_base_sha }}
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
          CONFIRMATION: ${{ inputs.confirmation }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ] || [ "$GITHUB_REF_TYPE" != "branch" ] || [ "$GITHUB_REF_NAME" = "main" ]; then
            echo "Volume V2 normalization commit requires a non-main branch dispatch" >&2
            exit 1
          fi
          if [ "$GITHUB_RUN_ATTEMPT" != "1" ]; then
            echo "Volume V2 normalization commit rejects rerun attempts" >&2
            exit 1
          fi
          if [ "$CONFIRMATION" != "normalize_volume_v2_runtime_markdown_candidate" ]; then
            echo "Volume V2 normalization confirmation mismatch" >&2
            exit 1
          fi
          checkout_sha="$(git --no-replace-objects rev-parse HEAD)"
          parent_sha="$(git --no-replace-objects rev-parse HEAD^)"
          remote_branch_sha="$(git --no-replace-objects ls-remote origin "refs/heads/$GITHUB_REF_NAME" | awk '{print $1}')"
          if [ "$GITHUB_SHA" != "$EXPECTED_HEAD_SHA" ] || [ "$checkout_sha" != "$EXPECTED_HEAD_SHA" ] || [ "$remote_branch_sha" != "$EXPECTED_HEAD_SHA" ]; then
            echo "Volume V2 normalization code head moved before commit" >&2
            exit 1
          fi
          if [ "$parent_sha" != "$EXPECTED_BASE_SHA" ]; then
            echo "Volume V2 normalization code-parent identity mismatch before commit" >&2
            exit 1
          fi
          python - <<'PY'
          import os
          import subprocess

          expected = {
              ".github/workflows/daily_model_maintenance_pr_validation.yml",
              "config/repo_file_lifecycle_inventory.csv",
              "config/repo_production_inventory.csv",
              "scripts/validate_daily_production_boundaries.py",
              "scripts/validate_repo_production_inventory.py",
              "tests/test_daily_model_maintenance_pr_validation_workflow.py",
              "tests/test_daily_production_boundaries.py",
              "tests/test_repo_production_inventory.py",
              "tests/test_volume_v2_warrant_lineage_history_audit.py",
          }
          observed = set(filter(None, subprocess.check_output(
              ["git", "--no-replace-objects", "diff", "--name-only", "--no-renames", os.environ["EXPECTED_BASE_SHA"], os.environ["EXPECTED_HEAD_SHA"], "--"],
              text=True,
          ).splitlines()))
          if observed != expected:
              raise SystemExit(
                  f"Volume V2 code changed-path mismatch: observed={sorted(observed)} expected={sorted(expected)}"
              )
          PY

      - name: Download exact Volume V2 Markdown normalization candidate
        uses: actions/download-artifact@v4
        with:
          name: volume-v2-runtime-markdown-normalization-candidate
          path: .

      - name: Commit and push exact Volume V2 Markdown normalization candidate
        env:
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          output_csv="output/latest/volume_v2_warrant_lineage_history_audit_latest.csv"
          docs_csv="docs/latest/volume_v2_warrant_lineage_history_audit_latest.csv"
          output_md="output/latest/volume_v2_warrant_lineage_history_audit_latest.md"
          docs_md="docs/latest/volume_v2_warrant_lineage_history_audit_latest.md"
          git --no-replace-objects diff --exit-code HEAD -- "$output_csv" "$docs_csv"
          test "$(git --no-replace-objects hash-object "$output_csv")" = "$(git --no-replace-objects rev-parse "HEAD:$output_csv")"
          test "$(git --no-replace-objects hash-object "$docs_csv")" = "$(git --no-replace-objects rev-parse "HEAD:$docs_csv")"
          cmp --silent "$output_md" "$docs_md"
          grep -Fq "Runtime mode independently replays only the current manifest-max revision." "$output_md"
          if grep -Fq "The dynamic historical/current coverage replays" "$output_md"; then
            echo "Volume V2 runtime Markdown still claims full-history replay" >&2
            exit 1
          fi
          python - <<'PY'
          import subprocess

          expected = {
              "docs/latest/volume_v2_warrant_lineage_history_audit_latest.md",
              "output/latest/volume_v2_warrant_lineage_history_audit_latest.md",
          }
          observed = set(filter(None, subprocess.check_output(
              ["git", "--no-replace-objects", "diff", "--name-only", "HEAD", "--"],
              text=True,
          ).splitlines()))
          observed.update(filter(None, subprocess.check_output(
              ["git", "--no-replace-objects", "ls-files", "--others", "--exclude-standard"],
              text=True,
          ).splitlines()))
          if observed != expected:
              raise SystemExit(
                  f"Volume V2 downloaded changed-path mismatch: observed={sorted(observed)} expected={sorted(expected)}"
              )
          PY
          git --no-replace-objects add -- output/latest/volume_v2_warrant_lineage_history_audit_latest.md
          git --no-replace-objects add -- docs/latest/volume_v2_warrant_lineage_history_audit_latest.md
          python - <<'PY'
          import subprocess

          expected = {
              "docs/latest/volume_v2_warrant_lineage_history_audit_latest.md",
              "output/latest/volume_v2_warrant_lineage_history_audit_latest.md",
          }
          observed = set(filter(None, subprocess.check_output(
              ["git", "--no-replace-objects", "diff", "--cached", "--name-only", "--no-renames", "--"],
              text=True,
          ).splitlines()))
          if observed != expected:
              raise SystemExit(
                  f"Volume V2 staged-path mismatch: observed={sorted(observed)} expected={sorted(expected)}"
              )
          PY
          test "$(git --no-replace-objects hash-object "$output_md")" = "$(git --no-replace-objects rev-parse ":$output_md")"
          test "$(git --no-replace-objects hash-object "$docs_md")" = "$(git --no-replace-objects rev-parse ":$docs_md")"
          git --no-replace-objects config user.name "github-actions[bot]"
          git --no-replace-objects config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git --no-replace-objects commit -m "Normalize Volume V2 runtime audit Markdown"
          artifact_commit_sha="$(git --no-replace-objects rev-parse HEAD)"
          artifact_parent_sha="$(git --no-replace-objects rev-parse HEAD^)"
          if [ "$artifact_parent_sha" != "$EXPECTED_HEAD_SHA" ] || [ "$(git --no-replace-objects rev-list --count "$EXPECTED_HEAD_SHA..$artifact_commit_sha")" != "1" ]; then
            echo "Volume V2 artifact commit must be the code head's unique direct child" >&2
            exit 1
          fi
          python - <<'PY'
          import subprocess

          expected = {
              "docs/latest/volume_v2_warrant_lineage_history_audit_latest.md",
              "output/latest/volume_v2_warrant_lineage_history_audit_latest.md",
          }
          observed = set(filter(None, subprocess.check_output(
              ["git", "--no-replace-objects", "diff-tree", "--no-commit-id", "--name-only", "-r", "HEAD", "--"],
              text=True,
          ).splitlines()))
          if observed != expected:
              raise SystemExit(
                  f"Volume V2 committed-path mismatch: observed={sorted(observed)} expected={sorted(expected)}"
              )
          PY
          git --no-replace-objects diff --exit-code HEAD --
          test -z "$(git --no-replace-objects ls-files --others --exclude-standard)"
          remote_branch_sha="$(git --no-replace-objects ls-remote origin "refs/heads/$GITHUB_REF_NAME" | awk '{print $1}')"
          if [ "$remote_branch_sha" != "$EXPECTED_HEAD_SHA" ]; then
            echo "Remote branch moved before Volume V2 artifact push" >&2
            exit 1
          fi
          git --no-replace-objects push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
          published_sha="$(git --no-replace-objects ls-remote origin "refs/heads/$GITHUB_REF_NAME" | awk '{print $1}')"
          if [ "$published_sha" != "$artifact_commit_sha" ]; then
            echo "Remote branch does not equal the Volume V2 artifact commit" >&2
            exit 1
          fi
          echo "volume_v2_runtime_markdown_artifact_commit_sha=$artifact_commit_sha"

  daily-model-maintenance-pr-validation:
    name: daily-model-maintenance-pr-validation
    if: always()
    needs:
      - scope
      - repo_current_contracts
      - shared_model_research
      - volume_v2_research
      - revenue_research
      - financial_statement_research
      - volume_v2_runtime_markdown_normalization_candidate_commit
    runs-on: ubuntu-latest

    steps:
      - name: Validate selected and skipped domain results
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          CORE_SELECTED: ${{ needs.scope.outputs.repo_current_contracts }}
          CORE_RESULT: ${{ needs.repo_current_contracts.result }}
          SHARED_SELECTED: ${{ needs.scope.outputs.shared_model_research }}
          SHARED_RESULT: ${{ needs.shared_model_research.result }}
          VOLUME_SELECTED: ${{ needs.scope.outputs.volume_v2_research }}
          VOLUME_RESULT: ${{ needs.volume_v2_research.result }}
          REVENUE_SELECTED: ${{ needs.scope.outputs.revenue_research }}
          REVENUE_RESULT: ${{ needs.revenue_research.result }}
          FINANCIAL_SELECTED: ${{ needs.scope.outputs.financial_statement_research }}
          FINANCIAL_RESULT: ${{ needs.financial_statement_research.result }}
          REPAIR_MODE: ${{ inputs.run_volume_v2_runtime_markdown_normalization_candidate_only }}
          REPAIR_RESULT: ${{ needs.volume_v2_runtime_markdown_normalization_candidate_commit.result }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$SCOPE_RESULT" != "success" ]; then
            echo "scope job must succeed; observed=$SCOPE_RESULT" >&2
            exit 1
          fi
          if [ "$REPAIR_MODE" = "true" ]; then
            if [ "$REPAIR_RESULT" != "success" ] || [ "$VOLUME_RESULT" != "success" ]; then
              echo "Volume V2 normalization jobs must succeed: volume=$VOLUME_RESULT commit=$REPAIR_RESULT" >&2
              exit 1
            fi
            for result in "$CORE_RESULT" "$SHARED_RESULT" "$REVENUE_RESULT" "$FINANCIAL_RESULT"; do
              if [ "$result" != "skipped" ]; then
                echo "non-Volume domains must be skipped during Volume V2 normalization: result=$result" >&2
                exit 1
              fi
            done
            exit 0
          fi
          if [ "$REPAIR_RESULT" != "skipped" ]; then
            echo "Volume V2 normalization commit job must be skipped outside repair mode: result=$REPAIR_RESULT" >&2
            exit 1
          fi
          require_domain_result() {
            local domain="$1"
            local selected="$2"
            local result="$3"
            case "$selected" in
              true)
                if [ "$result" != "success" ]; then
                  echo "selected domain must succeed: domain=$domain result=$result" >&2
                  exit 1
                fi
                ;;
              false)
                if [ "$result" != "skipped" ]; then
                  echo "unselected domain must be skipped: domain=$domain result=$result" >&2
                  exit 1
                fi
                ;;
              *)
                echo "domain selection output must be true or false: domain=$domain selected=$selected" >&2
                exit 1
                ;;
            esac
          }

          require_domain_result repo-current-contracts "$CORE_SELECTED" "$CORE_RESULT"
          require_domain_result shared-model-research "$SHARED_SELECTED" "$SHARED_RESULT"
          require_domain_result volume-v2-research "$VOLUME_SELECTED" "$VOLUME_RESULT"
          require_domain_result revenue-research "$REVENUE_SELECTED" "$REVENUE_RESULT"
          require_domain_result financial-statement-research "$FINANCIAL_SELECTED" "$FINANCIAL_RESULT"
