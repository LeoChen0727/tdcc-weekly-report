name: Individual Stock Analysis Report

on:
  workflow_dispatch:
    inputs:
      stock_id:
        description: "Stock id, for example 2353 or 2330"
        required: true
        type: string
      days:
        description: "Price chart lookback days"
        required: false
        default: "126"
        type: string

permissions:
  contents: write

jobs:
  individual-stock-report:
    runs-on: ubuntu-latest

    steps:
      - name: Require production artifact write deploy key
        shell: bash
        env:
          PRODUCTION_ARTIFACT_WRITE_DEPLOY_KEY: ${{ secrets.PRODUCTION_ARTIFACT_WRITE_DEPLOY_KEY }}
        run: |
          if [ -z "${PRODUCTION_ARTIFACT_WRITE_DEPLOY_KEY}" ]; then
            echo "::error::PRODUCTION_ARTIFACT_WRITE_DEPLOY_KEY is required for artifact publishing."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ssh-key: ${{ secrets.PRODUCTION_ARTIFACT_WRITE_DEPLOY_KEY }}
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Validate repo production inventory
        run: |
          python scripts/validate_repo_production_inventory.py

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests matplotlib pillow reportlab

      - name: Refresh and validate individual stock packet
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python scripts/validate_tdcc_dataset_manifest.py
          python scripts/build_individual_stock_chatgpt_packets.py --stock-id "${{ inputs.stock_id }}"
          python scripts/build_individual_stock_raw_data_index.py
          python scripts/validate_individual_stock_outputs.py --stock-id "${{ inputs.stock_id }}"

      - name: Generate individual stock report
        run: |
          python scripts/generate_individual_stock_report.py \
            --stock-id "${{ inputs.stock_id }}" \
            --days "${{ inputs.days }}"

      - name: Commit individual stock report
        run: |
          STOCK_ID="${{ inputs.stock_id }}"

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git pull --rebase origin main || true

          git add output/latest/individual_stock_reports/ || true
          git add docs/latest/individual_stock_reports/ || true
          git add output/latest/charts/ || true
          git add output/latest/sell_strategy_performance_latest.csv || true
          git add output/latest/sell_strategy_performance_latest.md || true
          git add output/history/individual_stock_reports/ || true
          git add output/history/sell_strategy_backtest/ || true

          git status --short
          git commit -m "Generate individual stock report ${{ inputs.stock_id }}" || echo "No changes to commit"

          PUSHED=0
          for i in 1 2 3; do
            git pull --rebase origin main || true
            if git push; then
              PUSHED=1
              echo "Push succeeded"
              break
            fi
            echo "Push failed, retry $i"
            sleep 5
          done

          if [ "$PUSHED" != "1" ]; then
            echo "Push failed after retries"
            exit 1
          fi

      - name: Build and commit individual raw data index and health check
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          STOCK_ID="${{ inputs.stock_id }}"

          python scripts/validate_tdcc_dataset_manifest.py
          python scripts/build_individual_stock_chatgpt_packets.py --stock-id "${{ inputs.stock_id }}"
          python scripts/build_individual_stock_raw_data_index.py
          python scripts/validate_individual_stock_outputs.py --stock-id "${{ inputs.stock_id }}"
          python scripts/check_raw_data_health.py --stock-id "${{ inputs.stock_id }}" --sources raw,pages,api --max-workers 8

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git pull --rebase origin main || true

          git add output/latest/individual_stock_reports/ || true
          git add docs/latest/individual_stock_reports/ || true
          git add output/latest/raw_data_fetch_status_latest.csv || true
          git add output/latest/raw_data_fetch_status_latest.md || true
          git add docs/latest/raw_data_fetch_status_latest.csv || true
          git add docs/latest/raw_data_fetch_status_latest.md || true

          git status --short
          git commit -m "Update individual raw data health ${{ inputs.stock_id }}" || echo "No changes to commit"

          PUSHED=0
          for i in 1 2 3; do
            git pull --rebase origin main || true
            if git push; then
              PUSHED=1
              echo "Push succeeded"
              break
            fi
            echo "Push failed, retry $i"
            sleep 5
          done

          if [ "$PUSHED" != "1" ]; then
            echo "Push failed after retries"
            exit 1
          fi
