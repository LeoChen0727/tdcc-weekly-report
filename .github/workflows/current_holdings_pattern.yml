name: Current Holdings Pattern

on:
  workflow_dispatch:
  schedule:
    # Taiwan 19:30 = UTC 11:30
    - cron: "30 11 * * 1-5"

permissions:
  contents: write

jobs:
  current-holdings-pattern:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas matplotlib numpy openpyxl

      - name: Run current holdings pattern analysis
        run: python current_holdings_pattern.py

      - name: Commit current holdings pattern outputs
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add config/current_holdings.json
          git add current_holdings_pattern.py
          git add output/latest/current_holdings_pattern_latest.csv
          git add output/latest/current_holdings_pattern_latest.md
          git add output/latest/charts/current_holdings/

          git status --short
          git commit -m "Update current holdings pattern report" || echo "No changes to commit"
          git push
