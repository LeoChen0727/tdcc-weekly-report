name: Current Holdings Pattern

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  current-holdings-pattern:
    runs-on: ubuntu-latest

    steps:
      - name: Require production artifact write deploy key
        shell: bash
        env:
          PRODUCTION_ARTIFACT_WRITE_DEPLOY_KEY: ${{ secrets.PRODUCTION_ARTIFACT_WRITE_DEPLOY_KEY }}
        run: |
          if [ -z "${PRODUCTION_ARTIFACT_WRITE_DEPLOY_KEY}" ]; then
            echo "::error::PRODUCTION_ARTIFACT_WRITE_DEPLOY_KEY is required for artifact publishing."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ssh-key: ${{ secrets.PRODUCTION_ARTIFACT_WRITE_DEPLOY_KEY }}
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas matplotlib pillow openpyxl requests

      - name: Run current holdings pattern analysis
        run: |
          python current_holdings_pattern.py

      - name: Commit current holdings pattern outputs
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git pull --rebase origin main || true

          git add output/latest/current_holdings_pattern_latest.csv || true
          git add output/latest/current_holdings_pattern_latest.md || true
          git add output/latest/charts/current_holdings/ || true
          git add config/current_holdings.json || true
          git add current_holdings_pattern.py || true

          git status --short
          git commit -m "Update current holdings pattern report" || echo "No changes to commit"

          for i in 1 2 3; do
            git pull --rebase origin main || true
            if git push; then
              echo "Push succeeded"
              exit 0
            fi
            echo "Push failed, retry $i"
            sleep 5
          done

          echo "Push failed after retries"
          exit 1
