name: Individual Stock Data Refresh

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: individual-stock-data-refresh-${{ github.ref }}
  cancel-in-progress: false

jobs:
  individual-stock-data-refresh:
    runs-on: ubuntu-latest

    env:
      TARGET_BRANCH: ${{ github.ref_name }}

    steps:
      - name: Require production artifact write deploy key
        shell: bash
        env:
          PRODUCTION_ARTIFACT_WRITE_DEPLOY_KEY: ${{ secrets.PRODUCTION_ARTIFACT_WRITE_DEPLOY_KEY }}
        run: |
          if [ -z "${PRODUCTION_ARTIFACT_WRITE_DEPLOY_KEY}" ]; then
            echo "::error::PRODUCTION_ARTIFACT_WRITE_DEPLOY_KEY is required for artifact publishing."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ssh-key: ${{ secrets.PRODUCTION_ARTIFACT_WRITE_DEPLOY_KEY }}
          persist-credentials: true
          ref: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Validate repo production inventory
        run: |
          python scripts/validate_repo_production_inventory.py

      - name: Validate Apps Script workflow triggers
        run: |
          python scripts/validate_apps_script_workflow_triggers.py

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests tabulate matplotlib pillow openpyxl lxml html5lib beautifulsoup4 reportlab pypdf

      - name: Build individual stock packets and windows
        run: |
          python scripts/validate_tdcc_dataset_manifest.py
          python scripts/build_individual_stock_chatgpt_packets.py
          python scripts/build_individual_stock_raw_data_index.py
          python scripts/validate_individual_stock_outputs.py --all

      - name: Write individual stock refresh run status
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          tdcc_validation_path = Path(
              "output/latest/tdcc_weekly_candidate_report_validation_latest.json"
          )
          tdcc_dataset_manifest_path = Path(
              "output/latest/tdcc_dataset_manifest_latest.json"
          )
          tdcc_validation = json.loads(tdcc_validation_path.read_text(encoding="utf-8"))
          tdcc_dataset_manifest = json.loads(
              tdcc_dataset_manifest_path.read_text(encoding="utf-8")
          )
          date_contract = tdcc_validation.get("date_contract") or {}
          signal_date = str(tdcc_dataset_manifest.get("signal_date") or "")
          validation_signal_date = str(tdcc_validation.get("signal_date") or "")
          dataset_id = str(tdcc_dataset_manifest.get("dataset_id") or "")
          expected_date_source = "report_ready_csv_signal_date"
          if tdcc_validation.get("status") != "pass":
              raise SystemExit("TDCC validation status must be pass before writing refresh run status")
          if date_contract.get("date_source") != expected_date_source:
              raise SystemExit(
                  "TDCC validation date_source mismatch: "
                  f"expected={expected_date_source} actual={date_contract.get('date_source')}"
              )
          if len(signal_date) != 8 or not signal_date.isdigit():
              raise SystemExit(f"Invalid official TDCC signal_date: {signal_date!r}")
          if tdcc_dataset_manifest.get("status") != "pass":
              raise SystemExit("TDCC dataset manifest status must be pass before writing refresh run status")
          if validation_signal_date != signal_date:
              raise SystemExit(
                  "TDCC dataset/candidate signal_date mismatch: "
                  f"dataset={signal_date} candidate={validation_signal_date}"
              )
          if not dataset_id.startswith(f"tdcc-{signal_date}-"):
              raise SystemExit(f"Invalid canonical TDCC dataset_id: {dataset_id!r}")

          payload = {
              "status": "pass",
              "workflow": "individual_stock_data_refresh.yml",
              "github_run_id": os.environ["GITHUB_RUN_ID"],
              "github_run_url": (
                  f"https://github.com/{os.environ['GITHUB_REPOSITORY']}"
                  f"/actions/runs/{os.environ['GITHUB_RUN_ID']}"
              ),
              "github_head_sha": os.environ["GITHUB_SHA"],
              "github_ref_name": os.environ["GITHUB_REF_NAME"],
              "official_signal_date": signal_date,
              "source_tdcc_dataset_id": dataset_id,
              "date_contract": {
                  "date_source": expected_date_source,
                  "tdcc_validation_path": tdcc_validation_path.as_posix(),
                  "tdcc_dataset_manifest_path": tdcc_dataset_manifest_path.as_posix(),
              },
              "generated_at": datetime.now(ZoneInfo("Asia/Taipei")).isoformat(),
          }
          content = json.dumps(payload, ensure_ascii=False, indent=2) + "\n"
          output_path = Path(
              "output/latest/individual_stock_reports/individual_stock_refresh_run_status_latest.json"
          )
          docs_path = Path(
              "docs/latest/individual_stock_reports/individual_stock_refresh_run_status_latest.json"
          )
          output_path.parent.mkdir(parents=True, exist_ok=True)
          docs_path.parent.mkdir(parents=True, exist_ok=True)
          output_path.write_text(content, encoding="utf-8")
          docs_path.write_text(content, encoding="utf-8")
          print(
              "individual_refresh_run_status="
              f"run_id={payload['github_run_id']} "
              f"head_sha={payload['github_head_sha']} "
              f"signal_date={payload['official_signal_date']} "
              f"dataset_id={payload['source_tdcc_dataset_id']}"
          )
          PY

      - name: Commit individual stock refresh outputs
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git pull --rebase --autostash origin "$TARGET_BRANCH" || true

          git add output/latest/individual_stock_reports/ || true
          git add docs/latest/individual_stock_reports/ || true

          git status --short
          git commit -m "Refresh individual stock data packets" || echo "No changes to commit"

          bash scripts/ci_push_with_retry.sh "$TARGET_BRANCH" 5
