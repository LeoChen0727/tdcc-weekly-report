name: TDCC Weekly Report

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-tdcc-weekly:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests lxml html5lib tabulate

      - name: Run TDCC weekly report
        run: python tdcc_holder_ratio_top10.py

      - name: Run TDCC signal tracker
        run: python tdcc_signal_tracker.py

      - name: Commit TDCC outputs
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add output/ data/ || true
          git status --short
          git commit -m "Update TDCC weekly report and signal tracker" || echo "No changes to commit"
          git push
