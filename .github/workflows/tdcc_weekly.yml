name: TDCC Weekly Report

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-tdcc-weekly:
    runs-on: ubuntu-latest

    steps:
      - name: Require production artifact write deploy key
        shell: bash
        env:
          PRODUCTION_ARTIFACT_WRITE_DEPLOY_KEY: ${{ secrets.PRODUCTION_ARTIFACT_WRITE_DEPLOY_KEY }}
        run: |
          if [ -z "${PRODUCTION_ARTIFACT_WRITE_DEPLOY_KEY}" ]; then
            echo "::error::PRODUCTION_ARTIFACT_WRITE_DEPLOY_KEY is required for artifact publishing."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ssh-key: ${{ secrets.PRODUCTION_ARTIFACT_WRITE_DEPLOY_KEY }}
          persist-credentials: true
          ref: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Validate repo production inventory
        run: |
          python scripts/validate_repo_production_inventory.py

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests tabulate matplotlib reportlab pypdf

      - name: Run TDCC weekly report
        run: |
          python tdcc_holder_ratio_top10.py

      - name: Run TDCC signal tracker
        run: |
          python tdcc_signal_tracker.py

      - name: Build TDCC normalized signal structures
        run: |
          python scripts/build_tdcc_signal_structures.py --max-dates 8 --price-metrics-limit 500

      - name: Build TDCC overheated short-term edge
        run: |
          python scripts/build_tdcc_overheated_short_term_edge.py

      - name: Build per-stock TDCC history
        run: |
          python scripts/build_tdcc_stock_history.py

      - name: Build TDCC pre-move accumulation report
        run: |
          python scripts/build_tdcc_pre_move_accumulation.py

      - name: Build TDCC ChatGPT tracking outputs
        run: |
          python scripts/build_tdcc_chatgpt_tracking_outputs.py

      - name: Build TDCC weekly candidate reports
        run: |
          python scripts/build_tdcc_weekly_candidate_reports.py

      - name: Validate TDCC report contract consumers
        run: |
          python scripts/validate_tdcc_report_contract_consumers.py

      - name: Validate TDCC weekly candidate reports
        run: |
          python scripts/validate_tdcc_weekly_candidate_reports.py

      - name: Validate TDCC ChatGPT tracking outputs
        run: |
          python scripts/validate_tdcc_chatgpt_tracking_outputs.py

      - name: Validate TDCC PDF-facing display text
        run: |
          python scripts/validate_pdf_facing_display_text.py

      - name: Validate TDCC weekly PDF font contract
        run: |
          python scripts/validate_tdcc_weekly_pdf_font_contract.py

      - name: Write TDCC weekly run status
        run: |
          mkdir -p output/latest

          RUN_TIME="$(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M:%S Asia/Taipei')"
          COMMIT_SHA="${GITHUB_SHA}"
          RUN_URL="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          {
            echo "# TDCC Weekly Run Status"
            echo ""
            echo "- generated_at: \`${RUN_TIME}\`"
            echo "- github_run: ${RUN_URL}"
            echo "- commit: \`${COMMIT_SHA}\`"
            echo ""
            echo "## Outputs"
            echo ""
            echo "| file | exists | lines |"
            echo "|---|---:|---:|"
            for file in \
              output/latest/tdcc_weekly_report_latest.md \
              output/latest/tdcc_holder_ratio_latest.csv \
              output/latest/tdcc_invalid_holder_distribution_latest.csv \
              output/latest/tdcc_signal_performance_latest.md \
              output/latest/tdcc_signal_structures_latest.md \
              output/latest/tdcc_stock_history_manifest.csv \
              output/latest/tdcc_history_backfill_manifest_latest.md \
              output/latest/tdcc_pre_move_accumulation_latest.md \
              output/latest/tdcc_signal_effectiveness_latest.md \
              output/latest/tdcc_strength_ranking_top_latest.md \
              output/latest/tdcc_strength_ranking_top_latest.csv \
              output/latest/tdcc_pre_move_abm_top_latest.md \
              output/latest/tdcc_pre_move_abm_top_latest.csv \
              output/latest/tdcc_phase_distribution_latest.md \
              output/latest/tdcc_phase_distribution_latest.csv \
              output/latest/tdcc_top_risk_list_latest.md \
              output/latest/tdcc_top_risk_list_latest.csv \
              output/latest/tdcc_overheated_short_term_edge_latest.md \
              output/latest/tdcc_overheated_short_term_edge_latest.csv \
              output/latest/tdcc_overheated_short_term_edge_candidates_latest.csv \
              output/latest/tdcc_chatgpt_tracking_packet_latest.md \
              output/latest/tdcc_weekly_increase_ranking_latest.md \
              output/latest/tdcc_weekly_increase_ranking_latest.csv \
              output/latest/tdcc_consecutive_accumulation_ranking_latest.md \
              output/latest/tdcc_consecutive_accumulation_ranking_latest.csv \
              output/latest/tdcc_weekly_model_cross_summary_latest.md \
              output/latest/tdcc_weekly_model_cross_summary_latest.csv \
              output/latest/tdcc_weekly_report_section_manifest_latest.csv \
              output/latest/tdcc_weekly_candidate_highlight_for_report_latest.md \
              output/latest/tdcc_weekly_candidate_highlight_for_report_latest.csv \
              output/latest/tdcc_weekly_candidate_full_for_report_latest.md \
              output/latest/tdcc_weekly_candidate_full_for_report_latest.csv \
              output/latest/tdcc_weekly_candidate_highlight_latest.md \
              output/latest/tdcc_weekly_candidate_full_latest.md \
              output/latest/tdcc_weekly_candidate_highlight_latest.pdf \
              output/latest/tdcc_weekly_candidate_full_latest.pdf \
              output/latest/published_reports/tdcc_weekly/TDCC大戶籌碼週報_*.pdf \
              output/latest/tdcc_weekly_candidate_report_validation_latest.md \
              output/latest/tdcc_weekly_candidate_report_validation_latest.json \
              output/latest/tdcc_chatgpt_tracking_validation_latest.md \
              output/latest/tdcc_chatgpt_tracking_validation_latest.json \
              output/history/tdcc_signals/tdcc_signal_log.csv \
              output/history/tdcc_signals/tdcc_signal_performance.csv \
              output/history/tdcc_signals/tdcc_signal_snapshot.csv \
              output/history/tdcc_signals/tdcc_normalized_signal_log.csv \
              output/history/tdcc_signals/theme_breadth_history.csv \
              output/history/tdcc_signals/tdcc_pre_move_accumulation_history.csv \
              output/history/tdcc_signals/tdcc_signal_factor_stats_monthly.csv
            do
              if [ -f "$file" ]; then
                lines=$(wc -l < "$file" | tr -d ' ')
                echo "| \`$file\` | yes | $lines |"
              else
                echo "| \`$file\` | no | - |"
              fi
            done
            echo ""
            echo "## Notes"
            echo ""
            echo "- Normalized signal files dedupe by one stock per TDCC week."
            echo "- ABM ranking is separated from TDCC strength ranking."
            echo "- TDCC performance/effectiveness backtests are maintained by research_backtest_pipeline.yml."
            echo "- Pending D+N performance is not treated as positive or negative."
          } > output/latest/tdcc_weekly_run_status.md

      - name: Sync TDCC Pages artifacts
        run: |
          mkdir -p docs/latest
          shopt -s nullglob
          for file in output/latest/tdcc_* output/latest/published_reports/tdcc_weekly/TDCC大戶籌碼週報_*.pdf; do
            if [ "$(basename "$file")" = "tdcc_trend_debug_latest.csv" ]; then
              continue
            fi
            if [ -f "$file" ]; then
              rel="${file#output/latest/}"
              mkdir -p "docs/latest/$(dirname "$rel")"
              cp "$file" "docs/latest/$rel"
            fi
          done

      - name: Validate TDCC Pages sync
        run: |
          python - <<'PY'
          from pathlib import Path

          output_dir = Path("output/latest")
          docs_dir = Path("docs/latest")
          mismatches = []
          src_files = [
              *sorted(output_dir.glob("tdcc_*")),
              *sorted((output_dir / "published_reports" / "tdcc_weekly").glob("TDCC大戶籌碼週報_*.pdf")),
          ]
          for src in src_files:
              if not src.is_file():
                  continue
              if src.name == "tdcc_trend_debug_latest.csv":
                  continue
              try:
                  dst = docs_dir / src.relative_to(output_dir)
              except ValueError:
                  dst = docs_dir / src.name
              if not dst.exists():
                  mismatches.append(f"missing docs/latest/{src.name}")
                  continue
              if src.read_bytes() != dst.read_bytes():
                  mismatches.append(f"content mismatch: {src.name}")

          if mismatches:
              raise SystemExit("TDCC Pages sync failed:\n" + "\n".join(mismatches))

          print(f"TDCC Pages sync verified for {len(src_files)} artifacts.")
          PY

      - name: Commit TDCC outputs
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add data/tdcc_stock_history/ data/tdcc_stock_history_raw/ || true
          git add output/latest/tdcc_* output/latest/published_reports/tdcc_weekly/TDCC大戶籌碼週報_*.pdf output/history/tdcc_signals/ output/history/tdcc/ || true
          git add docs/latest/tdcc_* docs/latest/published_reports/tdcc_weekly/TDCC大戶籌碼週報_*.pdf docs/tdcc_signal_tracking.md docs/tdcc_pre_move_accumulation.md || true
          git status --short
          git commit -m "Update TDCC weekly report, ABM, and signal effectiveness" || echo "No changes to commit"
          git push
