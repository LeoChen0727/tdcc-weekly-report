name: TDCC Weekly Report

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 0"  # Taiwan time Sunday 12:17

permissions:
  contents: write

jobs:
  run-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests lxml html5lib

      - name: Run script
        run: |
          python tdcc_holder_ratio_top10.py

      - name: Commit output files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output || true
          git diff --cached --quiet && echo "No changes to commit." || git commit -m "Update TDCC report"
          git push || true
