name: TDCC Weekly Report

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-tdcc-weekly:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests lxml html5lib tabulate

      - name: Run TDCC weekly report
        run: |
          python tdcc_holder_ratio_top10.py

      - name: Run TDCC signal tracker
        run: |
          python tdcc_signal_tracker.py

      - name: Build TDCC normalized signal structures
        run: |
          python scripts/build_tdcc_signal_structures.py

      - name: Build per-stock TDCC history
        run: |
          python scripts/build_tdcc_stock_history.py

      - name: Build TDCC pre-move accumulation report
        run: |
          python scripts/build_tdcc_pre_move_accumulation.py

      - name: Update normalized TDCC signal performance
        run: |
          python scripts/update_tdcc_normalized_signal_performance.py

      - name: Build TDCC signal effectiveness report
        run: |
          python scripts/build_tdcc_signal_effectiveness_report.py

      - name: Build TDCC ChatGPT tracking outputs
        run: |
          python scripts/build_tdcc_chatgpt_tracking_outputs.py

      - name: Write TDCC weekly run status
        run: |
          mkdir -p output/latest

          RUN_TIME="$(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M:%S Asia/Taipei')"
          COMMIT_SHA="${GITHUB_SHA}"
          RUN_URL="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          {
            echo "# TDCC Weekly Run Status"
            echo ""
            echo "- generated_at: \`${RUN_TIME}\`"
            echo "- github_run: ${RUN_URL}"
            echo "- commit: \`${COMMIT_SHA}\`"
            echo ""
            echo "## Outputs"
            echo ""
            echo "| file | exists | lines |"
            echo "|---|---:|---:|"
            for file in \
              output/latest/tdcc_weekly_report_latest.md \
              output/latest/tdcc_holder_ratio_latest.csv \
              output/latest/tdcc_signal_performance_latest.md \
              output/latest/tdcc_signal_structures_latest.md \
              output/latest/tdcc_stock_history_manifest.csv \
              output/latest/tdcc_history_backfill_manifest_latest.md \
              output/latest/tdcc_pre_move_accumulation_latest.md \
              output/latest/tdcc_signal_effectiveness_latest.md \
              output/latest/tdcc_strength_ranking_top_latest.md \
              output/latest/tdcc_strength_ranking_top_latest.csv \
              output/latest/tdcc_pre_move_abm_top_latest.md \
              output/latest/tdcc_pre_move_abm_top_latest.csv \
              output/latest/tdcc_phase_distribution_latest.md \
              output/latest/tdcc_phase_distribution_latest.csv \
              output/latest/tdcc_chatgpt_tracking_packet_latest.md \
              output/history/tdcc_signals/tdcc_signal_log.csv \
              output/history/tdcc_signals/tdcc_signal_performance.csv \
              output/history/tdcc_signals/tdcc_signal_snapshot.csv \
              output/history/tdcc_signals/tdcc_normalized_signal_log.csv \
              output/history/tdcc_signals/theme_breadth_history.csv \
              output/history/tdcc_signals/tdcc_pre_move_accumulation_history.csv \
              output/history/tdcc_signals/tdcc_signal_factor_stats_monthly.csv
            do
              if [ -f "$file" ]; then
                lines=$(wc -l < "$file" | tr -d ' ')
                echo "| \`$file\` | yes | $lines |"
              else
                echo "| \`$file\` | no | - |"
              fi
            done
            echo ""
            echo "## Notes"
            echo ""
            echo "- Normalized signal files dedupe by one stock per TDCC week."
            echo "- ABM ranking is separated from TDCC strength ranking."
            echo "- Pending D+N performance is not treated as positive or negative."
          } > output/latest/tdcc_weekly_run_status.md

      - name: Commit TDCC outputs
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add output/ data/ config/stock_theme_map.csv docs/tdcc_signal_tracking.md docs/tdcc_pre_move_accumulation.md || true
          git add scripts/tracking_utils.py scripts/build_tdcc_signal_structures.py scripts/build_tdcc_stock_history.py scripts/tdcc_stock_history_utils.py scripts/build_tdcc_pre_move_accumulation.py scripts/build_tdcc_signal_effectiveness_report.py scripts/build_tdcc_chatgpt_tracking_outputs.py scripts/update_tdcc_normalized_signal_performance.py scripts/backfill_tdcc_history.py || true
          git status --short
          git commit -m "Update TDCC weekly report, ABM, and signal effectiveness" || echo "No changes to commit"
          git push
