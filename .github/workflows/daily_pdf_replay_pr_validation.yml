name: Daily PDF Replay PR Validation

on:
  pull_request:
    paths:
      - "config/daily_pdf_rendered_model_regression_contract.csv"
      - "config/daily_pdf_semantic_golden_cases.csv"
      - "scripts/generate_chatgpt_side_daily_reports.py"
      - "scripts/validate_chatgpt_side_pdf_contract.py"
      - "output/latest/approved_operation_patterns_latest.csv"
      - "output/latest/daily_neckline_volume_breakout_confirmation_operation_section_latest.csv"
      - "output/latest/daily_price_pullback_23ema_operation_section_latest.csv"
      - "output/latest/daily_volume_breakout_operation_section_latest.csv"
      - "output/latest/daily_w_bottom_right_side_operation_section_latest.csv"
      - "output/latest/model_operation_readiness_latest.csv"
  # This automatic path set is limited to renderer/font runtime and formal
  # operation-model PDF inputs. Producer-only, validation-only, general daily
  # pipeline, docs-mirror, and routine generated-state changes stay on Ubuntu
  # validation or their owning workflow. Dispatch this replay explicitly when
  # one of those changes also alters the rendered PDF runtime or presentation.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-pdf-replay-pr-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  daily-pdf-replay-contract-validation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install contract-test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests tabulate matplotlib pillow openpyxl lxml html5lib beautifulsoup4 reportlab pypdf pytest fonttools

      - name: Validate PDF replay workflow contracts
        run: |
          python scripts/validate_repo_production_inventory.py
          python scripts/validate_daily_production_boundaries.py
          python scripts/validate_chatgpt_side_pdf_contract.py
          python scripts/validate_daily_pdf_contract_consumers.py
          python scripts/validate_daily_pdf_shared_path_isolation.py
          python scripts/validate_daily_pdf_completion_hard_gate.py

      - name: Run PDF replay workflow tests
        run: |
          pytest -q \
            tests/test_daily_model_maintenance_pr_validation_workflow.py \
            tests/test_daily_production_boundaries.py

  daily-pdf-dfkai-replay:
    needs: daily-pdf-replay-contract-validation
    runs-on: windows-2025

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install PDF replay dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests tabulate matplotlib pillow openpyxl lxml html5lib beautifulsoup4 reportlab pypdf pytest fonttools

      - name: Install and validate DFKai-SB
        timeout-minutes: 20
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $false
          $fontCapability = "Language.Fonts.Hant~~~und-HANT~0.0.1.0"
          $fontPath = "C:\Windows\Fonts\kaiu.ttf"
          $dismExitCode = 0
          if (-not (Test-Path -LiteralPath $fontPath)) {
            $windowsUpdatePolicy = "HKLM:\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate"
            $windowsUpdateAuPolicy = "$windowsUpdatePolicy\AU"
            New-Item -Path $windowsUpdateAuPolicy -Force | Out-Null
            New-ItemProperty -Path $windowsUpdatePolicy -Name DoNotConnectToWindowsUpdateInternetLocations -PropertyType DWord -Value 0 -Force | Out-Null
            New-ItemProperty -Path $windowsUpdatePolicy -Name DisableWindowsUpdateAccess -PropertyType DWord -Value 0 -Force | Out-Null
            New-ItemProperty -Path $windowsUpdateAuPolicy -Name UseWUServer -PropertyType DWord -Value 0 -Force | Out-Null
            Set-Service -Name wuauserv -StartupType Manual
            Start-Service -Name wuauserv
            $capability = Get-WindowsCapability -Online -Name $fontCapability
            Write-Host "font_capability_state_before=$($capability.State)"
            if ($capability.State -ne "Installed") {
              & "$env:SystemRoot\System32\dism.exe" /Online /Add-Capability "/CapabilityName:$fontCapability" /NoRestart
              $dismExitCode = $LASTEXITCODE
              Write-Host "font_capability_install_exit_code=$dismExitCode"
            }
          }
          if (-not (Test-Path -LiteralPath $fontPath)) {
            throw "Required DFKai-SB font file is missing after capability install: $fontPath (DISM exit code $dismExitCode)"
          }
          "CHATGPT_DAILY_DFKAI_FONT_PATH=$fontPath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          python -c 'from fontTools.ttLib import TTFont; p=r"C:\Windows\Fonts\kaiu.ttf"; f=TTFont(p); names={n.toUnicode() for n in f["name"].names}; accepted={"DFKai-SB","DFKaiShu-SB-Estd-BF"}; assert names & accepted, f"unexpected font names: {sorted(names)}"; cmap={cp for table in f["cmap"].tables for cp in table.cmap}; canary="\u6a19\u6977\u9ad4\u7e41\u9ad4\u4e2d\u6587\u6e2c\u8a66"; missing=[f"U+{ord(char):04X}" for char in canary if ord(char) not in cmap]; assert not missing, f"missing canary glyphs: {missing}"; print(f"validated_font={p} names={sorted(names & accepted)}")'
          $fontValidationExitCode = $LASTEXITCODE
          if ($fontValidationExitCode -ne 0) {
            throw "DFKai-SB final font validation failed with exit code $fontValidationExitCode (DISM exit code $dismExitCode)"
          }
          if ($dismExitCode -ne 0) {
            Write-Warning "DISM returned exit code $dismExitCode, but canonical DFKai-SB passed final file, identity, and glyph validation"
          }

      - name: Prepare Windows long-path PDF replay runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          git config --global core.longpaths true
          $shortTemp = "C:\tdcc-pdf-temp"
          New-Item -ItemType Directory -Path $shortTemp -Force | Out-Null
          "TEMP=$shortTemp" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "TMP=$shortTemp" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "TMPDIR=$shortTemp" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Replay ChatGPT-side daily PDF new conversation
        timeout-minutes: 20
        shell: bash
        env:
          PDF_REPLAY_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          checkout_sha="$(git rev-parse HEAD)"
          if [ "$checkout_sha" != "$GITHUB_SHA" ]; then
            echo "ERROR: checked-out HEAD does not match workflow checkout SHA: head=$checkout_sha workflow=$GITHUB_SHA" >&2
            exit 1
          fi

          source_sha="$PDF_REPLAY_SOURCE_SHA"
          git fetch --no-tags --depth=1 origin "$source_sha"
          fetched_source_sha="$(git rev-parse FETCH_HEAD)"
          if [ "$fetched_source_sha" != "$source_sha" ]; then
            echo "ERROR: immutable PDF replay source fetch drifted: expected=$source_sha fetched=$fetched_source_sha" >&2
            exit 1
          fi

          pinned_remote="pinned-replay"
          pinned_branch="workflow-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git branch --force "$pinned_branch" "$source_sha"
          git remote remove "$pinned_remote" 2>/dev/null || true
          git remote add "$pinned_remote" "$PWD"
          git fetch "$pinned_remote" "$pinned_branch"
          source_ref="$pinned_remote/$pinned_branch"
          resolved_source_sha="$(git rev-parse "$source_ref")"
          if [ "$resolved_source_sha" != "$source_sha" ]; then
            echo "ERROR: pinned PDF replay ref drifted: expected=$source_sha resolved=$resolved_source_sha" >&2
            exit 1
          fi

          echo "PDF replay workflow_checkout_sha=$GITHUB_SHA"
          echo "PDF replay source_ref=$source_ref"
          echo "PDF replay source_sha=$source_sha"
          echo "PDF replay output_dir=chatgpt_side_outputs_pr_validation"
          timeout 20m python scripts/validate_chatgpt_daily_report_new_conversation_replay.py \
            --source-ref "$source_ref" \
            --output-dir chatgpt_side_outputs_pr_validation
          python scripts/validate_daily_pdf_completion_hard_gate.py --require-output-dir chatgpt_side_outputs_pr_validation

      - name: Upload PR daily PDF replay evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-pdf-replay-pr-validation
          path: |
            chatgpt_side_outputs_pr_validation/*.pdf
            chatgpt_side_outputs_pr_validation/chatgpt_daily_report_runtime_manifest.json
            chatgpt_side_outputs_pr_validation/chatgpt_daily_pdf_semantic_manifest.csv
          if-no-files-found: error
