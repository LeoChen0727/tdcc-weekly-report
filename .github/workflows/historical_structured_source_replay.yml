name: Historical Structured Source Replay

on:
  workflow_call:
    inputs:
      start_date:
        description: "First missing trading date in YYYYMMDD"
        required: true
        type: string
      end_date:
        description: "Last missing trading date in YYYYMMDD"
        required: true
        type: string
      price_history_high_water_date:
        description: "Existing raw daily-price and stock-history high-water date to preserve"
        required: true
        type: string
      repair_market_index_base_date:
        description: "Optional TPEX-only market-index base repair date in YYYYMMDD"
        required: false
        default: ""
        type: string
      expected_main_sha:
        description: "Exact 40-character main SHA authorized for this replay"
        required: true
        type: string
    outputs:
      domain_output_commit_sha:
        value: ${{ jobs.replay-historical-structured-sources.outputs.domain_output_commit_sha }}
      published_head_sha:
        value: ${{ jobs.replay-historical-structured-sources.outputs.published_head_sha }}
    secrets:
      PRODUCTION_ARTIFACT_WRITE_DEPLOY_KEY:
        required: true
  workflow_dispatch:
    inputs:
      start_date:
        description: "First missing trading date in YYYYMMDD"
        required: true
        default: "20260720"
        type: string
      end_date:
        description: "Last missing trading date in YYYYMMDD"
        required: true
        default: "20260724"
        type: string
      price_history_high_water_date:
        description: "Existing raw daily-price and stock-history high-water date to preserve; empty keeps legacy replay writes"
        required: false
        default: ""
        type: string
      repair_market_index_base_date:
        description: "Optional TPEX-only market-index base repair date in YYYYMMDD; leave empty for a contiguous replay"
        required: false
        default: ""
        type: string
      expected_main_sha:
        description: "Exact 40-character merged main SHA authorized for this replay"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: historical-structured-source-replay-${{ github.ref }}
  cancel-in-progress: false

jobs:
  replay-historical-structured-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      domain_output_commit_sha: ${{ steps.publish_replay.outputs.domain_output_commit_sha }}
      published_head_sha: ${{ steps.publish_replay.outputs.published_head_sha }}
    env:
      START_DATE: ${{ inputs.start_date }}
      END_DATE: ${{ inputs.end_date }}
      PRICE_HISTORY_HIGH_WATER_DATE: ${{ inputs.price_history_high_water_date }}
      BASE_REPAIR_DATE: ${{ inputs.repair_market_index_base_date }}
      EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
      HISTORICAL_SOURCE_REPLAY_ID: github-run-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Reject non-main production dispatch
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Historical Structured Source Replay is production-only on refs/heads/main."
          exit 1

      - name: Require production artifact write deploy key
        shell: bash
        env:
          PRODUCTION_ARTIFACT_WRITE_DEPLOY_KEY: ${{ secrets.PRODUCTION_ARTIFACT_WRITE_DEPLOY_KEY }}
        run: |
          if [ -z "${PRODUCTION_ARTIFACT_WRITE_DEPLOY_KEY}" ]; then
            echo "::error::PRODUCTION_ARTIFACT_WRITE_DEPLOY_KEY is required for artifact publishing."
            exit 1
          fi

      - name: Checkout exact main source
        uses: actions/checkout@v6
        with:
          ssh-key: ${{ secrets.PRODUCTION_ARTIFACT_WRITE_DEPLOY_KEY }}
          persist-credentials: true
          ref: ${{ inputs.expected_main_sha }}
          fetch-depth: 0

      - name: Capture immutable main replay base
        shell: bash
        run: |
          base_sha="$(git rev-parse HEAD)"
          git fetch origin main
          remote_main_sha="$(git rev-parse origin/main)"
          if [[ ! "$EXPECTED_MAIN_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::expected_main_sha must be an exact 40-character Git SHA."
            exit 1
          fi
          if [ "$base_sha" != "$EXPECTED_MAIN_SHA" ] || \
             ! git merge-base --is-ancestor "$base_sha" "$remote_main_sha"; then
            echo "::error::Checked-out replay base must equal expected_main_sha and remain a current-main ancestor."
            exit 1
          fi
          echo "REPLAY_BASE_SHA=$base_sha" >> "$GITHUB_ENV"
          echo "REMOTE_MAIN_SHA_BEFORE=$remote_main_sha" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install replay dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests lxml html5lib beautifulsoup4 openpyxl tabulate

      - name: Replay structured objective sources in ascending order
        shell: bash
        run: |
          python scripts/replay_historical_structured_sources.py \
            --start-date "$START_DATE" \
            --end-date "$END_DATE" \
            --price-history-high-water-date "$PRICE_HISTORY_HIGH_WATER_DATE" \
            --repair-market-index-base-date "$BASE_REPAIR_DATE" \
            --replay-id "$HISTORICAL_SOURCE_REPLAY_ID"

      - name: Validate final replay artifacts and target-slice parity
        shell: bash
        run: |
          python scripts/validate_historical_structured_source_replay.py \
            --start-date "$START_DATE" \
            --end-date "$END_DATE" \
            --price-history-high-water-date "$PRICE_HISTORY_HIGH_WATER_DATE" \
            --repair-market-index-base-date "$BASE_REPAIR_DATE" \
            --replay-id "$HISTORICAL_SOURCE_REPLAY_ID" \
            --expected-pipeline-sha "$REPLAY_BASE_SHA"

      - name: Stage exact structured-source artifact families
        shell: bash
        run: |
          if [ -z "$PRICE_HISTORY_HIGH_WATER_DATE" ]; then
            git add data/daily_price/
            git add data/stock_price_history/
          fi
          git add data/market_index_history.csv data/market_index_ohlc_history.csv
          git add data/futures_options/
          git add output/history/warrant_daily/
          git add output/history/warrant_flow/
          git add "output/history/historical_source_replay/$HISTORICAL_SOURCE_REPLAY_ID/"
          git add output/latest/official_daily_price_latest.csv
          git add output/latest/official_price_fetch_latest.json output/latest/official_price_fetch_latest.md
          git add output/latest/market_index_source_status_latest.json output/latest/market_index_source_status_latest.md
          git add output/latest/market_benchmark_latest.csv
          git add output/latest/futures_options_*.csv output/latest/futures_options_*.json output/latest/futures_options_*.md
          git add output/latest/taiwan_vix_latest.csv
          git add output/latest/warrant_daily_raw_latest.csv
          git add output/latest/warrant_daily_fetch_latest.md
          git add output/latest/warrant_source_status_latest.json output/latest/warrant_source_status_latest.md
          git add output/latest/warrant_flow_latest.csv output/latest/warrant_flow_latest.md
          if [ -z "$PRICE_HISTORY_HIGH_WATER_DATE" ]; then
            git add output/latest/stock_price_history_manifest.csv output/latest/stock_price_history_manifest.json output/latest/stock_price_history_manifest.md
          fi
          git add output/latest/daily_price_history_continuity_latest.json output/latest/daily_price_history_continuity_latest.md
          git add output/latest/historical_structured_source_replay_latest.json output/latest/historical_structured_source_replay_latest.md
          git add output/debug/warrant_fetch_debug_latest.csv output/debug/warrant_fetch_debug_latest.md
          if [ -z "$PRICE_HISTORY_HIGH_WATER_DATE" ]; then
            git add docs/latest/stock_price_history_manifest.csv docs/latest/stock_price_history_manifest.json docs/latest/stock_price_history_manifest.md
          fi
          git add output/latest/data_freshness_latest.csv output/latest/data_freshness_latest.md
          python scripts/validate_historical_source_replay_staged_paths.py \
            --price-history-high-water-date "$PRICE_HISTORY_HIGH_WATER_DATE"
          if git diff --cached --quiet; then
            echo "::error::Historical replay produced no staged artifact changes."
            exit 1
          fi

      - name: Validate moving-main path isolation before the domain output commit
        shell: bash
        run: |
          staged_paths_file="$RUNNER_TEMP/historical-replay-staged-paths.z"
          git diff --cached --name-only --no-renames -z > "$staged_paths_file"
          git fetch origin main
          remote_main_sha="$(git rev-parse origin/main)"
          if ! git merge-base --is-ancestor "$REPLAY_BASE_SHA" "$remote_main_sha"; then
            echo "::error::Current main is not a descendant of the pinned replay base."
            exit 1
          fi
          python - "$REPLAY_BASE_SHA" "$remote_main_sha" "$staged_paths_file" <<'PY'
          import subprocess
          import sys
          from pathlib import Path

          changed = {
              item.decode("utf-8", errors="strict")
              for item in subprocess.check_output(
                  ["git", "diff", "--name-only", "--no-renames", "-z", sys.argv[1], sys.argv[2], "--"]
              ).split(b"\0")
              if item
          }
          staged = {
              item.decode("utf-8", errors="strict")
              for item in Path(sys.argv[3]).read_bytes().split(b"\0")
              if item
          }
          overlap = sorted(changed & staged)
          if overlap:
              raise SystemExit(
                  "moving main overlaps staged historical replay paths: "
                  + ",".join(overlap)
              )
          PY
          echo "REMOTE_MAIN_SHA_PRECOMMIT=$remote_main_sha" >> "$GITHUB_ENV"

      - name: Create and push exactly one replay output commit
        id: publish_replay
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          head_before_commit="$(git rev-parse HEAD)"
          if [ "$head_before_commit" != "$REPLAY_BASE_SHA" ]; then
            echo "::error::Replay HEAD changed before the only output commit."
            exit 1
          fi
          commit_count_before="$(git rev-list --count HEAD)"
          git commit -m "Replay historical structured sources $START_DATE-$END_DATE"
          commit_count_after="$(git rev-list --count HEAD)"
          if [ "$((commit_count_after - commit_count_before))" -ne 1 ]; then
            echo "::error::Historical replay must create exactly one output commit."
            exit 1
          fi
          replay_commit_count="$(git rev-list --count "$REPLAY_BASE_SHA..HEAD")"
          if [ "$replay_commit_count" -ne 1 ]; then
            echo "::error::Historical replay output must be exactly one commit above REPLAY_BASE_SHA."
            exit 1
          fi
          output_commit_sha="$(git rev-parse HEAD)"
          echo "OUTPUT_COMMIT_SHA=$output_commit_sha" >> "$GITHUB_ENV"
          published=false
          published_head_sha=""
          candidate_published_head_sha=""
          staged_paths_file="$RUNNER_TEMP/historical-replay-staged-paths.z"
          fetch_main_bounded() {
            for fetch_attempt in 1 2 3; do
              if git fetch origin main && \
                 remote_main_sha="$(git rev-parse origin/main)" && \
                 [[ "$remote_main_sha" =~ ^[0-9a-f]{40}$ ]]; then
                return 0
              fi
              sleep 5
            done
            return 1
          }
          for push_attempt in 1 2 3; do
            if ! fetch_main_bounded; then
              continue
            fi
            if [[ "$candidate_published_head_sha" =~ ^[0-9a-f]{40}$ ]] && \
               git merge-base --is-ancestor "$output_commit_sha" "$candidate_published_head_sha" && \
               git merge-base --is-ancestor "$candidate_published_head_sha" "$remote_main_sha"; then
              published=true
              published_head_sha="$candidate_published_head_sha"
              break
            fi
            if ! git merge-base --is-ancestor "$REPLAY_BASE_SHA" "$remote_main_sha"; then
              echo "::error::Current main is not a descendant of the pinned replay base."
              exit 1
            fi
            comparison_base="$REPLAY_BASE_SHA"
            if git merge-base --is-ancestor "$output_commit_sha" "$remote_main_sha"; then
              comparison_base="$output_commit_sha"
            fi
            python - "$comparison_base" "$remote_main_sha" "$staged_paths_file" <<'PY'
          import subprocess
          import sys
          from pathlib import Path

          changed = {
              item.decode("utf-8", errors="strict")
              for item in subprocess.check_output(
                  ["git", "diff", "--name-only", "--no-renames", "-z", sys.argv[1], sys.argv[2], "--"]
              ).split(b"\0")
              if item
          }
          staged = {
              item.decode("utf-8", errors="strict")
              for item in Path(sys.argv[3]).read_bytes().split(b"\0")
              if item
          }
          overlap = sorted(changed & staged)
          if overlap:
              raise SystemExit(
                  "moving main overlaps staged historical replay paths: "
                  + ",".join(overlap)
              )
          PY
            if ! git merge-base --is-ancestor "$remote_main_sha" HEAD; then
              git merge --no-edit "$remote_main_sha"
            fi
            candidate_published_head_sha="$(git rev-parse HEAD)"
            if [[ ! "$candidate_published_head_sha" =~ ^[0-9a-f]{40}$ ]] || \
               ! git merge-base --is-ancestor "$output_commit_sha" "$candidate_published_head_sha"; then
              echo "::error::Historical replay publish candidate is invalid."
              exit 1
            fi
            if git push origin HEAD:refs/heads/main; then
              published=true
              published_head_sha="$candidate_published_head_sha"
              break
            fi
            sleep 5
          done
          if [ "$published" != true ] && \
             [[ "$candidate_published_head_sha" =~ ^[0-9a-f]{40}$ ]] && \
             fetch_main_bounded && \
             git merge-base --is-ancestor "$output_commit_sha" "$candidate_published_head_sha" && \
             git merge-base --is-ancestor "$candidate_published_head_sha" "$remote_main_sha"; then
            published=true
            published_head_sha="$candidate_published_head_sha"
          fi
          if [ "$published" != true ]; then
            echo "::error::Unable to publish historical replay after three normal non-force attempts."
            exit 1
          fi
          echo "domain_output_commit_sha=$output_commit_sha" >> "$GITHUB_OUTPUT"
          echo "published_head_sha=$published_head_sha" >> "$GITHUB_OUTPUT"
          echo "PUBLISHED_HEAD_SHA=$published_head_sha" >> "$GITHUB_ENV"

      - name: Verify pushed main and output commit
        shell: bash
        run: |
          verified=false
          for verify_attempt in 1 2 3; do
            if git fetch origin main; then
              remote_main_sha="$(git rev-parse origin/main)"
              if [[ "$remote_main_sha" =~ ^[0-9a-f]{40}$ ]] && \
                 [[ "$PUBLISHED_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] && \
                 [[ "$OUTPUT_COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]] && \
                 git merge-base --is-ancestor "$OUTPUT_COMMIT_SHA" "$PUBLISHED_HEAD_SHA" && \
                 git merge-base --is-ancestor "$PUBLISHED_HEAD_SHA" "$remote_main_sha" && \
                 git merge-base --is-ancestor "$OUTPUT_COMMIT_SHA" "$remote_main_sha"; then
                verified=true
                break
              fi
            fi
            sleep 5
          done
          if [ "$verified" != true ]; then
            echo "::error::Remote main must contain both the published head and the unique replay domain commit."
            exit 1
          fi
          echo "REMOTE_MAIN_SHA_AFTER=$remote_main_sha" >> "$GITHUB_ENV"

      - name: Revalidate pushed replay against immutable code base
        shell: bash
        run: |
          python scripts/validate_historical_structured_source_replay.py \
            --start-date "$START_DATE" \
            --end-date "$END_DATE" \
            --price-history-high-water-date "$PRICE_HISTORY_HIGH_WATER_DATE" \
            --repair-market-index-base-date "$BASE_REPAIR_DATE" \
            --replay-id "$HISTORICAL_SOURCE_REPLAY_ID" \
            --expected-pipeline-sha "$REPLAY_BASE_SHA"

      - name: Upload replay evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: historical-structured-source-replay-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            output/history/historical_source_replay/${{ env.HISTORICAL_SOURCE_REPLAY_ID }}/
            output/latest/historical_structured_source_replay_latest.json
            output/latest/historical_structured_source_replay_latest.md
            output/latest/daily_price_history_continuity_latest.json
            output/latest/data_freshness_latest.csv
          if-no-files-found: ignore
          retention-days: 90
