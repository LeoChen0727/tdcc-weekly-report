name: Debug TPEx Fetch

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  debug-tpex-fetch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pandas requests tabulate

      - name: Run TPEx debug
        run: python debug_tpex_fetch.py

      - name: Commit debug report
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add output/debug_tpex_fetch_latest.csv output/debug_tpex_fetch_latest.md
          git commit -m "Update TPEx debug report" || echo "No changes to commit"
          git push
