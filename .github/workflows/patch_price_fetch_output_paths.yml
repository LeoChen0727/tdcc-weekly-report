name: Patch Price Fetch Output Paths

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-price-fetch-output-paths:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Patch fetch_official_daily_price.py
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("fetch_official_daily_price.py")
          text = path.read_text(encoding="utf-8")

          text = text.replace(
              'OUTPUT_DIR.mkdir(exist_ok=True)\n\n\nMIN_TWSE_ROWS',
              'OUTPUT_DIR.mkdir(exist_ok=True)\nLATEST_DIR = OUTPUT_DIR / "latest"\nLATEST_DIR.mkdir(parents=True, exist_ok=True)\n\n\nMIN_TWSE_ROWS'
          )

          text = text.replace(
              'Path("output/official_price_fetch_latest.md").write_text(report, encoding="utf-8")',
              '(LATEST_DIR / "official_price_fetch_latest.md").write_text(report, encoding="utf-8")'
          )

          path.write_text(text, encoding="utf-8")
          PY

      - name: Commit patch
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add fetch_official_daily_price.py
          git commit -m "Write price fetch report to output latest" || echo "No changes to commit"
          git push
