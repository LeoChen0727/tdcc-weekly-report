name: Individual Stock PR Validation

on:
  pull_request:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

concurrency:
  group: individual-stock-pr-validation-${{ github.event_name }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  individual-stock-pr-validation:
    name: ${{ github.event_name == 'pull_request' && 'individual-stock-pr-validation' || 'individual-stock-pr-validation-pull-request-target-skip' }}
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"

      - name: Detect individual-stock validation scope
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python scripts/detect_individual_stock_pr_scope.py \
            --base-sha "$BASE_SHA" \
            --head-sha "$HEAD_SHA" \
            --github-output "$GITHUB_OUTPUT"

      - name: Check patch whitespace
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git diff --check "$BASE_SHA...$HEAD_SHA" --

      - name: Install PR static validation dependencies
        if: steps.scope.outputs.affected == 'true'
        run: python -m pip install --disable-pip-version-check pytest pandas requests PyYAML==6.0.2 pypdf

      - name: Validate workflow and scope contract
        if: steps.scope.outputs.affected == 'true'
        run: python -m pytest tests/test_individual_stock_pr_validation_workflow.py -q

      - name: Validate repository static contracts
        if: steps.scope.outputs.affected == 'true'
        run: |
          python scripts/validate_apps_script_workflow_triggers.py
          python scripts/validate_repo_production_inventory.py
          python scripts/validate_repo_file_lifecycle_inventory.py
          python scripts/validate_repo_hidden_coupling_audit.py
          python scripts/validate_daily_model_background_data_registry.py
          python scripts/validate_repo_semantic_integrity.py
          python scripts/validate_repo_code_isolation_policy.py
          python scripts/validate_model_research_workflow_isolation.py
          python scripts/validate_chatgpt_side_pdf_layout_independence.py
          python scripts/validate_daily_pdf_role_manifest_contract.py
          python scripts/validate_pdf_production_inventory.py --phase prebuild
          python scripts/validate_daily_production_boundaries.py

      - name: Install affected-path dependencies
        if: steps.scope.outputs.affected == 'true'
        run: python -m pip install --disable-pip-version-check pandas requests

      - name: Validate affected individual-stock contracts
        if: steps.scope.outputs.affected == 'true'
        run: |
          python scripts/validate_individual_pdf_contract_consumers.py
          python -m pytest tests/test_repo_production_inventory.py -q
          python -m pytest tests/test_individual_tdcc_dataset_consumer.py -q
          python -m pytest tests/test_individual_stock_outputs.py -q

      - name: Record scope result
        run: |
          echo "affected=${{ steps.scope.outputs.affected }}"
          echo "matched_count=${{ steps.scope.outputs.matched_count }}"

  pr-safe-base-audit-runner:
    name: pr-safe-trust-root-self-change-guard
    if: >-
      github.event_name == 'pull_request_target' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.base.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout pull request base only
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Fetch pull request head object without checkout
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PR_NUMBER"
          test -n "$HEAD_SHA"
          LOCAL_HEAD_REF="refs/remotes/origin/pr-safe-head"
          git fetch --no-tags --depth=1 origin "+refs/pull/$PR_NUMBER/head:$LOCAL_HEAD_REF"
          test "$(git rev-parse "$LOCAL_HEAD_REF")" = "$HEAD_SHA"

      - name: Validate trust-root self-change from base code
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_REPOSITORY: ${{ github.event.pull_request.base.repo.full_name }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          MAINTAINER_APPROVED: ${{ contains(github.event.pull_request.labels.*.name, 'trust-root-maintenance-approved') }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_repo_production_inventory.py \
            --validate-pr-trust-root-change \
            --base-sha "$BASE_SHA" \
            --head-sha "$HEAD_SHA" \
            --base-repository "$BASE_REPOSITORY" \
            --head-repository "$HEAD_REPOSITORY" \
            --maintainer-approved "$MAINTAINER_APPROVED"
