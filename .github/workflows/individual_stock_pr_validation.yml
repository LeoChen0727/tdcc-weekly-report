name: Individual Stock PR Validation

on:
  pull_request:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]
    paths:
      - "config/repo_file_lifecycle_inventory.csv"
      - "scripts/validate_daily_published_model_snapshots_pr_safe.py"
      - "scripts/validate_repo_advanced_integrity_pr_safe.py"
      - "tests/test_daily_published_model_snapshots_pr_safe.py"
      - "tests/test_repo_advanced_integrity_pr_safe.py"

permissions:
  contents: read

concurrency:
  group: individual-stock-pr-validation-${{ github.event_name }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  individual-stock-pr-validation:
    name: ${{ github.event_name == 'pull_request' && 'individual-stock-pr-validation' || 'individual-stock-pr-validation-pull-request-target-skip' }}
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"

      - name: Detect individual-stock validation scope
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python scripts/detect_individual_stock_pr_scope.py \
            --base-sha "$BASE_SHA" \
            --head-sha "$HEAD_SHA" \
            --github-output "$GITHUB_OUTPUT"

      - name: Check patch whitespace
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git diff --check "$BASE_SHA...$HEAD_SHA" --

      - name: Install PR static validation dependencies
        run: python -m pip install --disable-pip-version-check pytest pandas requests PyYAML==6.0.2 pypdf

      - name: Validate workflow and scope contract
        run: python -m pytest tests/test_individual_stock_pr_validation_workflow.py -q

      - name: Validate repository static contracts
        run: |
          python scripts/validate_apps_script_workflow_triggers.py
          python scripts/validate_repo_production_inventory.py
          python scripts/validate_repo_file_lifecycle_inventory.py
          python scripts/validate_repo_hidden_coupling_audit.py
          python scripts/validate_daily_model_background_data_registry.py
          python scripts/validate_repo_semantic_integrity.py
          python scripts/validate_repo_code_isolation_policy.py
          python scripts/validate_model_research_workflow_isolation.py
          python scripts/validate_chatgpt_side_pdf_layout_independence.py
          python scripts/validate_daily_pdf_role_manifest_contract.py
          python scripts/validate_pdf_production_inventory.py --phase prebuild
          python scripts/validate_daily_production_boundaries.py

      - name: Install affected-path dependencies
        if: steps.scope.outputs.affected == 'true'
        run: python -m pip install --disable-pip-version-check pandas requests

      - name: Validate affected individual-stock contracts
        if: steps.scope.outputs.affected == 'true'
        run: |
          python scripts/validate_individual_pdf_contract_consumers.py
          python -m pytest tests/test_repo_production_inventory.py -q
          python -m pytest tests/test_individual_tdcc_dataset_consumer.py -q
          python -m pytest tests/test_individual_stock_outputs.py -q

      - name: Record scope result
        run: |
          echo "affected=${{ steps.scope.outputs.affected }}"
          echo "matched_count=${{ steps.scope.outputs.matched_count }}"

  pr-safe-base-audit-runner:
    name: pr-safe-base-audit-runner
    if: >-
      github.event_name == 'pull_request_target' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.base.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout pull request base only
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch pull request head object without checkout
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          LOCAL_HEAD_REF="refs/remotes/origin/pr-safe-guard/$PR_NUMBER"
          git fetch --no-tags origin "+refs/pull/$PR_NUMBER/head:$LOCAL_HEAD_REF"
          test "$(git rev-parse "$LOCAL_HEAD_REF")" = "$HEAD_SHA"

      - name: Validate PR head blobs and write audit-only manifest
        id: audit
        continue-on-error: true
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          AUDIT_MANIFEST: ${{ runner.temp }}/pr-safe-control-plane-audit-manifest.json
        run: |
          python scripts/validate_repo_production_inventory.py \
            --validate-pr-safe-control-plane-migration \
            --base-sha "$BASE_SHA" \
            --head-sha "$HEAD_SHA" \
            --audit-manifest "$AUDIT_MANIFEST" \
            --repository "$GITHUB_REPOSITORY" \
            --workflow-ref "$GITHUB_WORKFLOW_REF" \
            --workflow-sha "$GITHUB_WORKFLOW_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --event-name "$GITHUB_EVENT_NAME" \
            --event-action "${{ github.event.action }}" \
            --base-ref "${{ github.event.pull_request.base.ref }}" \
            --base-repository "${{ github.event.pull_request.base.repo.full_name }}" \
            --head-repository "${{ github.event.pull_request.head.repo.full_name }}" \
            --pull-request-number "$PR_NUMBER"

      - name: Record audit manifest SHA-256
        if: always()
        env:
          AUDIT_MANIFEST: ${{ runner.temp }}/pr-safe-control-plane-audit-manifest.json
        run: |
          manifest_dir="$(dirname "$AUDIT_MANIFEST")"
          manifest_name="$(basename "$AUDIT_MANIFEST")"
          (cd "$manifest_dir" && sha256sum "$manifest_name" > "${manifest_name}.sha256")

      - name: Upload audit-only evidence
        if: always()
        id: upload-audit
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr-safe-control-plane-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/pr-safe-control-plane-audit-manifest.json
            ${{ runner.temp }}/pr-safe-control-plane-audit-manifest.json.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Fail runner when audit validator rejects
        if: always() && steps.audit.outcome != 'success'
        run: exit 1
