name: Pattern Scan

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pattern-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pandas requests tabulate

      - name: Scan W-bottom pre-breakout pattern
        run: |
          python - <<'PY'
          import io
          import requests
          import pandas as pd
          from pathlib import Path
          from datetime import datetime

          DATA_DIR = Path("data/daily_price")
          OUTPUT_DIR = Path("output")
          LATEST_DIR = OUTPUT_DIR / "latest"
          PATTERN_HISTORY_DIR = OUTPUT_DIR / "history" / "patterns"

          LATEST_DIR.mkdir(parents=True, exist_ok=True)
          PATTERN_HISTORY_DIR.mkdir(parents=True, exist_ok=True)

          PATTERN_CSV_PATH = LATEST_DIR / "w_bottom_attack_latest.csv"
          PATTERN_REPORT_PATH = LATEST_DIR / "pattern_scan_latest.md"
          TDCC_LATEST_PATH = LATEST_DIR / "tdcc_holder_ratio_latest.csv"

          LOOKBACK_DAYS = 90
          MIN_VOLUME_LOTS = 1000

          MAINSTREAM_INDUSTRY_KEYWORDS = [
              "半導體",
              "電子零組件",
              "電腦及週邊",
              "通信網路",
              "光電",
              "其他電子",
              "資訊服務",
              "電子通路",
              "電機機械",
              "綠能環保",
              "生技醫療",
              "數位雲端",
          ]


          def is_mainstream_industry(industry):
              if pd.isna(industry):
                  return False
              text = str(industry)
              return any(keyword in text for keyword in MAINSTREAM_INDUSTRY_KEYWORDS)


          def load_price_history():
              files = sorted(DATA_DIR.glob("*.csv"))
              frames = []

              for file in files:
                  try:
                      df = pd.read_csv(file, dtype={"ticker": str})
                      frames.append(df)
                  except Exception as e:
                      print(f"Skip {file}: {e}")

              if not frames:
                  return pd.DataFrame()

              data = pd.concat(frames, ignore_index=True)
              data["ticker"] = data["ticker"].astype(str).str.zfill(4)
              data["date"] = data["date"].astype(str)

              for col in ["open", "high", "low", "close", "volume", "turnover"]:
                  if col in data.columns:
                      data[col] = pd.to_numeric(data[col], errors="coerce")

              data = data.dropna(subset=["ticker", "date", "open", "high", "low", "close", "volume"])
              data = data.sort_values(["ticker", "date"]).reset_index(drop=True)

              return data


          def fetch_monthly_revenue_industry():
              urls = [
                  ("listed", "https://mopsfin.twse.com.tw/opendata/t187ap05_L.csv"),
                  ("otc", "https://mopsfin.twse.com.tw/opendata/t187ap05_O.csv"),
              ]

              frames = []

              for market, url in urls:
                  try:
                      r = requests.get(url, timeout=30, headers={"User-Agent": "Mozilla/5.0"})
                      r.encoding = "utf-8-sig"
                      df = pd.read_csv(io.StringIO(r.text))
                      df["market"] = market
                      frames.append(df)
                  except Exception as e:
                      print(f"Revenue industry fetch failed: {market} {e}")

              if not frames:
                  return pd.DataFrame(columns=["ticker", "industry"])

              df = pd.concat(frames, ignore_index=True)

              rename_map = {
                  "公司代號": "ticker",
                  "公司名稱": "name",
                  "產業別": "industry",
                  "資料年月": "revenue_period",
              }

              keep_cols = [c for c in rename_map.keys() if c in df.columns]
              df = df[keep_cols].rename(columns=rename_map)

              df["ticker"] = df["ticker"].astype(str).str.extract(r"(\d{4})")[0]
              df = df.dropna(subset=["ticker"])
              df["ticker"] = df["ticker"].astype(str).str.zfill(4)

              return df.drop_duplicates(subset=["ticker"], keep="last").reset_index(drop=True)


          def load_tdcc_latest():
              cols = [
                  "ticker",
                  "tdcc_date",
                  "tdcc_over_400_pct",
                  "tdcc_over_400_change",
                  "tdcc_over_1000_pct",
                  "tdcc_over_1000_change",
                  "tdcc_judge",
              ]

              if not TDCC_LATEST_PATH.exists():
                  return pd.DataFrame(columns=cols)

              try:
                  latest_df = pd.read_csv(TDCC_LATEST_PATH, dtype={"code": str})
              except Exception:
                  return pd.DataFrame(columns=cols)

              if latest_df.empty or "code" not in latest_df.columns:
                  return pd.DataFrame(columns=cols)

              latest_df = latest_df.copy()
              latest_df["ticker"] = latest_df["code"].astype(str).str.zfill(4)
              latest_df["date"] = latest_df["date"].astype(str)

              for col in ["over_400_pct", "over_1000_pct"]:
                  if col in latest_df.columns:
                      latest_df[col] = pd.to_numeric(latest_df[col], errors="coerce")

              latest_date = latest_df["date"].max()

              history_dir = OUTPUT_DIR / "history" / "tdcc"
              previous_df = pd.DataFrame()

              try:
                  history_files = sorted(history_dir.glob("tdcc_holder_ratio_*.csv"))
                  frames = []

                  for file in history_files:
                      temp = pd.read_csv(file, dtype={"code": str})
                      if "code" in temp.columns and "date" in temp.columns:
                          temp["ticker"] = temp["code"].astype(str).str.zfill(4)
                          temp["date"] = temp["date"].astype(str)
                          frames.append(temp)

                  if frames:
                      history_all = pd.concat(frames, ignore_index=True)
                      previous_dates = sorted([
                          d for d in history_all["date"].dropna().unique()
                          if str(d) < str(latest_date)
                      ])

                      if previous_dates:
                          previous_date = previous_dates[-1]
                          previous_df = history_all[history_all["date"] == previous_date].copy()

                          for col in ["over_400_pct", "over_1000_pct"]:
                              if col in previous_df.columns:
                                  previous_df[col] = pd.to_numeric(previous_df[col], errors="coerce")

              except Exception:
                  previous_df = pd.DataFrame()

              latest_use = latest_df[["ticker", "date", "over_400_pct", "over_1000_pct"]].copy()
              latest_use = latest_use.rename(columns={
                  "date": "tdcc_date",
                  "over_400_pct": "tdcc_over_400_pct",
                  "over_1000_pct": "tdcc_over_1000_pct",
              })

              if not previous_df.empty:
                  prev_use = previous_df[["ticker", "over_400_pct", "over_1000_pct"]].copy()
                  prev_use = prev_use.rename(columns={
                      "over_400_pct": "prev_over_400_pct",
                      "over_1000_pct": "prev_over_1000_pct",
                  })

                  latest_use = latest_use.merge(prev_use, on="ticker", how="left")
                  latest_use["tdcc_over_400_change"] = latest_use["tdcc_over_400_pct"] - latest_use["prev_over_400_pct"]
                  latest_use["tdcc_over_1000_change"] = latest_use["tdcc_over_1000_pct"] - latest_use["prev_over_1000_pct"]
              else:
                  latest_use["tdcc_over_400_change"] = pd.NA
                  latest_use["tdcc_over_1000_change"] = pd.NA

              def judge_tdcc(row):
                  c400 = row.get("tdcc_over_400_change", pd.NA)
                  c1000 = row.get("tdcc_over_1000_change", pd.NA)

                  if pd.isna(c400) or pd.isna(c1000):
                      return "僅最新TDCC"
                  if c400 > 0 and c1000 > 0:
                      return "中大戶/超大戶同步增加"
                  if c400 > 0 and c1000 <= 0:
                      return "中大戶增加"
                  if c400 <= 0 and c1000 > 0:
                      return "超大戶增加"
                  if c400 < 0 and c1000 < 0:
                      return "大戶籌碼減少"
                  return "變化不明顯"

              latest_use["tdcc_judge"] = latest_use.apply(judge_tdcc, axis=1)

              for col in [
                  "tdcc_over_400_pct",
                  "tdcc_over_400_change",
                  "tdcc_over_1000_pct",
                  "tdcc_over_1000_change",
              ]:
                  latest_use[col] = pd.to_numeric(latest_use[col], errors="coerce").round(2)

              return latest_use[cols].copy()


          def enrich_with_tdcc(df, tdcc_df):
              if df.empty or tdcc_df.empty:
                  return df

              result = df.copy()
              result["ticker"] = result["ticker"].astype(str).str.zfill(4)
              tdcc_df = tdcc_df.copy()
              tdcc_df["ticker"] = tdcc_df["ticker"].astype(str).str.zfill(4)

              result = result.merge(tdcc_df, on="ticker", how="left")
              result["tdcc_judge"] = result["tdcc_judge"].fillna("無TDCC資料")

              return result


          def find_local_minima(df, window=3):
              lows = df["low"].values
              points = []

              for i in range(window, len(df) - window):
                  left = lows[i-window:i]
                  right = lows[i+1:i+1+window]
                  if lows[i] <= min(left) and lows[i] <= min(right):
                      points.append(i)

              return points


          def classify_stage(distance_to_neckline_pct, current_from_c_pct):
              """
              這版重點放在還沒正式發動。
              """
              if current_from_c_pct > 40:
                  return "已漲太遠"

              if -15 <= distance_to_neckline_pct < -5:
                  return "預備發動型"

              if -5 <= distance_to_neckline_pct < 0:
                  return "接近突破型"

              if 0 <= distance_to_neckline_pct <= 8:
                  return "已突破但未過熱"

              if distance_to_neckline_pct > 8:
                  return "已突破過遠"

              return "右側未成熟"


          def scan_w_bottom_attack(group):
              group = group.sort_values("date").reset_index(drop=True).copy()

              if len(group) < 60:
                  return None

              recent = group.tail(LOOKBACK_DAYS).reset_index(drop=True).copy()

              if len(recent) < 50:
                  return None

              recent["volume_lots"] = recent["volume"] / 1000
              latest = recent.iloc[-1]

              if latest["volume_lots"] < MIN_VOLUME_LOTS:
                  return None

              minima = find_local_minima(recent, window=3)

              if len(minima) < 2:
                  return None

              best = None

              for a_pos in minima:
                  for c_pos in minima:
                      if c_pos <= a_pos + 8:
                          continue

                      if c_pos >= len(recent) - 4:
                          continue

                      a_row = recent.iloc[a_pos]
                      c_row = recent.iloc[c_pos]

                      a_low = a_row["low"]
                      c_low = c_row["low"]

                      if a_low <= 0 or c_low <= 0:
                          continue

                      second_low_gap_pct = (c_low / a_low - 1) * 100

                      # 第二低點不可明顯破壞第一低點，也不能高太多到不像 W 底
                      if second_low_gap_pct < -10 or second_low_gap_pct > 18:
                          continue

                      mid = recent.iloc[a_pos:c_pos + 1]
                      b_high = mid["high"].max()
                      b_pos = mid["high"].idxmax()
                      b_row = recent.iloc[b_pos]

                      # 頸線要在兩低點之間
                      if b_pos <= a_pos or b_pos >= c_pos:
                          continue

                      rebound_from_a_pct = (b_high / a_low - 1) * 100

                      if rebound_from_a_pct < 8:
                          continue

                      attack1 = recent.iloc[a_pos:b_pos + 1].copy()
                      attack2 = recent.iloc[c_pos:].copy()

                      if len(attack1) < 3 or len(attack2) < 3:
                          continue

                      attack1_gain_pct = (attack1.iloc[-1]["close"] / attack1.iloc[0]["close"] - 1) * 100
                      attack2_gain_pct = (attack2.iloc[-1]["close"] / attack2.iloc[0]["close"] - 1) * 100

                      attack1_avg_volume = attack1["volume"].mean()
                      attack2_avg_volume = attack2["volume"].mean()

                      volume_ratio_2_vs_1 = attack2_avg_volume / attack1_avg_volume if attack1_avg_volume > 0 else 0

                      attack1_red_count = int((attack1["close"] > attack1["open"]).sum())
                      attack2_red_count = int((attack2["close"] > attack2["open"]).sum())

                      attack1_red_body = (
                          attack1.loc[attack1["close"] > attack1["open"], "close"] -
                          attack1.loc[attack1["close"] > attack1["open"], "open"]
                      ).sum()

                      attack2_red_body = (
                          attack2.loc[attack2["close"] > attack2["open"], "close"] -
                          attack2.loc[attack2["close"] > attack2["open"], "open"]
                      ).sum()

                      red_body_ratio_2_vs_1 = attack2_red_body / attack1_red_body if attack1_red_body > 0 else 0

                      neckline = b_high
                      latest_close = latest["close"]
                      distance_to_neckline_pct = (latest_close / neckline - 1) * 100
                      current_from_c_pct = (latest_close / c_low - 1) * 100

                      if current_from_c_pct < 3:
                          continue

                      stage = classify_stage(distance_to_neckline_pct, current_from_c_pct)

                      if stage in ["已漲太遠", "已突破過遠", "右側未成熟"]:
                          continue

                      # 這版重點是二攻變強，所以要求至少有一個「明顯更強」成立
                      volume_stronger = volume_ratio_2_vs_1 >= 1.15
                      red_count_stronger = attack2_red_count >= attack1_red_count
                      red_body_stronger = red_body_ratio_2_vs_1 >= 1.1
                      gain_stronger = attack2_gain_pct >= attack1_gain_pct * 0.65

                      if not volume_stronger:
                          continue

                      if not (red_count_stronger or red_body_stronger or gain_stronger):
                          continue

                      score = 0

                      # W底完整度
                      if -3 <= second_low_gap_pct <= 10:
                          score += 20
                      elif -10 <= second_low_gap_pct <= 18:
                          score += 12

                      # 中間反彈形成頸線
                      if rebound_from_a_pct >= 25:
                          score += 18
                      elif rebound_from_a_pct >= 15:
                          score += 12
                      elif rebound_from_a_pct >= 8:
                          score += 8

                      # 二攻量能
                      if volume_ratio_2_vs_1 >= 1.8:
                          score += 24
                      elif volume_ratio_2_vs_1 >= 1.35:
                          score += 18
                      elif volume_ratio_2_vs_1 >= 1.15:
                          score += 10

                      # 二攻紅K
                      if attack2_red_count > attack1_red_count:
                          score += 12
                      elif attack2_red_count == attack1_red_count:
                          score += 8

                      if red_body_ratio_2_vs_1 >= 1.8:
                          score += 18
                      elif red_body_ratio_2_vs_1 >= 1.2:
                          score += 12
                      elif red_body_ratio_2_vs_1 >= 1.0:
                          score += 6

                      # 二攻漲幅
                      if attack2_gain_pct >= attack1_gain_pct:
                          score += 14
                      elif attack2_gain_pct >= attack1_gain_pct * 0.65:
                          score += 8

                      # 階段加權：預備發動 / 接近突破優先
                      if stage == "預備發動型":
                          score += 18
                      elif stage == "接近突破型":
                          score += 16
                      elif stage == "已突破但未過熱":
                          score += 8

                      # 還沒噴太遠加分
                      if current_from_c_pct <= 25:
                          score += 12
                      elif current_from_c_pct <= 35:
                          score += 6

                      if score < 55:
                          continue

                      candidate = {
                          "date": latest["date"],
                          "ticker": latest["ticker"],
                          "name": latest.get("name", ""),
                          "market": latest.get("market", ""),
                          "close": round(latest_close, 2),
                          "volume_lots": round(latest["volume_lots"], 0),
                          "pattern": "W底右側攻擊增強・預備發動",
                          "pattern_stage": stage,
                          "pattern_score": round(score, 1),
                          "a_date": a_row["date"],
                          "a_low": round(a_low, 2),
                          "b_date": b_row["date"],
                          "neckline": round(neckline, 2),
                          "c_date": c_row["date"],
                          "c_low": round(c_low, 2),
                          "second_low_gap_pct": round(second_low_gap_pct, 2),
                          "rebound_from_a_pct": round(rebound_from_a_pct, 2),
                          "current_from_c_pct": round(current_from_c_pct, 2),
                          "distance_to_neckline_pct": round(distance_to_neckline_pct, 2),
                          "attack1_gain_pct": round(attack1_gain_pct, 2),
                          "attack2_gain_pct": round(attack2_gain_pct, 2),
                          "attack1_avg_volume_lots": round(attack1_avg_volume / 1000, 0),
                          "attack2_avg_volume_lots": round(attack2_avg_volume / 1000, 0),
                          "volume_ratio_2_vs_1": round(volume_ratio_2_vs_1, 2),
                          "attack1_red_count": attack1_red_count,
                          "attack2_red_count": attack2_red_count,
                          "red_body_ratio_2_vs_1": round(red_body_ratio_2_vs_1, 2),
                      }

                      if best is None or candidate["pattern_score"] > best["pattern_score"]:
                          best = candidate

              return best


          def make_table(df, columns, rename_map, max_rows=30):
              if df.empty:
                  return "沒有符合條件的股票。"
              temp = df.head(max_rows).copy()
              cols = [c for c in columns if c in temp.columns]
              temp = temp[cols].rename(columns=rename_map)
              return temp.to_markdown(index=False)


          def generate_report(pattern_df, latest_price_date):
              today = datetime.now().strftime("%Y%m%d")
              now = datetime.now().strftime("%Y-%m-%d %H:%M:%S")

              show_cols = [
                  "ticker", "name", "industry", "pattern_stage", "pattern_score",
                  "date", "close", "volume_lots",
                  "a_date", "a_low", "b_date", "neckline", "c_date", "c_low",
                  "distance_to_neckline_pct", "current_from_c_pct",
                  "volume_ratio_2_vs_1",
                  "attack1_red_count", "attack2_red_count",
                  "red_body_ratio_2_vs_1",
                  "tdcc_judge",
              ]

              rename_map = {
                  "ticker": "代號",
                  "name": "名稱",
                  "industry": "產業",
                  "pattern_stage": "型態階段",
                  "pattern_score": "型態分數",
                  "date": "資料日",
                  "close": "收盤價",
                  "volume_lots": "成交量張",
                  "a_date": "第一低點日",
                  "a_low": "第一低點",
                  "b_date": "頸線日",
                  "neckline": "頸線",
                  "c_date": "第二低點日",
                  "c_low": "第二低點",
                  "distance_to_neckline_pct": "距頸線%",
                  "current_from_c_pct": "距第二底%",
                  "volume_ratio_2_vs_1": "二攻量/一攻量",
                  "attack1_red_count": "一攻紅K數",
                  "attack2_red_count": "二攻紅K數",
                  "red_body_ratio_2_vs_1": "二攻紅K實體/一攻",
                  "tdcc_judge": "TDCC判斷",
              }

              if pattern_df.empty:
                  report = f"""# Pattern Scanner 型態掃描報告

          產生時間：{now}
          最新價格資料日：{latest_price_date}

          ## W底右側攻擊增強・預備發動型

          沒有符合條件的股票。
          """
                  PATTERN_REPORT_PATH.write_text(report, encoding="utf-8")
                  (PATTERN_HISTORY_DIR / f"pattern_scan_{today}.md").write_text(report, encoding="utf-8")
                  return

              pre_df = pattern_df[pattern_df["pattern_stage"] == "預備發動型"].copy()
              near_df = pattern_df[pattern_df["pattern_stage"] == "接近突破型"].copy()
              breakout_not_hot_df = pattern_df[pattern_df["pattern_stage"] == "已突破但未過熱"].copy()
              mainstream_df = pattern_df[pattern_df["is_mainstream"] == True].copy()
              non_mainstream_df = pattern_df[pattern_df["is_mainstream"] == False].copy()

              report = []
              report.append("# Pattern Scanner 型態掃描報告")
              report.append("")
              report.append(f"產生時間：{now}")
              report.append(f"最新價格資料日：{latest_price_date}")
              report.append("型態：W底右側攻擊增強・預備發動型")
              report.append("")
              report.append("> 這份報告找的是：第一低點 → 反彈頸線 → 第二低點 → 第二次攻擊。")
              report.append("")
              report.append("> 重點不是已經噴出去，而是第二次攻擊量能、紅K數或紅K實體比第一次攻擊更強，且尚未離第二底太遠。")
              report.append("")
              report.append("> 預備發動型：距頸線 -15% 到 -5%；接近突破型：距頸線 -5% 到 0%；已突破但未過熱：突破頸線 0% 到 8%。")
              report.append("")
              report.append("---")
              report.append("")
              report.append("## 1. 預備發動型")
              report.append("")
              report.append(make_table(pre_df, show_cols, rename_map))
              report.append("")
              report.append("---")
              report.append("")
              report.append("## 2. 接近突破型")
              report.append("")
              report.append(make_table(near_df, show_cols, rename_map))
              report.append("")
              report.append("---")
              report.append("")
              report.append("## 3. 已突破但未過熱型")
              report.append("")
              report.append(make_table(breakout_not_hot_df, show_cols, rename_map))
              report.append("")
              report.append("---")
              report.append("")
              report.append("## 4. 主流題材候選")
              report.append("")
              report.append(make_table(mainstream_df, show_cols, rename_map))
              report.append("")
              report.append("---")
              report.append("")
              report.append("## 5. 非主流 / 其他候選")
              report.append("")
              report.append(make_table(non_mainstream_df, show_cols, rename_map))
              report.append("")

              report_text = "\n".join(report)

              PATTERN_REPORT_PATH.write_text(report_text, encoding="utf-8")
              (PATTERN_HISTORY_DIR / f"pattern_scan_{today}.md").write_text(report_text, encoding="utf-8")


          def main():
              price_data = load_price_history()

              if price_data.empty:
                  generate_report(pd.DataFrame(), "無")
                  print("No price data.")
                  return

              latest_price_date = price_data["date"].max()
              tdcc_df = load_tdcc_latest()
              industry_df = fetch_monthly_revenue_industry()

              rows = []

              for ticker, group in price_data.groupby("ticker"):
                  try:
                      candidate = scan_w_bottom_attack(group)
                      if candidate:
                          rows.append(candidate)
                  except Exception as e:
                      print(f"Skip {ticker}: {e}")

              pattern_df = pd.DataFrame(rows)

              if not pattern_df.empty:
                  pattern_df["ticker"] = pattern_df["ticker"].astype(str).str.zfill(4)

                  if not industry_df.empty:
                      pattern_df = pattern_df.merge(
                          industry_df[["ticker", "industry"]],
                          on="ticker",
                          how="left"
                      )
                  else:
                      pattern_df["industry"] = ""

                  pattern_df["industry"] = pattern_df["industry"].fillna("")
                  pattern_df["is_mainstream"] = pattern_df["industry"].apply(is_mainstream_industry)

                  pattern_df = enrich_with_tdcc(pattern_df, tdcc_df)

                  stage_order = {
                      "預備發動型": 1,
                      "接近突破型": 2,
                      "已突破但未過熱": 3,
                  }

                  pattern_df["stage_order"] = pattern_df["pattern_stage"].map(stage_order).fillna(99)

                  pattern_df = pattern_df.sort_values(
                      ["stage_order", "pattern_score", "volume_ratio_2_vs_1"],
                      ascending=[True, False, False]
                  ).reset_index(drop=True)

                  pattern_df.to_csv(PATTERN_CSV_PATH, index=False, encoding="utf-8-sig")

                  dated_csv_path = PATTERN_HISTORY_DIR / f"w_bottom_attack_{latest_price_date}.csv"
                  pattern_df.to_csv(dated_csv_path, index=False, encoding="utf-8-sig")

              generate_report(pattern_df, latest_price_date)

              print("Pattern scan completed.")
              print(f"Latest price date: {latest_price_date}")
              print(f"Candidates: {len(pattern_df) if not pattern_df.empty else 0}")


          if __name__ == "__main__":
              main()
          PY

      - name: Commit pattern scan report
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add output/latest/pattern_scan_latest.md output/latest/w_bottom_attack_latest.csv output/history/patterns/
          git commit -m "Update pattern scan report" || echo "No changes to commit"
          git push
