name: Test TDCC Trend Utility

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-tdcc-trend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas

      - name: Run TDCC trend utility
        run: python tdcc_trend_utils.py

      - name: Commit TDCC trend debug output
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add output/latest/tdcc_trend_debug_latest.csv
          git status --short
          git commit -m "Update TDCC trend debug output" || echo "No changes to commit"
          git push
