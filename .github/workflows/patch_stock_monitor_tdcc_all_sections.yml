name: Patch Stock Monitor TDCC All Sections

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-stock-monitor-tdcc-all-sections:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Patch stock_daily_monitor.py with TDCC fields for all sections
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("stock_daily_monitor.py")
          text = path.read_text(encoding="utf-8")

          # 1. Add TDCC paths
          if "TDCC_LATEST_PATH" not in text:
              text = text.replace(
                  'PULLBACK_REBOUND_CSV_PATH = LATEST_DIR / "pullback_rebound_latest.csv"',
                  'PULLBACK_REBOUND_CSV_PATH = LATEST_DIR / "pullback_rebound_latest.csv"\n\nTDCC_LATEST_PATH = LATEST_DIR / "tdcc_holder_ratio_latest.csv"\nTDCC_HISTORY_DIR = OUTPUT_DIR / "history" / "tdcc"'
              )

          # 2. Add TDCC helper functions
          if "def load_tdcc_latest" not in text:
              insert_before = "def generate_markdown_table(df, columns, rename_map, max_rows=30):"

              tdcc_functions = r'''
          def load_tdcc_latest():
              """
              讀取最新 TDCC 週資料，並與前一期比較。

              目前 TDCC 欄位：
              - date
              - code
              - name
              - over_400_pct
              - over_600_pct
              - over_800_pct
              - over_1000_pct

              目前沒有 100 張以上資料，所以先用：
              over_400_pct = 中大戶以上 proxy
              over_1000_pct = 超大戶 proxy
              """
              tdcc_cols = [
                  "ticker",
                  "tdcc_date",
                  "tdcc_over_400_pct",
                  "tdcc_over_400_change",
                  "tdcc_over_1000_pct",
                  "tdcc_over_1000_change",
                  "tdcc_judge",
              ]

              if not TDCC_LATEST_PATH.exists():
                  return pd.DataFrame(columns=tdcc_cols)

              try:
                  latest_df = pd.read_csv(TDCC_LATEST_PATH, dtype={"code": str})
              except Exception as e:
                  print(f"TDCC latest read failed: {e}")
                  return pd.DataFrame(columns=tdcc_cols)

              if latest_df.empty:
                  return pd.DataFrame(columns=tdcc_cols)

              if "code" not in latest_df.columns:
                  if "ticker" in latest_df.columns:
                      latest_df["code"] = latest_df["ticker"]
                  else:
                      return pd.DataFrame(columns=tdcc_cols)

              latest_df = latest_df.copy()
              latest_df["ticker"] = latest_df["code"].astype(str).str.zfill(4)
              latest_df["date"] = latest_df["date"].astype(str)

              for col in ["over_400_pct", "over_1000_pct"]:
                  if col in latest_df.columns:
                      latest_df[col] = pd.to_numeric(latest_df[col], errors="coerce")

              latest_date = latest_df["date"].max()
              previous_df = pd.DataFrame()

              try:
                  history_files = sorted(TDCC_HISTORY_DIR.glob("tdcc_holder_ratio_*.csv"))
                  history_frames = []

                  for file in history_files:
                      temp = pd.read_csv(file, dtype={"code": str})

                      if "code" not in temp.columns and "ticker" in temp.columns:
                          temp["code"] = temp["ticker"]

                      if "date" in temp.columns and "code" in temp.columns:
                          history_frames.append(temp)

                  if history_frames:
                      history_all = pd.concat(history_frames, ignore_index=True)
                      history_all["date"] = history_all["date"].astype(str)
                      history_all["ticker"] = history_all["code"].astype(str).str.zfill(4)

                      previous_dates = sorted([
                          d for d in history_all["date"].dropna().unique()
                          if str(d) < str(latest_date)
                      ])

                      if previous_dates:
                          previous_date = previous_dates[-1]
                          previous_df = history_all[history_all["date"] == previous_date].copy()

                          for col in ["over_400_pct", "over_1000_pct"]:
                              if col in previous_df.columns:
                                  previous_df[col] = pd.to_numeric(previous_df[col], errors="coerce")

              except Exception as e:
                  print(f"TDCC history read failed: {e}")
                  previous_df = pd.DataFrame()

              base_cols = ["ticker", "date", "over_400_pct", "over_1000_pct"]
              latest_use = latest_df[[c for c in base_cols if c in latest_df.columns]].copy()

              latest_use = latest_use.rename(columns={
                  "date": "tdcc_date",
                  "over_400_pct": "tdcc_over_400_pct",
                  "over_1000_pct": "tdcc_over_1000_pct",
              })

              if not previous_df.empty:
                  prev_use = previous_df[[c for c in base_cols if c in previous_df.columns]].copy()

                  prev_use = prev_use.rename(columns={
                      "over_400_pct": "prev_over_400_pct",
                      "over_1000_pct": "prev_over_1000_pct",
                  })

                  latest_use = latest_use.merge(
                      prev_use[["ticker", "prev_over_400_pct", "prev_over_1000_pct"]],
                      on="ticker",
                      how="left"
                  )

                  latest_use["tdcc_over_400_change"] = (
                      latest_use["tdcc_over_400_pct"] - latest_use["prev_over_400_pct"]
                  )
                  latest_use["tdcc_over_1000_change"] = (
                      latest_use["tdcc_over_1000_pct"] - latest_use["prev_over_1000_pct"]
                  )
              else:
                  latest_use["tdcc_over_400_change"] = pd.NA
                  latest_use["tdcc_over_1000_change"] = pd.NA

              def judge_tdcc(row):
                  c400 = row.get("tdcc_over_400_change", pd.NA)
                  c1000 = row.get("tdcc_over_1000_change", pd.NA)

                  if pd.isna(c400) or pd.isna(c1000):
                      return "僅最新TDCC"

                  if c400 > 0 and c1000 > 0:
                      return "中大戶/超大戶同步增加"

                  if c400 > 0 and c1000 <= 0:
                      return "中大戶增加"

                  if c400 <= 0 and c1000 > 0:
                      return "超大戶增加"

                  if c400 < 0 and c1000 < 0:
                      return "大戶籌碼減少"

                  return "變化不明顯"

              latest_use["tdcc_judge"] = latest_use.apply(judge_tdcc, axis=1)

              for col in [
                  "tdcc_over_400_pct",
                  "tdcc_over_400_change",
                  "tdcc_over_1000_pct",
                  "tdcc_over_1000_change",
              ]:
                  latest_use[col] = pd.to_numeric(latest_use[col], errors="coerce").round(2)

              return latest_use[tdcc_cols].copy()


          def enrich_with_tdcc(df, tdcc_df):
              """
              把 TDCC 最新週資料併入候選股清單。
              """
              tdcc_cols = [
                  "tdcc_date",
                  "tdcc_over_400_pct",
                  "tdcc_over_400_change",
                  "tdcc_over_1000_pct",
                  "tdcc_over_1000_change",
                  "tdcc_judge",
              ]

              if df.empty:
                  return df

              result = df.copy()

              if tdcc_df.empty:
                  for col in tdcc_cols:
                      if col not in result.columns:
                          result[col] = ""
                  result["tdcc_judge"] = "無TDCC資料"
                  return result

              result["ticker"] = result["ticker"].astype(str).str.zfill(4)

              tdcc_df = tdcc_df.copy()
              tdcc_df["ticker"] = tdcc_df["ticker"].astype(str).str.zfill(4)

              result = result.drop(columns=[c for c in tdcc_cols if c in result.columns], errors="ignore")

              result = result.merge(
                  tdcc_df,
                  on="ticker",
                  how="left"
              )

              for col in tdcc_cols:
                  if col not in result.columns:
                      result[col] = ""

              result["tdcc_judge"] = result["tdcc_judge"].fillna("無TDCC資料")

              return result


          '''
              text = text.replace(insert_before, tdcc_functions + "\n" + insert_before)

          # 3. Add TDCC columns to breakout table
          if '"tdcc_date", "tdcc_over_400_pct", "tdcc_over_400_change"' not in text:
              text = text.replace(
                  '"breakout_pct", "return_5d_pct", "score", "judge"',
                  '"breakout_pct", "return_5d_pct",\n        "tdcc_date", "tdcc_over_400_pct", "tdcc_over_400_change",\n        "tdcc_over_1000_pct", "tdcc_over_1000_change", "tdcc_judge",\n        "score", "judge"'
              )

              text = text.replace(
                  '"close_vs_prev_pct", "intraday_pct",\n        "score", "judge"',
                  '"close_vs_prev_pct", "intraday_pct",\n        "tdcc_date", "tdcc_over_400_pct", "tdcc_over_400_change",\n        "tdcc_over_1000_pct", "tdcc_over_1000_change", "tdcc_judge",\n        "score", "judge"'
              )

              text = text.replace(
                  '"close_vs_prev_pct", "intraday_pct",\n        "score", "rebound_judge"',
                  '"close_vs_prev_pct", "intraday_pct",\n        "tdcc_date", "tdcc_over_400_pct", "tdcc_over_400_change",\n        "tdcc_over_1000_pct", "tdcc_over_1000_change", "tdcc_judge",\n        "score", "rebound_judge"'
              )

          # 4. Add TDCC labels
          if '"tdcc_date": "TDCC日"' not in text:
              text = text.replace(
                  '"return_5d_pct": "近5日漲幅%",\n        "score": "分數",',
                  '"return_5d_pct": "近5日漲幅%",\n        "tdcc_date": "TDCC日",\n        "tdcc_over_400_pct": "400張以上%",\n        "tdcc_over_400_change": "400張變化",\n        "tdcc_over_1000_pct": "1000張以上%",\n        "tdcc_over_1000_change": "1000張變化",\n        "tdcc_judge": "TDCC判斷",\n        "score": "分數",'
              )

              text = text.replace(
                  '"intraday_pct": "日內漲跌%",\n        "score": "分數",',
                  '"intraday_pct": "日內漲跌%",\n        "tdcc_date": "TDCC日",\n        "tdcc_over_400_pct": "400張以上%",\n        "tdcc_over_400_change": "400張變化",\n        "tdcc_over_1000_pct": "1000張以上%",\n        "tdcc_over_1000_change": "1000張變化",\n        "tdcc_judge": "TDCC判斷",\n        "score": "分數",'
              )

              text = text.replace(
                  '"intraday_pct": "日內漲跌%",\n        "score": "原始分數",',
                  '"intraday_pct": "日內漲跌%",\n        "tdcc_date": "TDCC日",\n        "tdcc_over_400_pct": "400張以上%",\n        "tdcc_over_400_change": "400張變化",\n        "tdcc_over_1000_pct": "1000張以上%",\n        "tdcc_over_1000_change": "1000張變化",\n        "tdcc_judge": "TDCC判斷",\n        "score": "原始分數",'
              )

          # 5. Add report explanation
          if "TDCC：引用 output/latest/tdcc_holder_ratio_latest.csv" not in text:
              text = text.replace(
                  'lines.append("> 營收回檔股中的短線轉強：從營收回檔觀察池中，找出今日收盤轉強、量能回升、接近或站回 20MA 的股票。")',
                  'lines.append("> 營收回檔股中的短線轉強：從營收回檔觀察池中，找出今日收盤轉強、量能回升、接近或站回 20MA 的股票。")\n    lines.append("")\n    lines.append("> TDCC：引用 output/latest/tdcc_holder_ratio_latest.csv 的最新週資料；400張以上作為中大戶 proxy，1000張以上作為超大戶 proxy。")'
              )

          # 6. Enrich all candidate tables with TDCC in main()
          if "tdcc_df = load_tdcc_latest()" not in text:
              text = text.replace(
                  'breakout_df = find_breakout_candidates(stock_map, industry_map)\n    revenue_pullback_df = find_revenue_pullback_candidates(stock_map, revenue_df)\n    pullback_rebound_df = find_pullback_rebound_candidates(revenue_pullback_df)',
                  'tdcc_df = load_tdcc_latest()\n    breakout_df = find_breakout_candidates(stock_map, industry_map)\n    breakout_df = enrich_with_tdcc(breakout_df, tdcc_df)\n    revenue_pullback_df = find_revenue_pullback_candidates(stock_map, revenue_df)\n    revenue_pullback_df = enrich_with_tdcc(revenue_pullback_df, tdcc_df)\n    pullback_rebound_df = find_pullback_rebound_candidates(revenue_pullback_df)\n    pullback_rebound_df = enrich_with_tdcc(pullback_rebound_df, tdcc_df)'
              )

          # 7. Add TDCC log line
          if 'print(f"TDCC rows loaded: {len(tdcc_df)}")' not in text:
              text = text.replace(
                  'print(f"Pullback rebound candidates: {len(pullback_rebound_df)}")',
                  'print(f"Pullback rebound candidates: {len(pullback_rebound_df)}")\n    print(f"TDCC rows loaded: {len(tdcc_df)}")'
              )

          path.write_text(text, encoding="utf-8")
          PY

      - name: Commit patch
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add stock_daily_monitor.py
          git commit -m "Add TDCC fields to all stock monitor sections" || echo "No changes to commit"
          git push
