name: Daily Stock Monitor

on:
  schedule:
    - cron: "50 10 * * 1-5"  # Taiwan time 18:50, Monday to Friday
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-daily-monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run daily stock monitor
        run: python stock_daily_monitor.py

      - name: Commit report
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add output/
          git commit -m "Update daily stock monitor report" || echo "No changes to commit"
          git push
