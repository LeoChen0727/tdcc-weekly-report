name: Daily Stock Monitor

on:
  schedule:
    - cron: "11 15 * * 1-5" # Temporary test: Taiwan time 23:11, Monday to Friday
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-daily-monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pandas requests tabulate

      - name: Fetch latest official daily price
        run: python fetch_official_daily_price.py

      - name: Run daily stock monitor
        run: python stock_daily_monitor.py

      - name: Commit daily price and report
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add data/ output/
          git status --short
          git commit -m "Update daily stock monitor report" || echo "No changes to commit"
          git push
