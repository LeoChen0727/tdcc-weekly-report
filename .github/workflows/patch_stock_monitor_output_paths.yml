name: Patch Stock Monitor Output Paths

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-stock-monitor-output-paths:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Patch stock_daily_monitor.py
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("stock_daily_monitor.py")
          text = path.read_text(encoding="utf-8")

          text = text.replace(
              'OUTPUT_DIR.mkdir(exist_ok=True)\n\nREPORT_PATH = OUTPUT_DIR / "stock_monitor_latest.md"',
              'OUTPUT_DIR.mkdir(exist_ok=True)\nLATEST_DIR = OUTPUT_DIR / "latest"\nLATEST_DIR.mkdir(parents=True, exist_ok=True)\n\nREPORT_PATH = LATEST_DIR / "stock_monitor_latest.md"'
          )

          replacements = {
              'BREAKOUT_CSV_PATH = OUTPUT_DIR / "breakout_latest.csv"':
                  'BREAKOUT_CSV_PATH = LATEST_DIR / "breakout_latest.csv"',
              'REVENUE_PULLBACK_CSV_PATH = OUTPUT_DIR / "revenue_pullback_latest.csv"':
                  'REVENUE_PULLBACK_CSV_PATH = LATEST_DIR / "revenue_pullback_latest.csv"',
              'PULLBACK_REBOUND_CSV_PATH = OUTPUT_DIR / "pullback_rebound_latest.csv"':
                  'PULLBACK_REBOUND_CSV_PATH = LATEST_DIR / "pullback_rebound_latest.csv"',
          }

          for old, new in replacements.items():
              text = text.replace(old, new)

          path.write_text(text, encoding="utf-8")
          PY

      - name: Commit patch
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add stock_daily_monitor.py
          git commit -m "Write stock monitor outputs to output/latest" || echo "No changes to commit"
          git push
