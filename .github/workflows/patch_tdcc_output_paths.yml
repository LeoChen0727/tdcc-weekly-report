name: Patch TDCC Output Paths

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-tdcc-output-paths:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Patch tdcc_holder_ratio_top10.py
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("tdcc_holder_ratio_top10.py")
          text = path.read_text(encoding="utf-8")

          text = text.replace(
              'OUTPUT_DIR = Path("output")\nHISTORY_DIR = OUTPUT_DIR / "history"\nREADME_PATH = Path("README.md")',
              'OUTPUT_DIR = Path("output")\nLATEST_DIR = OUTPUT_DIR / "latest"\nHISTORY_DIR = OUTPUT_DIR / "history"\nTDCC_HISTORY_DIR = HISTORY_DIR / "tdcc"\nREADME_PATH = Path("README.md")'
          )

          text = text.replace(
              'def ensure_dirs() -> None:\n    OUTPUT_DIR.mkdir(exist_ok=True)\n    HISTORY_DIR.mkdir(parents=True, exist_ok=True)',
              'def ensure_dirs() -> None:\n    OUTPUT_DIR.mkdir(exist_ok=True)\n    LATEST_DIR.mkdir(parents=True, exist_ok=True)\n    HISTORY_DIR.mkdir(parents=True, exist_ok=True)\n    TDCC_HISTORY_DIR.mkdir(parents=True, exist_ok=True)'
          )

          text = text.replace(
              'raw_path = OUTPUT_DIR / f"tdcc_latest_ratio_raw_{latest_date}.csv"',
              'raw_path = TDCC_HISTORY_DIR / f"tdcc_latest_ratio_raw_{latest_date}.csv"'
          )

          text = text.replace(
              'history_path = HISTORY_DIR / f"tdcc_holder_ratio_{latest_date}.csv"\n    latest_path = OUTPUT_DIR / "tdcc_holder_ratio_latest.csv"',
              'history_path = TDCC_HISTORY_DIR / f"tdcc_holder_ratio_{latest_date}.csv"\n    latest_path = LATEST_DIR / "tdcc_holder_ratio_latest.csv"'
          )

          text = text.replace(
              'legacy_paths = sorted(OUTPUT_DIR.glob("tdcc_latest_ratio_raw_*.csv"))',
              'legacy_paths = sorted(OUTPUT_DIR.glob("tdcc_latest_ratio_raw_*.csv")) + sorted(TDCC_HISTORY_DIR.glob("tdcc_latest_ratio_raw_*.csv"))'
          )

          text = text.replace(
              'history_path = HISTORY_DIR / f"tdcc_holder_ratio_{date}.csv"',
              'history_path = TDCC_HISTORY_DIR / f"tdcc_holder_ratio_{date}.csv"'
          )

          text = text.replace(
              'snapshot_paths = sorted(HISTORY_DIR.glob("tdcc_holder_ratio_*.csv"))',
              'snapshot_paths = sorted(TDCC_HISTORY_DIR.glob("tdcc_holder_ratio_*.csv"))'
          )

          text = text.replace(
              'for path in sorted(HISTORY_DIR.glob("tdcc_holder_ratio_*.csv")):',
              'for path in sorted(TDCC_HISTORY_DIR.glob("tdcc_holder_ratio_*.csv")):'
          )

          text = text.replace(
              'latest_report_path = OUTPUT_DIR / "tdcc_weekly_report_latest.md"\n    dated_report_path = OUTPUT_DIR / f"tdcc_weekly_report_{latest_date}.md"',
              'latest_report_path = LATEST_DIR / "tdcc_weekly_report_latest.md"\n    dated_report_path = TDCC_HISTORY_DIR / f"tdcc_weekly_report_{latest_date}.md"'
          )

          text = text.replace(
              '- `output/tdcc_holder_ratio_latest.csv`：最新一次完整快照',
              '- `output/latest/tdcc_holder_ratio_latest.csv`：最新一次完整快照'
          )

          text = text.replace(
              '- `output/history/`：每週歷史快照',
              '- `output/history/tdcc/`：每週歷史快照'
          )

          text = text.replace(
              '- `output/tdcc_weekly_report_latest.md`：最新 Markdown 報表',
              '- `output/latest/tdcc_weekly_report_latest.md`：最新 Markdown 報表'
          )

          text = text.replace(
              '- `output/tdcc_weekly_report_日期.md`：每週 Markdown 歷史報表',
              '- `output/history/tdcc/tdcc_weekly_report_日期.md`：每週 Markdown 歷史報表'
          )

          text = text.replace(
              '- `output/tdcc_latest_ratio_raw_日期.csv`：TDCC 原始或舊版整理資料',
              '- `output/history/tdcc/tdcc_latest_ratio_raw_日期.csv`：TDCC 原始或舊版整理資料'
          )

          path.write_text(text, encoding="utf-8")
          PY

      - name: Commit patch
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add tdcc_holder_ratio_top10.py
          git commit -m "Write TDCC outputs to latest and history folders" || echo "No changes to commit"
          git push
