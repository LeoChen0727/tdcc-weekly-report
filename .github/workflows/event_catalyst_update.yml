name: Event Catalyst Update

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: daily-full-pipeline-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-event-catalysts:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3
        with:
          fetch-depth: 0
          ref: main

      - name: Enforce main-only mutation
        run: |
          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "Event Catalyst Update may mutate artifacts only from refs/heads/main" >&2
            exit 1
          fi
          test "$(git branch --show-current)" = "main"

      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests openpyxl tabulate lxml html5lib beautifulsoup4

      - name: Prepare event catalyst source tables
        run: |
          build_base_sha="$(git rev-parse HEAD)"
          echo "BUILD_BASE_SHA=$build_base_sha" >> "$GITHUB_ENV"
          echo "event_catalyst_source_refresh_base_sha=$build_base_sha"

          python scripts/update_event_catalyst_data.py
          python scripts/update_event_calendar_data.py
          python scripts/validate_event_catalyst_overlay_contract.py
          python scripts/validate_event_calendar_data.py
          python scripts/validate_catalyst_layer.py --schema-only
          python scripts/validate_daily_production_boundaries.py

          if [ ! -f output/latest/event_catalyst_historical_recovery_latest.json ]; then
            recovery_id="github-run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            workflow_run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            python scripts/build_event_catalyst_historical_recovery_manifest.py \
              --recovery-id "$recovery_id" \
              --workflow-run-id "$GITHUB_RUN_ID" \
              --workflow-run-url "$workflow_run_url"
          fi

          mkdir -p docs/latest
          source_artifacts=(
            upcoming_catalyst_calendar_latest.csv
            upcoming_catalyst_calendar_latest.md
            upcoming_macro_event_calendar_latest.csv
            upcoming_macro_event_calendar_latest.md
            calendar_data_source_status_latest.json
            calendar_data_source_status_latest.md
            catalyst_data_source_status_latest.json
            catalyst_data_source_status_latest.md
            catalyst_needs_review_latest.csv
            catalyst_needs_review_latest.md
            event_calendar_validation_latest.json
            event_calendar_validation_latest.md
            catalyst_layer_validation_latest.json
            catalyst_layer_validation_latest.md
            event_catalyst_historical_recovery_latest.json
            event_catalyst_historical_recovery_latest.md
          )
          for artifact in "${source_artifacts[@]}"; do
            cp "output/latest/$artifact" "docs/latest/$artifact"
          done
          python scripts/validate_event_catalyst_historical_recovery_manifest.py

      - name: Commit catalyst source tables
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add data/theme_events/ || true
          git add data/company_calendar/ || true
          git add data/macro_events/ || true
          git add data/fundamental_catalysts/ || true
          git add data/event_catalysts/ || true
          git add output/history/event_catalyst_recovery/ || true

          source_artifacts=(
            upcoming_catalyst_calendar_latest.csv
            upcoming_catalyst_calendar_latest.md
            upcoming_macro_event_calendar_latest.csv
            upcoming_macro_event_calendar_latest.md
            calendar_data_source_status_latest.json
            calendar_data_source_status_latest.md
            catalyst_data_source_status_latest.json
            catalyst_data_source_status_latest.md
            catalyst_needs_review_latest.csv
            catalyst_needs_review_latest.md
            event_calendar_validation_latest.json
            event_calendar_validation_latest.md
            catalyst_layer_validation_latest.json
            catalyst_layer_validation_latest.md
            event_catalyst_historical_recovery_latest.json
            event_catalyst_historical_recovery_latest.md
          )
          for artifact in "${source_artifacts[@]}"; do
            git add "output/latest/$artifact" "docs/latest/$artifact"
          done

          python scripts/validate_event_catalyst_source_refresh_scope.py
          python scripts/validate_event_catalyst_historical_recovery_manifest.py
          python scripts/validate_no_conflict_markers.py
          if ! git diff --quiet; then
            echo "Unstaged tracked files remain after event/catalyst source staging" >&2
            git status --short
            exit 1
          fi
          if [ -n "$(git ls-files --others --exclude-standard)" ]; then
            echo "Untracked files remain after event/catalyst source staging" >&2
            git status --short
            exit 1
          fi
          if git diff --cached --quiet; then
            echo "No staged event/catalyst source changes to commit"
            echo "ARTIFACT_COMMIT_CREATED=false" >> "$GITHUB_ENV"
          else
            git commit -m "Update event catalyst source tables"
            echo "ARTIFACT_COMMIT_CREATED=true" >> "$GITHUB_ENV"
          fi
          pushed_artifact_sha="$(git rev-parse HEAD)"
          echo "PUSHED_ARTIFACT_SHA=$pushed_artifact_sha" >> "$GITHUB_ENV"
          test -z "$(git status --porcelain)"
          git fetch origin main
          current_origin_main="$(git rev-parse origin/main)"
          if [ "$current_origin_main" != "$BUILD_BASE_SHA" ]; then
            echo "origin/main advanced after event/catalyst source build; refusing stale artifacts" >&2
            echo "build_base_sha=$BUILD_BASE_SHA current_origin_main=$current_origin_main" >&2
            exit 1
          fi
          git push origin HEAD:main

      - name: Dispatch and wait for catalyst Pages deploy
        if: ${{ github.ref == 'refs/heads/main' && env.ARTIFACT_COMMIT_CREATED == 'true' }}
        timeout-minutes: 40
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          target_sha="$PUSHED_ARTIFACT_SHA"
          git fetch origin main
          current_origin_main="$(git rev-parse origin/main)"
          if [ "$current_origin_main" != "$target_sha" ]; then
            echo "::error::origin/main advanced before Pages dispatch expected=$target_sha actual=$current_origin_main"
            exit 1
          fi
          previous_pages_run_id="$(gh run list \
            --workflow pages.yml \
            --branch main \
            --event workflow_dispatch \
            --commit "$target_sha" \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId // ""')"
          echo "Dispatching GitHub Pages deploy for exact artifact commit $target_sha"
          gh workflow run pages.yml --ref main

          for poll_attempt in {1..150}; do
            pages_run="$(gh run list \
              --workflow pages.yml \
              --branch main \
              --event workflow_dispatch \
              --commit "$target_sha" \
              --limit 1 \
              --json databaseId,event,headSha,headBranch,status,conclusion \
              --jq '.[0] // {}')"
            pages_run_id="$(jq -r '.databaseId // empty' <<< "$pages_run")"
            pages_event="$(jq -r '.event // empty' <<< "$pages_run")"
            pages_head_sha="$(jq -r '.headSha // empty' <<< "$pages_run")"
            pages_head_branch="$(jq -r '.headBranch // empty' <<< "$pages_run")"
            status="$(jq -r '.status // empty' <<< "$pages_run")"
            conclusion="$(jq -r '.conclusion // empty' <<< "$pages_run")"

            if [ -n "$pages_run_id" ] && [ "$pages_run_id" != "$previous_pages_run_id" ]; then
              if [ "$pages_event" != "workflow_dispatch" ] || [ "$pages_head_branch" != "main" ]; then
                echo "::error::Pages replay identity mismatch run_id=$pages_run_id event=$pages_event head_branch=$pages_head_branch"
                exit 1
              fi
              if [ "$pages_head_sha" != "$target_sha" ]; then
                echo "::error::Pages replay head SHA mismatch run_id=$pages_run_id expected=$target_sha actual=$pages_head_sha"
                exit 1
              fi
              echo "Pages run $pages_run_id poll_attempt=$poll_attempt status=$status conclusion=${conclusion:-pending} head_sha=$pages_head_sha"
              if [ "$status" = "completed" ]; then
                if [ "$conclusion" = "success" ]; then
                  exit 0
                fi
                echo "::error::GitHub Pages deploy failed conclusion=$conclusion run_id=$pages_run_id"
                exit 1
              fi
            else
              echo "Waiting for new workflow_dispatch Pages run for target_sha=$target_sha poll_attempt=$poll_attempt previous_run_id=${previous_pages_run_id:-none}"
            fi
            sleep 15
          done

          echo "::error::Timed out waiting for exact-sha GitHub Pages deploy target_sha=$target_sha"
          exit 1
