name: Event Catalyst Update

on:
  workflow_dispatch:
  schedule:
    # 09:30 and 20:30 Asia/Taipei, Monday-Saturday.
    - cron: "30 1,12 * * 1-6"

permissions:
  contents: write

jobs:
  update-event-catalysts:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests openpyxl

      - name: Prepare catalyst data tables
        run: |
          python scripts/update_event_catalyst_data.py
          python scripts/validate_catalyst_layer.py --schema-only

      - name: Commit catalyst data tables
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add data/theme_events/ || true
          git add data/fundamental_catalysts/ || true
          git add data/event_catalysts/ || true
          git add output/latest/catalyst_data_source_status_latest.md || true
          git add output/latest/catalyst_data_source_status_latest.json || true
          git add output/latest/catalyst_layer_validation_latest.md || true
          git add output/latest/catalyst_layer_validation_latest.json || true
          git commit -m "Update event catalyst data tables" || echo "No changes to commit"
          git pull --rebase origin main || true
          git push || true
