name: Official Price Backfill

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backfill-official-price:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pandas requests tabulate

      - name: Backfill official daily price
        run: python backfill_official_daily_price.py

      - name: Build per-stock price history
        run: python scripts/build_stock_price_history.py

      - name: Commit backfilled price data
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git pull --rebase --autostash origin main || true
          git add data/ output/
          git add docs/latest/stock_price_history_manifest.csv || true
          git add docs/latest/stock_price_history_manifest.json || true
          git add docs/latest/stock_price_history_manifest.md || true
          git add scripts/build_stock_price_history.py || true
          git commit -m "Backfill official daily price data" || echo "No changes to commit"
          bash scripts/ci_push_with_retry.sh main 5
