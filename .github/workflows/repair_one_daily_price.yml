name: Repair One Daily Price

on:
  workflow_dispatch:
    inputs:
      target_date:
        description: "Target date in YYYYMMDD, example: 20260414"
        required: true
        type: string
      check_code:
        description: "Stock code to check after repair, example: 5291"
        required: false
        default: "5291"
        type: string

permissions:
  contents: write

jobs:
  repair-one-daily-price:
    runs-on: ubuntu-latest

    steps:
      - name: Require production artifact write deploy key
        shell: bash
        env:
          PRODUCTION_ARTIFACT_WRITE_DEPLOY_KEY: ${{ secrets.PRODUCTION_ARTIFACT_WRITE_DEPLOY_KEY }}
        run: |
          if [ -z "${PRODUCTION_ARTIFACT_WRITE_DEPLOY_KEY}" ]; then
            echo "::error::PRODUCTION_ARTIFACT_WRITE_DEPLOY_KEY is required for artifact publishing."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ssh-key: ${{ secrets.PRODUCTION_ARTIFACT_WRITE_DEPLOY_KEY }}
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests lxml html5lib tabulate

      - name: Repair selected daily price file
        run: |
          python scripts/repair_daily_price_range.py \
            --start-date "$TARGET_DATE" \
            --end-date "$TARGET_DATE" \
            --check-code "$CHECK_CODE"
          python scripts/build_stock_price_history.py
          python scripts/validate_daily_price_history_continuity.py
        env:
          TARGET_DATE: ${{ inputs.target_date }}
          CHECK_CODE: ${{ inputs.check_code }}

      - name: Commit repaired daily price
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add data/daily_price/ data/stock_price_history/ output/latest/repair_daily_price_range_latest.* output/latest/repair_daily_price_range_check_code_latest.csv output/latest/stock_price_history_manifest.* output/latest/daily_price_history_continuity_latest.* docs/latest/stock_price_history_manifest.* || true
          git status --short
          git commit -m "Repair one daily price file" || echo "No changes to commit"
          git push
