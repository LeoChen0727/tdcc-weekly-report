name: Patch Pattern Chart Contact Sheet

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-pattern-chart-contact-sheet:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Patch pattern_chart_generator.yml
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path(".github/workflows/pattern_chart_generator.yml")
          text = path.read_text(encoding="utf-8")

          if "CONTACT_SHEET_PATH" not in text:
              text = text.replace(
                  'REPORT_PATH = LATEST_DIR / "pattern_chart_report.md"\n\n          MAX_CHARTS = 30',
                  'REPORT_PATH = LATEST_DIR / "pattern_chart_report.md"\n          CONTACT_SHEET_PATH = LATEST_DIR / "pattern_charts_contact_sheet.png"\n\n          MAX_CHARTS = 30'
              )

          if "def create_contact_sheet" not in text:
              insert_before = "          def main():"

              contact_sheet_code = r'''
          def create_contact_sheet(chart_rows):
              """
              把多張候選股圖合成一張總覽圖。
              這樣不用一張一張點開看。
              """
              if not chart_rows:
                  return None

              from PIL import Image, ImageDraw, ImageFont
              import math

              image_paths = []

              for row in chart_rows:
                  chart_rel = row.get("chart_file", "")
                  if not chart_rel:
                      continue

                  path = CHART_DIR / chart_rel

                  if path.exists():
                      image_paths.append((path, row))

              if not image_paths:
                  return None

              cols = 3
              thumb_width = 520
              thumb_height = 300
              title_height = 42
              cell_width = thumb_width
              cell_height = thumb_height + title_height

              rows = math.ceil(len(image_paths) / cols)

              sheet_width = cols * cell_width
              sheet_height = rows * cell_height

              sheet = Image.new("RGB", (sheet_width, sheet_height), "white")
              draw = ImageDraw.Draw(sheet)

              try:
                  font = ImageFont.truetype("DejaVuSans.ttf", 18)
              except Exception:
                  font = ImageFont.load_default()

              for idx, (img_path, row) in enumerate(image_paths):
                  col = idx % cols
                  row_idx = idx // cols

                  x = col * cell_width
                  y = row_idx * cell_height

                  try:
                      img = Image.open(img_path).convert("RGB")
                  except Exception:
                      continue

                  img.thumbnail((thumb_width, thumb_height))

                  paste_x = x + (thumb_width - img.width) // 2
                  paste_y = y + title_height + (thumb_height - img.height) // 2

                  sheet.paste(img, (paste_x, paste_y))

                  title = (
                      f"{row.get('代號', '')} {row.get('名稱', '')} | "
                      f"{row.get('型態階段', '')} | "
                      f"分數 {row.get('型態分數', '')}"
                  )

                  draw.text((x + 8, y + 8), title[:48], fill="black", font=font)

                  # cell border
                  draw.rectangle(
                      [x, y, x + cell_width - 1, y + cell_height - 1],
                      outline=(210, 210, 210),
                      width=1
                  )

              sheet.save(CONTACT_SHEET_PATH, quality=90)

              return CONTACT_SHEET_PATH


          '''

              text = text.replace(insert_before, contact_sheet_code + "\n" + insert_before)

          # 修改 chart_rows 讓它保留實際檔名，給 contact sheet 使用
          if '"chart_file": chart_path.name,' not in text:
              text = text.replace(
                  '"圖表": f"[查看圖]({relative_path})",',
                  '"圖表": f"[查看圖]({relative_path})",\n                      "chart_file": chart_path.name,'
              )

          # 在 report 裡加入總覽圖
          if "pattern_charts_contact_sheet.png" not in text:
              text = text.replace(
                  'report.append("> 圖中標示 A=第一低點、B=頸線、C=第二低點、Now=最新收盤。")\n              report.append("")',
                  'report.append("> 圖中標示 A=第一低點、B=頸線、C=第二低點、Now=最新收盤。")\n              report.append("")\n              report.append("## 總覽圖")\n              report.append("")\n              report.append("![Pattern Contact Sheet](pattern_charts_contact_sheet.png)")\n              report.append("")'
              )

          # 在產生報告前呼叫 contact sheet
          if "create_contact_sheet(chart_rows)" not in text:
              text = text.replace(
                  'chart_df = pd.DataFrame(chart_rows)\n\n              report = []',
                  'create_contact_sheet(chart_rows)\n\n              chart_df = pd.DataFrame(chart_rows)\n\n              report = []'
              )

          # Commit 要加入 contact sheet
          if "output/latest/pattern_charts_contact_sheet.png" not in text:
              text = text.replace(
                  "git add output/latest/pattern_chart_report.md output/latest/pattern_charts/",
                  "git add output/latest/pattern_chart_report.md output/latest/pattern_charts/ output/latest/pattern_charts_contact_sheet.png"
              )

          path.write_text(text, encoding="utf-8")
          PY

      - name: Commit patch
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add .github/workflows/pattern_chart_generator.yml
          git commit -m "Add contact sheet to pattern chart report" || echo "No changes to commit"
          git push
