name: Daily Full Pipeline

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  daily-full-pipeline:
    runs-on: ubuntu-latest

    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_BRANCH: ${{ github.ref_name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests tabulate matplotlib pillow openpyxl lxml html5lib beautifulsoup4 reportlab pypdf

      - name: Fetch latest official daily price
        run: |
          python fetch_official_daily_price.py

      - name: Commit official daily price fetch result immediately
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git pull --rebase origin "$TARGET_BRANCH" || true

          git add data/daily_price/ || true
          git add output/latest/official_daily_price_latest.csv || true
          git add output/latest/official_price_fetch_latest.md || true
          git add output/latest/official_price_fetch_latest.json || true
          git add output/debug/official_price_fetch_debug_latest.md || true
          git add fetch_official_daily_price.py || true

          git status --short
          git commit -m "Update official daily price fetch result" || echo "No changes to commit"

          PUSHED=0
          for i in 1 2 3; do
            git pull --rebase origin "$TARGET_BRANCH" || true
            if git push; then
              PUSHED=1
              echo "Push succeeded"
              break
            fi
            echo "Push failed, retry $i"
            sleep 5
          done

          if [ "$PUSHED" != "1" ]; then
            echo "Push failed after retries"
            exit 1
          fi

      - name: Pull latest after official price commit
        run: |
          git pull --rebase origin "$TARGET_BRANCH" || true

      - name: Build per-stock price history
        run: |
          python scripts/build_stock_price_history.py

      - name: Run daily stock monitor
        run: |
          python stock_daily_monitor.py

      - name: Build revenue breakout low response candidates
        run: |
          python build_revenue_breakout_low_response.py

      - name: Run current holdings pattern analysis
        run: |
          python current_holdings_pattern.py

      - name: Build data freshness status after stock monitor
        run: |
          python build_data_freshness_latest.py

      - name: Commit daily stock monitor and current holdings output
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git pull --rebase origin "$TARGET_BRANCH" || true

          git add data/ || true
          git add output/latest/stock_price_history_manifest.csv || true
          git add output/latest/stock_price_history_manifest.json || true
          git add output/latest/stock_price_history_manifest.md || true
          git add docs/latest/stock_price_history_manifest.csv || true
          git add docs/latest/stock_price_history_manifest.json || true
          git add docs/latest/stock_price_history_manifest.md || true

          git add output/latest/stock_monitor_latest.md || true
          git add output/latest/breakout_latest.csv || true
          git add output/latest/range_rebound_watch_latest.csv || true
          git add output/latest/revenue_pullback_latest.csv || true
          git add output/latest/pullback_rebound_latest.csv || true

          git add output/latest/revenue_breakout_low_response_latest.csv || true
          git add output/latest/revenue_breakout_low_response_latest.md || true

          git add output/latest/current_holdings_pattern_latest.csv || true
          git add output/latest/current_holdings_pattern_latest.md || true
          git add output/latest/charts/current_holdings/ || true

          git add output/latest/data_freshness_latest.md || true
          git add output/latest/data_freshness_latest.csv || true
          git add scripts/build_stock_price_history.py || true

          git status --short
          git commit -m "Update daily stock monitor and current holdings report" || echo "No changes to commit"

          PUSHED=0
          for i in 1 2 3; do
            git pull --rebase origin "$TARGET_BRANCH" || true
            if git push; then
              PUSHED=1
              echo "Push succeeded"
              break
            fi
            echo "Push failed, retry $i"
            sleep 5
          done

          if [ "$PUSHED" != "1" ]; then
            echo "Push failed after retries"
            exit 1
          fi

      - name: Trigger Pattern Scan
        run: |
          gh workflow run pattern_scan.yml --ref "$TARGET_BRANCH"
          sleep 10

      - name: Wait for Pattern Scan
        run: |
          RUN_ID=$(gh run list --workflow pattern_scan.yml --branch "$TARGET_BRANCH" --limit 1 --json databaseId --jq '.[0].databaseId')
          echo "Pattern Scan run id: $RUN_ID"
          gh run watch "$RUN_ID" --exit-status

      - name: Trigger Pattern Chart Generator
        run: |
          gh workflow run pattern_chart_generator.yml --ref "$TARGET_BRANCH"
          sleep 10

      - name: Wait for Pattern Chart Generator
        run: |
          RUN_ID=$(gh run list --workflow pattern_chart_generator.yml --branch "$TARGET_BRANCH" --limit 1 --json databaseId --jq '.[0].databaseId')
          echo "Pattern Chart Generator run id: $RUN_ID"
          gh run watch "$RUN_ID" --exit-status

      - name: Pull latest outputs after child workflows
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          echo "Before pull status:"
          git status --short

          git stash push -u -m "Temporary stash before pulling child workflow outputs" || true

          git pull --rebase origin "$TARGET_BRANCH"

          git stash pop || true

          echo "After pull status:"
          git status --short

      - name: Generate candidate charts and manifest
        run: |
          python generate_candidate_charts.py

      - name: Build all candidates latest files
        run: |
          python build_all_candidates_latest.py

      - name: Fetch official warrant daily data
        run: |
          python scripts/fetch_official_warrant_daily.py

      - name: Build stock-level warrant flow
        run: |
          python build_warrant_flow_latest.py

      - name: Merge warrant flow into candidates
        run: |
          python merge_warrant_flow_into_candidates.py

      - name: Apply revenue industry applicability rules
        run: |
          python scripts/apply_revenue_industry_applicability.py

      - name: Build data freshness status
        run: |
          python build_data_freshness_latest.py

      - name: Update market benchmark history
        run: |
          python scripts/update_market_index_history.py

      - name: Build warrant market report
        run: |
          python scripts/build_warrant_market_report.py

      - name: Build daily market report artifacts
        run: |
          python build_daily_market_report_artifacts.py

      - name: Ensure English report aliases
        run: |
          python ensure_report_aliases.py

      - name: Generate fixed daily market PDF reports
        run: |
          python scripts/generate_daily_market_pdf.py

      - name: Validate fixed daily market PDF reports
        run: |
          python scripts/validate_daily_market_report.py

      - name: Update daily candidate signal tracking
        run: |
          python scripts/update_daily_candidate_signal_log.py
          python scripts/update_daily_candidate_signal_performance.py
          python scripts/generate_daily_signal_performance_report.py
          python scripts/validate_daily_signal_performance.py

      - name: Build ChatGPT daily report packet
        run: |
          python build_chatgpt_daily_report_packet.py

      - name: Build ChatGPT daily report rules
        run: |
          python build_chatgpt_daily_report_rules.py

      - name: Prepare GitHub Pages packet and rules files
        run: |
          mkdir -p docs/latest

          cp output/latest/chatgpt_daily_report_packet_latest.txt docs/latest/chatgpt_daily_report_packet_latest.txt
          cp output/latest/CHATGPT_DAILY_REPORT_RULES.txt docs/latest/CHATGPT_DAILY_REPORT_RULES.txt
          cp output/latest/pdf_kline_chart_status_latest.md docs/latest/pdf_kline_chart_status_latest.md || true
          cp output/latest/daily_market_curated_report_latest.pdf docs/latest/daily_market_curated_report_latest.pdf || true
          cp output/latest/daily_market_full_table_report_latest.pdf docs/latest/daily_market_full_table_report_latest.pdf || true
          cp output/latest/daily_market_report_validation_latest.md docs/latest/daily_market_report_validation_latest.md || true
          cp output/latest/daily_signal_performance_weekly_latest.pdf docs/latest/daily_signal_performance_weekly_latest.pdf || true
          cp output/latest/daily_signal_performance_monthly_latest.pdf docs/latest/daily_signal_performance_monthly_latest.pdf || true
          cp output/latest/warrant_market_report_latest.pdf docs/latest/warrant_market_report_latest.pdf || true

          {
            echo "main_price_date=pending"
            echo "report_ready=pending"
            echo "preferred_chatgpt_url=pending"
            echo "rules_pages_url=https://LeoChen0727.github.io/tdcc-weekly-report/latest/CHATGPT_DAILY_REPORT_RULES.txt"
            echo "rules_raw_url=https://raw.githubusercontent.com/LeoChen0727/tdcc-weekly-report/main/output/latest/CHATGPT_DAILY_REPORT_RULES.txt"
          } > docs/latest/READ_ME_FIRST_DAILY_REPORT.txt

      - name: Commit report artifacts, packets, and rules first
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git pull --rebase origin "$TARGET_BRANCH" || true

          git add output/latest/chart_manifest.csv || true
          git add output/latest/contact_sheet_manifest.csv || true
          git add output/latest/charts/ || true
          git add output/latest/contact_sheets/ || true
          git add data/institutional_investor_flow/ || true
          git add output/latest/institutional_investor_flow_latest.csv || true
          git add output/latest/all_candidates_latest.csv || true
          git add output/latest/all_candidates_latest.xlsx || true
          git add output/latest/all_candidates_latest.md || true

          git add output/latest/stock_monitor_latest.md || true
          git add output/latest/breakout_latest.csv || true
          git add output/latest/range_rebound_watch_latest.csv || true
          git add output/latest/revenue_pullback_latest.csv || true
          git add output/latest/pullback_rebound_latest.csv || true

          git add output/latest/revenue_breakout_low_response_latest.csv || true
          git add output/latest/revenue_breakout_low_response_latest.md || true

          git add output/latest/current_holdings_pattern_latest.csv || true
          git add output/latest/current_holdings_pattern_latest.md || true
          git add output/latest/charts/current_holdings/ || true

          git add output/latest/warrant_daily_raw_latest.csv || true
          git add output/latest/warrant_daily_fetch_latest.md || true
          git add output/latest/warrant_flow_latest.csv || true
          git add output/latest/warrant_flow_latest.md || true
          git add output/latest/warrant_flow_merge_latest.md || true

          git add output/debug/warrant_fetch_debug_latest.md || true
          git add output/debug/warrant_fetch_debug_latest.csv || true
          git add output/history/warrant_daily/ || true
          git add output/history/warrant_flow/ || true

          git add output/latest/data_freshness_latest.md || true
          git add output/latest/data_freshness_latest.csv || true
          git add output/latest/revenue_industry_applicability_latest.md || true

          git add output/latest/report_manifest_latest.md || true
          git add output/latest/report_manifest_latest.json || true
          git add output/latest/pdf_kline_chart_status_latest.csv || true
          git add output/latest/pdf_kline_chart_status_latest.json || true
          git add output/latest/pdf_kline_chart_status_latest.md || true
          git add output/latest/daily_market_curated_report_latest.pdf || true
          git add output/latest/daily_market_full_table_report_latest.pdf || true
          git add output/latest/daily_market_pdf_report_manifest_latest.json || true
          git add output/latest/daily_market_pdf_report_manifest_latest.md || true
          git add output/latest/daily_market_report_validation_latest.json || true
          git add output/latest/daily_market_report_validation_latest.md || true
          git add output/latest/daily_signal_performance_summary_latest.csv || true
          git add output/latest/daily_signal_performance_summary_latest.md || true
          git add output/latest/daily_signal_performance_weekly_latest.md || true
          git add output/latest/daily_signal_performance_weekly_latest.pdf || true
          git add output/latest/daily_signal_performance_monthly_latest.md || true
          git add output/latest/daily_signal_performance_monthly_latest.pdf || true
          git add output/latest/daily_signal_performance_validation_latest.md || true
          git add output/history/daily_signals/ || true
          git add data/market_index_history.csv || true
          git add output/latest/market_benchmark_latest.csv || true
          git add data/warrant_daily/ || true
          git add data/warrant_flow_by_stock/ || true
          git add output/latest/warrant_market_report_latest.md || true
          git add output/latest/warrant_market_report_latest.pdf || true
          git add output/latest/warrant_flow_by_stock_latest.csv || true
          git add output/latest/warrant_sector_heat_latest.csv || true
          git add output/latest/warrant_signal_performance_latest.md || true

          git add output/latest/每日全市場候選股監測報告_精華版.md || true
          git add output/latest/每日全市場候選股監測報告_精華版.pdf || true
          git add output/latest/完整候選股清單_完整版.md || true
          git add output/latest/完整候選股清單_完整版表格.pdf || true

          git add output/latest/daily_market_summary_latest.md || true
          git add output/latest/daily_market_summary_latest.pdf || true
          git add output/latest/daily_market_full_latest.md || true
          git add output/latest/daily_market_full_latest.pdf || true

          git add output/latest/chatgpt_daily_report_packet_latest.txt || true
          git add output/latest/CHATGPT_DAILY_REPORT_PACKET.txt || true
          git add output/latest/chatgpt_daily_report_packet_manifest.json || true

          git add output/latest/CHATGPT_DAILY_REPORT_RULES.txt || true
          git add docs/latest/CHATGPT_DAILY_REPORT_RULES.txt || true

          git add output/history/reports/ || true

          git add docs/latest/chatgpt_daily_report_packet_latest.txt || true
          git add docs/latest/READ_ME_FIRST_DAILY_REPORT.txt || true
          git add docs/latest/pdf_kline_chart_status_latest.md || true
          git add docs/latest/daily_market_curated_report_latest.pdf || true
          git add docs/latest/daily_market_full_table_report_latest.pdf || true
          git add docs/latest/daily_market_report_validation_latest.md || true
          git add docs/latest/daily_signal_performance_weekly_latest.pdf || true
          git add docs/latest/daily_signal_performance_monthly_latest.pdf || true
          git add docs/latest/warrant_market_report_latest.pdf || true

          git add build_data_freshness_latest.py || true
          git add build_daily_market_report_artifacts.py || true
          git add ensure_report_aliases.py || true
          git add build_chatgpt_daily_report_packet.py || true
          git add build_chatgpt_daily_report_rules.py || true
          git add current_holdings_pattern.py || true
          git add config/current_holdings.json || true
          git add scripts/fetch_official_warrant_daily.py || true
          git add scripts/tracking_utils.py || true
          git add scripts/apply_revenue_industry_applicability.py || true
          git add scripts/update_market_index_history.py || true
          git add scripts/update_daily_candidate_signal_log.py || true
          git add scripts/update_daily_candidate_signal_performance.py || true
          git add scripts/generate_daily_signal_performance_report.py || true
          git add scripts/validate_daily_signal_performance.py || true
          git add scripts/build_warrant_market_report.py || true
          git add build_warrant_flow_latest.py || true
          git add merge_warrant_flow_into_candidates.py || true
          git add build_all_candidates_latest.py || true
          git add fetch_official_daily_price.py || true
          git add stock_daily_monitor.py || true
          git add scripts/generate_daily_market_pdf.py || true
          git add scripts/validate_daily_market_report.py || true

          git status --short
          git commit -m "Update report artifacts, ChatGPT packet, and rules" || echo "No changes to commit"

          PUSHED=0
          for i in 1 2 3; do
            git pull --rebase origin "$TARGET_BRANCH" || true
            if git push; then
              PUSHED=1
              echo "Push succeeded"
              break
            fi
            echo "Push failed, retry $i"
            sleep 5
          done

          if [ "$PUSHED" != "1" ]; then
            echo "Push failed after retries"
            exit 1
          fi

          ARTIFACT_COMMIT_SHA=$(git rev-parse HEAD)
          echo "ARTIFACT_COMMIT_SHA=$ARTIFACT_COMMIT_SHA" >> "$GITHUB_ENV"
          echo "Artifact commit sha: $ARTIFACT_COMMIT_SHA"

      - name: Wait briefly for GitHub Pages and raw propagation
        run: |
          sleep 30

      - name: Publish readme and multi-entry URL check
        run: |
          python publish_chatgpt_report_readme_and_check.py

      - name: Commit readme and publish check
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git pull --rebase origin "$TARGET_BRANCH" || true

          git add output/latest/READ_ME_FIRST_DAILY_REPORT.txt || true
          git add output/latest/report_publish_check_latest.md || true
          git add output/latest/report_publish_check_latest.json || true

          git add docs/latest/READ_ME_FIRST_DAILY_REPORT.txt || true
          git add docs/latest/chatgpt_daily_report_packet_latest.txt || true
          git add docs/latest/CHATGPT_DAILY_REPORT_RULES.txt || true
          git add docs/latest/pdf_kline_chart_status_latest.md || true
          git add docs/latest/daily_market_curated_report_latest.pdf || true
          git add docs/latest/daily_market_full_table_report_latest.pdf || true
          git add docs/latest/daily_market_report_validation_latest.md || true
          git add docs/latest/daily_signal_performance_weekly_latest.pdf || true
          git add docs/latest/daily_signal_performance_monthly_latest.pdf || true
          git add docs/latest/warrant_market_report_latest.pdf || true

          git add output/latest/CHATGPT_DAILY_REPORT_RULES.txt || true
          git add output/latest/pdf_kline_chart_status_latest.csv || true
          git add output/latest/pdf_kline_chart_status_latest.json || true
          git add output/latest/pdf_kline_chart_status_latest.md || true
          git add output/latest/daily_market_curated_report_latest.pdf || true
          git add output/latest/daily_market_full_table_report_latest.pdf || true
          git add output/latest/daily_market_pdf_report_manifest_latest.json || true
          git add output/latest/daily_market_pdf_report_manifest_latest.md || true
          git add output/latest/daily_market_report_validation_latest.json || true
          git add output/latest/daily_market_report_validation_latest.md || true
          git add output/latest/daily_signal_performance_summary_latest.csv || true
          git add output/latest/daily_signal_performance_summary_latest.md || true
          git add output/latest/daily_signal_performance_weekly_latest.md || true
          git add output/latest/daily_signal_performance_weekly_latest.pdf || true
          git add output/latest/daily_signal_performance_monthly_latest.md || true
          git add output/latest/daily_signal_performance_monthly_latest.pdf || true
          git add output/latest/daily_signal_performance_validation_latest.md || true
          git add output/history/daily_signals/ || true
          git add data/market_index_history.csv || true
          git add output/latest/market_benchmark_latest.csv || true
          git add output/latest/institutional_investor_flow_latest.csv || true
          git add data/institutional_investor_flow/ || true
          git add output/latest/warrant_market_report_latest.md || true
          git add output/latest/warrant_market_report_latest.pdf || true
          git add output/latest/warrant_flow_by_stock_latest.csv || true
          git add output/latest/warrant_sector_heat_latest.csv || true
          git add output/latest/warrant_signal_performance_latest.md || true
          git add data/warrant_daily/ || true
          git add data/warrant_flow_by_stock/ || true
          git add output/history/reports/ || true

          git add publish_chatgpt_report_readme_and_check.py || true
          git add scripts/generate_daily_market_pdf.py || true
          git add scripts/validate_daily_market_report.py || true
          git add scripts/tracking_utils.py || true
          git add scripts/update_market_index_history.py || true
          git add scripts/update_daily_candidate_signal_log.py || true
          git add scripts/update_daily_candidate_signal_performance.py || true
          git add scripts/generate_daily_signal_performance_report.py || true
          git add scripts/validate_daily_signal_performance.py || true

          git status --short
          git commit -m "Publish ChatGPT daily report readme, rules, and multi-entry checks" || echo "No changes to commit"

          PUSHED=0
          for i in 1 2 3; do
            git pull --rebase origin "$TARGET_BRANCH" || true
            if git push; then
              PUSHED=1
              echo "Push succeeded"
              break
            fi
            echo "Push failed, retry $i"
            sleep 5
          done

          if [ "$PUSHED" != "1" ]; then
            echo "Push failed after retries"
            exit 1
          fi
