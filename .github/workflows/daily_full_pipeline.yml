          cp output/latest/upcoming_macro_event_calendar_latest.md docs/latest/upcoming_macro_event_calendar_latest.md || true
          cp output/latest/calendar_data_source_status_latest.md docs/latest/calendar_data_source_status_latest.md || true
          cp output/latest/event_calendar_validation_latest.md docs/latest/event_calendar_validation_latest.md || true
          cp output/latest/catalyst_needs_review_latest.md docs/latest/catalyst_needs_review_latest.md || true
          cp output/latest/daily_theme_status_history_latest.csv docs/latest/daily_theme_status_history_latest.csv || true
          cp output/latest/daily_theme_status_history_latest.md docs/latest/daily_theme_status_history_latest.md || true
          cp output/latest/weekly_surge_technical_filter_grid_latest.csv docs/latest/weekly_surge_technical_filter_grid_latest.csv || true
          cp output/latest/weekly_surge_technical_filter_grid_latest.md docs/latest/weekly_surge_technical_filter_grid_latest.md || true
          cp output/latest/weekly_surge_multifactor_filter_grid_latest.csv docs/latest/weekly_surge_multifactor_filter_grid_latest.csv || true
          cp output/latest/weekly_surge_multifactor_filter_grid_latest.md docs/latest/weekly_surge_multifactor_filter_grid_latest.md || true
          cp output/latest/weekly_surge_multifactor_candidates_latest.csv docs/latest/weekly_surge_multifactor_candidates_latest.csv || true
          cp output/latest/weekly_surge_multifactor_candidates_latest.md docs/latest/weekly_surge_multifactor_candidates_latest.md || true
          cp output/latest/weekly_surge_strict_parameter_search_latest.csv docs/latest/weekly_surge_strict_parameter_search_latest.csv || true
