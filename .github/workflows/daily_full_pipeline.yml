name: Daily Full Pipeline

on:
  workflow_dispatch:
    inputs:
      run_child_pattern_workflows:
        description: "Run pattern_scan and pattern_chart_generator child workflows"
        required: false
        default: "false"
      run_raw_health_check:
        description: "Run full raw/pages/api health check for all core files"
        required: false
        default: "false"
      run_individual_stock_outputs:
        description: "Build per-stock ChatGPT packets, 180d windows, raw data indexes"
        required: false
        default: "false"

permissions:
  contents: write
  actions: write

concurrency:
  group: daily-full-pipeline-${{ github.ref }}
  cancel-in-progress: false

jobs:
  daily-full-pipeline:
    runs-on: ubuntu-latest

    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_BRANCH: ${{ github.ref_name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests tabulate matplotlib pillow openpyxl lxml html5lib beautifulsoup4 reportlab pypdf

      - name: Fetch latest official daily price
        run: |
          python fetch_official_daily_price.py

      - name: Commit official daily price fetch result immediately
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git pull --rebase --autostash origin "$TARGET_BRANCH" || true

          git add data/daily_price/ || true
          git add output/latest/official_daily_price_latest.csv || true
          git add output/latest/official_price_fetch_latest.md || true
          git add output/latest/official_price_fetch_latest.json || true
          git add output/debug/official_price_fetch_debug_latest.md || true
          git add fetch_official_daily_price.py || true

          git status --short
          git commit -m "Update official daily price fetch result" || echo "No changes to commit"

          bash scripts/ci_push_with_retry.sh "$TARGET_BRANCH" 5

      - name: Pull latest after official price commit
        run: |
          git pull --rebase --autostash origin "$TARGET_BRANCH" || true

      - name: Build per-stock price history
        run: |
          python scripts/build_stock_price_history.py

      - name: Run daily stock monitor
        run: |
          python stock_daily_monitor.py

      - name: Validate daily candidate regression cases
        run: |
          python scripts/validate_daily_candidate_regression_cases.py

      - name: Build revenue breakout low response candidates
        run: |
          python build_revenue_breakout_low_response.py

      - name: Build data freshness status after stock monitor
        run: |
          python build_data_freshness_latest.py

      - name: Fetch market abnormal status
        run: |
          python scripts/fetch_market_abnormal_status.py

      - name: Commit daily stock monitor output
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git pull --rebase --autostash origin "$TARGET_BRANCH" || true

          git add data/stock_price_history/ || true
          git add output/latest/stock_price_history_manifest.csv || true
          git add output/latest/stock_price_history_manifest.json || true
          git add output/latest/stock_price_history_manifest.md || true
          git add docs/latest/stock_price_history_manifest.csv || true
          git add docs/latest/stock_price_history_manifest.json || true
          git add docs/latest/stock_price_history_manifest.md || true

          git add output/latest/stock_monitor_latest.md || true
          git add output/latest/breakout_latest.csv || true
          git add output/latest/range_rebound_watch_latest.csv || true
          git add output/latest/daily_pattern_watch_latest.csv || true
          git add output/latest/daily_candidate_regression_2484_latest.csv || true
          git add output/latest/daily_candidate_regression_2484_latest.md || true
          git add output/latest/daily_candidate_regression_2484_latest.json || true
          git add output/latest/daily_candidate_regression_8069_latest.csv || true
          git add output/latest/daily_candidate_regression_8069_latest.md || true
          git add output/latest/daily_candidate_regression_8069_latest.json || true
          git add output/latest/revenue_pullback_latest.csv || true
          git add output/latest/pullback_rebound_latest.csv || true

          git add output/latest/revenue_breakout_low_response_latest.csv || true
          git add output/latest/revenue_breakout_low_response_latest.md || true

          git add output/latest/data_freshness_latest.md || true
          git add output/latest/data_freshness_latest.csv || true
          git add output/latest/market_abnormal_status_latest.* || true
          git add docs/latest/market_abnormal_status_latest.* || true
          git add output/history/market_abnormal_status/ || true
          git add data/market_abnormal_status/ || true
          git add scripts/build_stock_price_history.py || true

          git status --short
          git commit -m "Update daily stock monitor report" || echo "No changes to commit"

          bash scripts/ci_push_with_retry.sh "$TARGET_BRANCH" 5

      - name: Trigger and wait for Pattern Scan
        if: ${{ github.event.inputs.run_child_pattern_workflows == 'true' }}
        run: |
          WORKFLOW_FILE="pattern_scan.yml"
          PREVIOUS_RUN_ID=$(gh run list --workflow "$WORKFLOW_FILE" --branch "$TARGET_BRANCH" --limit 1 --json databaseId --jq '.[0].databaseId' 2>/dev/null || true)
          if [ "$PREVIOUS_RUN_ID" = "null" ]; then
            PREVIOUS_RUN_ID=""
          fi
          echo "Previous $WORKFLOW_FILE run id: ${PREVIOUS_RUN_ID:-none}"

          gh workflow run "$WORKFLOW_FILE" --ref "$TARGET_BRANCH"

          RUN_ID=""
          for i in $(seq 1 60); do
            RUN_ID=$(gh run list --workflow "$WORKFLOW_FILE" --branch "$TARGET_BRANCH" --limit 1 --json databaseId --jq '.[0].databaseId' 2>/dev/null || true)
            if [ "$RUN_ID" = "null" ]; then
              RUN_ID=""
            fi
            if [ -n "$RUN_ID" ] && [ "$RUN_ID" != "$PREVIOUS_RUN_ID" ]; then
              break
            fi
            echo "Waiting for new $WORKFLOW_FILE run to appear... attempt $i"
            sleep 5
          done

          if [ -z "$RUN_ID" ] || [ "$RUN_ID" = "$PREVIOUS_RUN_ID" ]; then
            echo "Failed to locate newly triggered $WORKFLOW_FILE run"
            exit 1
          fi

          echo "Pattern Scan run id: $RUN_ID"
          gh run watch "$RUN_ID" --exit-status

      - name: Trigger and wait for Pattern Chart Generator
        if: ${{ github.event.inputs.run_child_pattern_workflows == 'true' }}
        run: |
          WORKFLOW_FILE="pattern_chart_generator.yml"
          PREVIOUS_RUN_ID=$(gh run list --workflow "$WORKFLOW_FILE" --branch "$TARGET_BRANCH" --limit 1 --json databaseId --jq '.[0].databaseId' 2>/dev/null || true)
          if [ "$PREVIOUS_RUN_ID" = "null" ]; then
            PREVIOUS_RUN_ID=""
          fi
          echo "Previous $WORKFLOW_FILE run id: ${PREVIOUS_RUN_ID:-none}"

          gh workflow run "$WORKFLOW_FILE" --ref "$TARGET_BRANCH"

          RUN_ID=""
          for i in $(seq 1 60); do
            RUN_ID=$(gh run list --workflow "$WORKFLOW_FILE" --branch "$TARGET_BRANCH" --limit 1 --json databaseId --jq '.[0].databaseId' 2>/dev/null || true)
            if [ "$RUN_ID" = "null" ]; then
              RUN_ID=""
            fi
            if [ -n "$RUN_ID" ] && [ "$RUN_ID" != "$PREVIOUS_RUN_ID" ]; then
              break
            fi
            echo "Waiting for new $WORKFLOW_FILE run to appear... attempt $i"
            sleep 5
          done

          if [ -z "$RUN_ID" ] || [ "$RUN_ID" = "$PREVIOUS_RUN_ID" ]; then
            echo "Failed to locate newly triggered $WORKFLOW_FILE run"
            exit 1
          fi

          echo "Pattern Chart Generator run id: $RUN_ID"
          gh run watch "$RUN_ID" --exit-status

      - name: Pull latest outputs after child workflows
        if: ${{ github.event.inputs.run_child_pattern_workflows == 'true' }}
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          echo "Before pull status:"
          git status --short

          git stash push -u -m "Temporary stash before pulling child workflow outputs" || true

          git pull --rebase --autostash origin "$TARGET_BRANCH"

          git stash pop || true

          echo "After pull status:"
          git status --short

      - name: Generate candidate charts and manifest
        run: |
          python generate_candidate_charts.py

      - name: Build all candidates latest files
        run: |
          python build_all_candidates_latest.py

      - name: Fetch official warrant daily data
        run: |
          python scripts/fetch_official_warrant_daily.py

      - name: Build stock-level warrant flow
        run: |
          python build_warrant_flow_latest.py

      - name: Merge warrant flow into candidates
        run: |
          python merge_warrant_flow_into_candidates.py

      - name: Apply revenue industry applicability rules
        run: |
          python scripts/apply_revenue_industry_applicability.py

      - name: Update catalyst data tables
        run: |
          python scripts/update_event_calendar_data.py
          python scripts/update_event_catalyst_data.py

      - name: Apply fundamental and event catalyst layer
        run: |
          python scripts/apply_fundamental_catalyst_layer.py

      - name: Update candidate repeat appearance tracking
        run: |
          python scripts/update_daily_candidate_signal_log.py
          python scripts/build_candidate_repeat_appearance.py
          python scripts/validate_candidate_repeat_appearance.py

      - name: Build stock theme taxonomy
        run: |
          python scripts/build_stock_theme_taxonomy.py
          python scripts/validate_stock_theme_taxonomy.py

      - name: Build daily candidate decision layer
        run: |
          python scripts/build_daily_candidate_decision_layer.py
          python scripts/validate_daily_candidate_decision_layer.py

      - name: Build daily theme leadership layer
        run: |
          python scripts/build_daily_theme_leadership_layer.py
          python scripts/validate_daily_theme_leadership_layer.py

      - name: Build volume breakout watch
        run: |
          python scripts/build_volume_breakout_watch.py --latest-only
          python scripts/validate_volume_breakout_watch.py --latest-only

      - name: Build volume attack theme layer
        run: |
          python scripts/build_volume_attack_theme_layer.py
          python scripts/validate_volume_attack_theme_layer.py

      - name: Build non-revenue momentum watch
        run: |
          python scripts/build_non_revenue_momentum_watch.py

      - name: Build daily candidate model layer
        run: |
          python scripts/build_daily_candidate_model_layer.py
          python scripts/validate_daily_candidate_model_layer.py

      - name: Update daily theme status history
        run: |
          python scripts/update_daily_theme_status_history.py

      - name: Build data freshness status
        run: |
          python build_data_freshness_latest.py

      - name: Update market benchmark history
        run: |
          python scripts/update_market_index_history.py

      - name: Build market regime dashboard
        run: |
          python scripts/fetch_futures_options_indicators.py
          python scripts/build_market_regime_dashboard.py
          python scripts/validate_market_regime_dashboard.py

      - name: Build daily short-term specialty packet
        run: |
          python scripts/build_daily_short_term_specialty_packet.py

      - name: Build warrant market report
        run: |
          python scripts/build_warrant_market_report.py

      - name: Build daily market report artifacts
        run: |
          python build_daily_market_report_artifacts.py

      - name: Ensure English report aliases
        run: |
          python ensure_report_aliases.py

      - name: Generate fixed daily market PDF reports
        run: |
          python scripts/generate_daily_market_pdf.py

      - name: Validate fixed daily market PDF reports
        run: |
          python scripts/validate_daily_market_report.py

      - name: Build ChatGPT indicator usage guide
        run: |
          python scripts/build_chatgpt_indicator_usage_guide.py

      - name: Build ChatGPT daily report packet
        run: |
          python build_chatgpt_daily_report_packet.py

      - name: Build ChatGPT daily report rules
        run: |
          python build_chatgpt_daily_report_rules.py

      - name: Validate catalyst layer
        run: |
          python scripts/validate_event_calendar_data.py
          python scripts/validate_catalyst_layer.py

      - name: Prepare GitHub Pages packet and rules files
        run: |
          mkdir -p docs/latest

          cp output/latest/chatgpt_daily_report_packet_latest.txt docs/latest/chatgpt_daily_report_packet_latest.txt
          cp output/latest/CHATGPT_DAILY_REPORT_RULES.txt docs/latest/CHATGPT_DAILY_REPORT_RULES.txt
          cp output/latest/pdf_kline_chart_status_latest.md docs/latest/pdf_kline_chart_status_latest.md || true
          cp output/latest/daily_market_curated_report_latest.pdf docs/latest/daily_market_curated_report_latest.pdf || true
          cp output/latest/daily_market_full_table_report_latest.pdf docs/latest/daily_market_full_table_report_latest.pdf || true
          cp output/latest/daily_market_report_validation_latest.md docs/latest/daily_market_report_validation_latest.md || true
          cp output/latest/warrant_market_report_latest.pdf docs/latest/warrant_market_report_latest.pdf || true
          cp output/latest/catalyst_summary_latest.md docs/latest/catalyst_summary_latest.md || true
          cp output/latest/catalyst_layer_validation_latest.md docs/latest/catalyst_layer_validation_latest.md || true
          cp output/latest/upcoming_catalyst_calendar_latest.md docs/latest/upcoming_catalyst_calendar_latest.md || true
          cp output/latest/upcoming_macro_event_calendar_latest.md docs/latest/upcoming_macro_event_calendar_latest.md || true
          cp output/latest/calendar_data_source_status_latest.md docs/latest/calendar_data_source_status_latest.md || true
          cp output/latest/event_calendar_validation_latest.md docs/latest/event_calendar_validation_latest.md || true
          cp output/latest/catalyst_needs_review_latest.md docs/latest/catalyst_needs_review_latest.md || true
          cp output/latest/daily_theme_status_history_latest.csv docs/latest/daily_theme_status_history_latest.csv || true
          cp output/latest/daily_theme_status_history_latest.md docs/latest/daily_theme_status_history_latest.md || true
          cp output/latest/daily_short_term_specialty_packet_latest.md docs/latest/daily_short_term_specialty_packet_latest.md || true
          cp output/latest/daily_candidate_model_parameters_latest.csv docs/latest/daily_candidate_model_parameters_latest.csv || true
          cp output/latest/daily_candidate_model_parameters_latest.md docs/latest/daily_candidate_model_parameters_latest.md || true
          cp output/latest/daily_candidate_model_signals_latest.csv docs/latest/daily_candidate_model_signals_latest.csv || true
          cp output/latest/daily_candidate_model_signals_latest.md docs/latest/daily_candidate_model_signals_latest.md || true
          cp output/latest/daily_candidate_model_layer_packet_latest.md docs/latest/daily_candidate_model_layer_packet_latest.md || true
          cp output/latest/daily_candidate_model_layer_validation_latest.json docs/latest/daily_candidate_model_layer_validation_latest.json || true
          cp output/latest/daily_candidate_model_layer_validation_latest.md docs/latest/daily_candidate_model_layer_validation_latest.md || true
          cp output/latest/daily_candidate_group_rotation_latest.csv docs/latest/daily_candidate_group_rotation_latest.csv || true
          cp output/latest/daily_candidate_group_rotation_latest.md docs/latest/daily_candidate_group_rotation_latest.md || true
          cp output/latest/non_revenue_momentum_watch_latest.csv docs/latest/non_revenue_momentum_watch_latest.csv || true
          cp output/latest/non_revenue_momentum_watch_latest.md docs/latest/non_revenue_momentum_watch_latest.md || true
          cp output/latest/market_abnormal_status_latest.csv docs/latest/market_abnormal_status_latest.csv || true
          cp output/latest/market_abnormal_status_latest.md docs/latest/market_abnormal_status_latest.md || true

          {
            echo "main_price_date=pending"
            echo "report_ready=pending"
            echo "preferred_chatgpt_url=pending"
            echo "rules_pages_url=https://LeoChen0727.github.io/tdcc-weekly-report/latest/CHATGPT_DAILY_REPORT_RULES.txt"
            echo "rules_raw_url=https://raw.githubusercontent.com/LeoChen0727/tdcc-weekly-report/main/output/latest/CHATGPT_DAILY_REPORT_RULES.txt"
          } > docs/latest/READ_ME_FIRST_DAILY_REPORT.txt

      - name: Commit report artifacts, packets, and rules first
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git pull --rebase --autostash origin "$TARGET_BRANCH" || true

          # Daily pipeline only stages daily report outputs and source data.
          # Heavy research/backtest outputs are maintained by research_backtest_pipeline.yml.
          git add output/latest/ docs/latest/ || true
          git add data/institutional_investor_flow/ data/warrant_daily/ data/warrant_flow_by_stock/ data/futures_options/ || true
          git add data/theme_events/ data/company_calendar/ data/macro_events/ data/fundamental_catalysts/ data/event_catalysts/ || true
          git add data/market_index_history.csv data/market_index_ohlc_history.csv || true
          git add output/history/reports/ output/history/warrant_daily/ output/history/warrant_flow/ || true
          git add output/history/daily_signals/daily_candidate_signal_log.csv || true
          git add output/history/daily_signals/daily_theme_status_history.csv || true
          git add output/history/daily_candidates/daily_theme_status_history.csv || true
          git add docs/data/stock_price_history/ docs/data/tdcc_stock_history/ || true

          git status --short
          git commit -m "Update daily report artifacts and packets" || echo "No changes to commit"

          bash scripts/ci_push_with_retry.sh "$TARGET_BRANCH" 5

          ARTIFACT_COMMIT_SHA=$(git rev-parse HEAD)
          echo "ARTIFACT_COMMIT_SHA=$ARTIFACT_COMMIT_SHA" >> "$GITHUB_ENV"
          echo "Artifact commit sha: $ARTIFACT_COMMIT_SHA"
      - name: Wait briefly for GitHub Pages and raw propagation
        run: |
          sleep 30

      - name: Build individual raw data indexes and raw health status
        if: ${{ github.event.inputs.run_individual_stock_outputs == 'true' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python scripts/build_individual_stock_chatgpt_packets.py
          python scripts/build_individual_stock_raw_data_index.py

      - name: Check raw data health
        if: ${{ github.event.inputs.run_raw_health_check == 'true' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python scripts/check_raw_data_health.py --all --sources raw,pages,api --max-workers 8

      - name: Publish readme and multi-entry URL check
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python publish_chatgpt_report_readme_and_check.py

      - name: Commit readme and publish check
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git pull --rebase --autostash origin "$TARGET_BRANCH" || true

          # Publish step only commits readme, URL checks, ChatGPT entry files, and individual-stock mirrors.
          git add output/latest/READ_ME_FIRST_DAILY_REPORT*.txt || true
          git add output/latest/READ_ME_FIRST_DAILY_REPORT_INDEX.* || true
          git add output/latest/report_publish_check_latest.* || true
          git add output/latest/raw_data_fetch_status_latest.* || true
          git add output/latest/individual_stock_* || true
          git add output/latest/pdf_kline_chart_status_latest.* || true
          git add output/latest/chatgpt_daily_report_packet_latest.txt || true
          git add output/latest/CHATGPT_DAILY_REPORT_PACKET.txt || true
          git add output/latest/CHATGPT_DAILY_REPORT_RULES.txt || true
          git add output/latest/chatgpt_indicator_usage_guide_latest.md || true
          git add output/latest/CHATGPT_INDICATOR_USAGE_GUIDE.txt || true
          git add docs/latest/ || true
          git add docs/data/stock_price_history/ docs/data/tdcc_stock_history/ || true

          git status --short
          git commit -m "Publish daily report readme and ChatGPT entries" || echo "No changes to commit"

          bash scripts/ci_push_with_retry.sh "$TARGET_BRANCH" 5
