name: Daily Full Pipeline

on:
  workflow_dispatch:
    inputs:
      run_child_pattern_workflows:
        description: "Run pattern_scan and pattern_chart_generator child workflows"
        required: false
        default: "false"
      run_raw_health_check:
        description: "Run full raw/pages/api health check for all core files"
        required: false
        default: "false"

permissions:
  contents: write
  actions: write

concurrency:
  group: daily-full-pipeline-${{ github.ref }}
  cancel-in-progress: false

jobs:
  daily-full-pipeline:
    runs-on: ubuntu-latest

    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_BRANCH: ${{ github.ref_name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests tabulate matplotlib pillow openpyxl lxml html5lib beautifulsoup4 reportlab pypdf

      - name: Fetch latest official daily price
        run: |
          python fetch_official_daily_price.py

      - name: Commit official daily price fetch result immediately
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git pull --rebase --autostash origin "$TARGET_BRANCH" || true

          git add data/daily_price/ || true
          git add output/latest/official_daily_price_latest.csv || true
          git add output/latest/official_price_fetch_latest.md || true
          git add output/latest/official_price_fetch_latest.json || true
          git add output/debug/official_price_fetch_debug_latest.md || true
          git add fetch_official_daily_price.py || true

          git status --short
          git commit -m "Update official daily price fetch result" || echo "No changes to commit"

          bash scripts/ci_push_with_retry.sh "$TARGET_BRANCH" 5

      - name: Pull latest after official price commit
        run: |
          git pull --rebase --autostash origin "$TARGET_BRANCH" || true

      - name: Build per-stock price history
        run: |
          python scripts/build_stock_price_history.py

      - name: Run daily stock monitor
        run: |
          python stock_daily_monitor.py

      - name: Validate daily candidate regression cases
        run: |
          python scripts/validate_daily_candidate_regression_cases.py

      - name: Build revenue breakout low response candidates
        run: |
          python build_revenue_breakout_low_response.py

      - name: Run current holdings pattern analysis
        run: |
          python current_holdings_pattern.py

      - name: Build data freshness status after stock monitor
        run: |
          python build_data_freshness_latest.py

      - name: Commit daily stock monitor and current holdings output
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git pull --rebase --autostash origin "$TARGET_BRANCH" || true

          git add data/stock_price_history/ || true
          git add output/latest/stock_price_history_manifest.csv || true
          git add output/latest/stock_price_history_manifest.json || true
          git add output/latest/stock_price_history_manifest.md || true
          git add docs/latest/stock_price_history_manifest.csv || true
          git add docs/latest/stock_price_history_manifest.json || true
          git add docs/latest/stock_price_history_manifest.md || true

          git add output/latest/stock_monitor_latest.md || true
          git add output/latest/breakout_latest.csv || true
          git add output/latest/range_rebound_watch_latest.csv || true
          git add output/latest/daily_pattern_watch_latest.csv || true
          git add output/latest/daily_candidate_regression_2484_latest.csv || true
          git add output/latest/daily_candidate_regression_2484_latest.md || true
          git add output/latest/daily_candidate_regression_2484_latest.json || true
          git add output/latest/daily_candidate_regression_8069_latest.csv || true
          git add output/latest/daily_candidate_regression_8069_latest.md || true
          git add output/latest/daily_candidate_regression_8069_latest.json || true
          git add output/latest/revenue_pullback_latest.csv || true
          git add output/latest/pullback_rebound_latest.csv || true

          git add output/latest/revenue_breakout_low_response_latest.csv || true
          git add output/latest/revenue_breakout_low_response_latest.md || true

          git add output/latest/current_holdings_pattern_latest.csv || true
          git add output/latest/current_holdings_pattern_latest.md || true
          git add output/latest/charts/current_holdings/ || true

          git add output/latest/data_freshness_latest.md || true
          git add output/latest/data_freshness_latest.csv || true
          git add scripts/build_stock_price_history.py || true

          git status --short
          git commit -m "Update daily stock monitor and current holdings report" || echo "No changes to commit"

          bash scripts/ci_push_with_retry.sh "$TARGET_BRANCH" 5

      - name: Trigger and wait for Pattern Scan
        if: ${{ github.event.inputs.run_child_pattern_workflows == 'true' }}
        run: |
          WORKFLOW_FILE="pattern_scan.yml"
          PREVIOUS_RUN_ID=$(gh run list --workflow "$WORKFLOW_FILE" --branch "$TARGET_BRANCH" --limit 1 --json databaseId --jq '.[0].databaseId' 2>/dev/null || true)
          if [ "$PREVIOUS_RUN_ID" = "null" ]; then
            PREVIOUS_RUN_ID=""
          fi
          echo "Previous $WORKFLOW_FILE run id: ${PREVIOUS_RUN_ID:-none}"

          gh workflow run "$WORKFLOW_FILE" --ref "$TARGET_BRANCH"

          RUN_ID=""
          for i in $(seq 1 60); do
            RUN_ID=$(gh run list --workflow "$WORKFLOW_FILE" --branch "$TARGET_BRANCH" --limit 1 --json databaseId --jq '.[0].databaseId' 2>/dev/null || true)
            if [ "$RUN_ID" = "null" ]; then
              RUN_ID=""
            fi
            if [ -n "$RUN_ID" ] && [ "$RUN_ID" != "$PREVIOUS_RUN_ID" ]; then
              break
            fi
            echo "Waiting for new $WORKFLOW_FILE run to appear... attempt $i"
            sleep 5
          done

          if [ -z "$RUN_ID" ] || [ "$RUN_ID" = "$PREVIOUS_RUN_ID" ]; then
            echo "Failed to locate newly triggered $WORKFLOW_FILE run"
            exit 1
          fi

          echo "Pattern Scan run id: $RUN_ID"
          gh run watch "$RUN_ID" --exit-status

      - name: Trigger and wait for Pattern Chart Generator
        if: ${{ github.event.inputs.run_child_pattern_workflows == 'true' }}
        run: |
          WORKFLOW_FILE="pattern_chart_generator.yml"
          PREVIOUS_RUN_ID=$(gh run list --workflow "$WORKFLOW_FILE" --branch "$TARGET_BRANCH" --limit 1 --json databaseId --jq '.[0].databaseId' 2>/dev/null || true)
          if [ "$PREVIOUS_RUN_ID" = "null" ]; then
            PREVIOUS_RUN_ID=""
          fi
          echo "Previous $WORKFLOW_FILE run id: ${PREVIOUS_RUN_ID:-none}"

          gh workflow run "$WORKFLOW_FILE" --ref "$TARGET_BRANCH"

          RUN_ID=""
          for i in $(seq 1 60); do
            RUN_ID=$(gh run list --workflow "$WORKFLOW_FILE" --branch "$TARGET_BRANCH" --limit 1 --json databaseId --jq '.[0].databaseId' 2>/dev/null || true)
            if [ "$RUN_ID" = "null" ]; then
              RUN_ID=""
            fi
            if [ -n "$RUN_ID" ] && [ "$RUN_ID" != "$PREVIOUS_RUN_ID" ]; then
              break
            fi
            echo "Waiting for new $WORKFLOW_FILE run to appear... attempt $i"
            sleep 5
          done

          if [ -z "$RUN_ID" ] || [ "$RUN_ID" = "$PREVIOUS_RUN_ID" ]; then
            echo "Failed to locate newly triggered $WORKFLOW_FILE run"
            exit 1
          fi

          echo "Pattern Chart Generator run id: $RUN_ID"
          gh run watch "$RUN_ID" --exit-status

      - name: Pull latest outputs after child workflows
        if: ${{ github.event.inputs.run_child_pattern_workflows == 'true' }}
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          echo "Before pull status:"
          git status --short

          git stash push -u -m "Temporary stash before pulling child workflow outputs" || true

          git pull --rebase --autostash origin "$TARGET_BRANCH"

          git stash pop || true

          echo "After pull status:"
          git status --short

      - name: Generate candidate charts and manifest
        run: |
          python generate_candidate_charts.py

      - name: Build all candidates latest files
        run: |
          python build_all_candidates_latest.py

      - name: Fetch official warrant daily data
        run: |
          python scripts/fetch_official_warrant_daily.py

      - name: Build stock-level warrant flow
        run: |
          python build_warrant_flow_latest.py

      - name: Merge warrant flow into candidates
        run: |
          python merge_warrant_flow_into_candidates.py

      - name: Apply revenue industry applicability rules
        run: |
          python scripts/apply_revenue_industry_applicability.py

      - name: Update catalyst data tables
        run: |
          python scripts/update_event_calendar_data.py
          python scripts/update_event_catalyst_data.py

      - name: Apply fundamental and event catalyst layer
        run: |
          python scripts/apply_fundamental_catalyst_layer.py

      - name: Update candidate repeat appearance tracking
        run: |
          python scripts/update_daily_candidate_signal_log.py
          python scripts/build_candidate_repeat_appearance.py
          python scripts/validate_candidate_repeat_appearance.py

      - name: Build daily candidate decision layer
        run: |
          python scripts/build_daily_candidate_decision_layer.py
          python scripts/validate_daily_candidate_decision_layer.py

      - name: Build daily theme leadership layer
        run: |
          python scripts/build_daily_theme_leadership_layer.py
          python scripts/validate_daily_theme_leadership_layer.py

      - name: Build volume breakout watch and backtest
        run: |
          python scripts/build_volume_breakout_watch.py
          python scripts/validate_volume_breakout_watch.py

      - name: Build volume attack theme layer
        run: |
          python scripts/build_volume_attack_theme_layer.py
          python scripts/validate_volume_attack_theme_layer.py

      - name: Build non-revenue momentum watch
        run: |
          python scripts/build_non_revenue_momentum_watch.py

      - name: Update daily theme status history
        run: |
          python scripts/update_daily_theme_status_history.py

      - name: Update catalyst performance tracking
        run: |
          python scripts/update_catalyst_performance.py

      - name: Build data freshness status
        run: |
          python build_data_freshness_latest.py

      - name: Update market benchmark history
        run: |
          python scripts/update_market_index_history.py

      - name: Build market regime dashboard
        run: |
          python scripts/fetch_futures_options_indicators.py
          python scripts/build_market_regime_dashboard.py
          python scripts/validate_market_regime_dashboard.py

      - name: Build TDCC overheated short-term edge
        run: |
          python scripts/build_tdcc_overheated_short_term_edge.py

      - name: Build daily short-term specialty packet
        run: |
