name: Repair Daily Price Range

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: "Start date in YYYYMMDD, example: 20260301"
        required: true
        type: string
      end_date:
        description: "End date in YYYYMMDD, example: 20260519"
        required: true
        type: string
      check_code:
        description: "Optional stock code to check after repair, example: 5291"
        required: false
        default: "5291"
        type: string
      max_days:
        description: "Safety limit for max calendar days to process"
        required: false
        default: "120"
        type: string

permissions:
  contents: write

jobs:
  repair-daily-price-range:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests lxml html5lib tabulate

      - name: Repair selected daily price range
        run: |
          python scripts/repair_daily_price_range.py \
            --start-date "$START_DATE" \
            --end-date "$END_DATE" \
            --check-code "$CHECK_CODE" \
            --max-days "$MAX_DAYS"
          python scripts/build_stock_price_history.py
          python scripts/validate_daily_price_history_continuity.py
        env:
          START_DATE: ${{ inputs.start_date }}
          END_DATE: ${{ inputs.end_date }}
          CHECK_CODE: ${{ inputs.check_code }}
          MAX_DAYS: ${{ inputs.max_days }}

      - name: Commit repaired daily price range
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add data/daily_price/ data/stock_price_history/ output/latest/repair_daily_price_range_latest.* output/latest/repair_daily_price_range_check_code_latest.csv output/latest/stock_price_history_manifest.* output/latest/daily_price_history_continuity_latest.* docs/latest/stock_price_history_manifest.* || true
          git status --short
          git commit -m "Repair daily price range" || echo "No changes to commit"
          git push
